name: Deploy Prod (dispatch)

# ── SHIPPING A BRANCH HEAD TO PROD, ON PURPOSE ──
#
# `deploy.yml` is the ordinary road: push to main, prod follows. This is the
# other one — deploy the head of whatever ref you dispatch from, without merging
# first. It exists because tier-1 control-plane code (services/, platform/,
# lib/) does NOT ship through `cells.deploy`. A cell change is live minutes
# after a push; a change to the cells service itself sits in the branch until
# CDK runs, so a fix that unblocks every cell — binary asset deploy, say — has
# no way to reach prod except main or this.
#
# It is deliberately more ceremony than `deploy.yml`, because deploying an
# unmerged branch to production is a thing you should have to mean:
#
#   * `confirm` must be typed. A mis-click on a dispatch button is not consent.
#   * the ref, its sha and its distance from main are printed BEFORE anything
#     touches AWS, and land in the run summary where an audit can read them.
#   * `cdk diff` runs first and is summarised, so what is about to change is on
#     screen rather than inferred from a branch name.
#   * it shares `deploy-prod` concurrency with the push-to-main deploy, so the
#     two can never interleave CloudFormation updates on the same stacks.
#
# NOT here, deliberately: the one-time EC2 retirement step (main's business,
# already idempotent) and the docs corpus sync (ADR-0045 — a main-branch
# concern; a branch deploy should not rewrite the published corpus from
# unmerged docs).
#
# ── WHAT THE DISPATCH API ACTUALLY CONSTRAINS, measured rather than assumed ──
#
# The REF may be ANY branch head. `POST /actions/workflows/ci.yml/dispatches`
# with `ref: claude/cell-drive-github-actions-ah1p88` returns 204 and runs that
# branch's copy of the workflow. There is no default-branch restriction on the
# ref, and the "Run workflow" dropdown in the UI is the same mechanism.
#
# What IS constrained is which workflow FILES are addressable. GitHub builds its
# workflow registry from the default branch: `list_workflows` returns six, every
# one with an html_url under `blob/main/`, and dispatching this file by name
# while it existed only on a branch returned 404 Not Found.
#
# So the practical note for this file: it is dispatchable once it is on main,
# and from then on it targets any ref and runs that ref's own copy — including
# a copy edited on the branch being deployed. Until then, `deploy.yml` is
# already registered and already carries `workflow_dispatch`, so a branch head
# can be shipped to prod today with `run_workflow(deploy.yml, ref: <branch>)`.
# What that route does not give you is the confirm string, the ahead/behind
# report, or the diff, which is the entire reason this exists.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy to prod" to confirm'
        type: string
        required: true
      diff_only:
        description: 'Stop after cdk diff — show what would change, deploy nothing'
        type: boolean
        default: false

concurrency:
  # SHARED WITH deploy.yml ON PURPOSE. Two CloudFormation updates racing on the
  # same stacks is how a stack ends up UPDATE_ROLLBACK_FAILED, which is a manual
  # recovery. Never cancel in progress: a half-applied stack update is worse
  # than a queued one.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Refuse an unconfirmed dispatch
        if: inputs.confirm != 'deploy to prod'
        run: |
          echo "::error::confirm was '${{ inputs.confirm }}' — type exactly: deploy to prod"
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history so the distance from main can be counted below; the
          # default shallow clone cannot answer "how far ahead is this".
          fetch-depth: 0

      # WHAT IS ACTUALLY ABOUT TO SHIP, before any credential is assumed. A
      # dispatch names a branch, and a branch is a moving target — the sha is
      # the only thing that identifies what ran.
      - name: Say what is being deployed
        run: |
          SHA=$(git rev-parse HEAD)
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo '?')
          BEHIND=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?')
          {
            echo "### Deploying to PROD from a branch"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${{ github.ref_name }}\` |"
            echo "| sha | \`$SHA\` |"
            echo "| ahead of main | $AHEAD commit(s) |"
            echo "| behind main | $BEHIND commit(s) |"
            echo "| dispatched by | @${{ github.actor }} |"
            echo "| mode | ${{ inputs.diff_only && 'diff only' || 'DEPLOY' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" != "0" ] && [ "$BEHIND" != "?" ]; then
            echo "::warning::this ref is $BEHIND commit(s) BEHIND main — deploying it will roll those changes back in prod"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      # THE TESTS RUN HERE, not as a separate required check. A dispatch can
      # target a branch no CI run has ever touched, so "CI was green" is not a
      # property this workflow may assume — it has to establish it.
      - name: Test
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018159942401:role/c15r-workspace-github
          aws-region: us-east-1

      - name: Bootstrap CDK (us-east-1)
        run: npm run cdk -- bootstrap --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess

      - name: What would change
        env:
          PLATFORM_DOMAINS: ${{ vars.PLATFORM_DOMAINS }}
          PLATFORM_PUBLIC_BASE_URL: ${{ vars.PLATFORM_PUBLIC_BASE_URL }}
          PLATFORM_CERT_ARN: ${{ vars.PLATFORM_CERT_ARN }}
          PLATFORM_CELL_DOMAIN: ${{ vars.PLATFORM_CELL_DOMAIN }}
        run: |
          set -o pipefail
          # cdk diff exits non-zero when there ARE differences, which is the
          # normal case for a deploy — so its status says nothing useful here
          # and the log is the artefact.
          npm run cdk -- diff --all 2>&1 | tee /tmp/cdk-diff.txt || true
          {
            echo ""
            echo "<details><summary>cdk diff</summary>"
            echo ""
            echo '```'
            tail -c 40000 /tmp/cdk-diff.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy CDK
        if: '!inputs.diff_only'
        env:
          # Same custom-domain configuration as deploy.yml — these are repo
          # Variables, so a branch deploy lands on the same domains as main and
          # cannot silently provision a second set.
          PLATFORM_DOMAINS: ${{ vars.PLATFORM_DOMAINS }}
          PLATFORM_PUBLIC_BASE_URL: ${{ vars.PLATFORM_PUBLIC_BASE_URL }}
          PLATFORM_CERT_ARN: ${{ vars.PLATFORM_CERT_ARN }}
          PLATFORM_CELL_DOMAIN: ${{ vars.PLATFORM_CELL_DOMAIN }}
        run: npm run deploy

      - name: Record what landed
        if: always()
        run: |
          {
            echo ""
            if [ "${{ inputs.diff_only }}" = "true" ]; then
              echo "**Diff only — nothing was deployed.**"
            else
              echo "**Result:** ${{ job.status }} — prod is now running \`$(git rev-parse --short HEAD)\` from \`${{ github.ref_name }}\`."
              echo ""
              echo "Prod is no longer main. Merge this ref, or the next push to main will roll it back."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
