name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_FUNCTION_URL: ${{ vars.VITE_FUNCTION_URL }}
        run: npm run build:web

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Copy e2e artifacts to dist
        if: always()
        run: |
          mkdir -p frontend/dist/e2e
          if [ -d "playwright-report" ]; then
            cp -r playwright-report frontend/dist/e2e/
          fi
          if [ -d "test-results" ]; then
            cp -r test-results frontend/dist/e2e/
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
