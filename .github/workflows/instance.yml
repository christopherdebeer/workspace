name: Workspace Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - status
          - start
          - stop
          - reboot
          - terminate
          - logs
          - provision

permissions:
  id-token: write
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.action == 'provision'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018159942401:role/c15r-workspace-github
          aws-region: eu-west-2

      - name: Get Instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name WorkspaceEc2Stack \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Status
        if: inputs.action == 'status'
        run: |
          INFO=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.instance.outputs.id }} \
            --query 'Reservations[0].Instances[0]' \
            --output json)

          STATE=$(echo "$INFO" | jq -r '.State.Name')
          IP=$(echo "$INFO" | jq -r '.PublicIpAddress // "none"')
          TYPE=$(echo "$INFO" | jq -r '.InstanceType')
          LAUNCH=$(echo "$INFO" | jq -r '.LaunchTime')
          AZ=$(echo "$INFO" | jq -r '.Placement.AvailabilityZone')

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Workspace Instance Status

          | Property | Value |
          |----------|-------|
          | **Instance ID** | \`${{ steps.instance.outputs.id }}\` |
          | **State** | \`$STATE\` |
          | **Public IP** | \`$IP\` |
          | **Instance Type** | \`$TYPE\` |
          | **Availability Zone** | \`$AZ\` |
          | **Launch Time** | \`$LAUNCH\` |
          | **Tailscale** | \`claude-workspace\` |
          EOF

      - name: Start
        if: inputs.action == 'start'
        run: |
          aws ec2 start-instances --instance-ids ${{ steps.instance.outputs.id }}
          aws ec2 wait instance-running --instance-ids ${{ steps.instance.outputs.id }}

          IP=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.instance.outputs.id }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Instance Started

          | Property | Value |
          |----------|-------|
          | **Instance ID** | \`${{ steps.instance.outputs.id }}\` |
          | **Public IP** | \`$IP\` |
          | **Tailscale** | \`claude-workspace\` |
          EOF

      - name: Stop
        if: inputs.action == 'stop'
        run: |
          aws ec2 stop-instances --instance-ids ${{ steps.instance.outputs.id }}
          echo "## Instance Stopping" >> "$GITHUB_STEP_SUMMARY"
          echo "Instance \`${{ steps.instance.outputs.id }}\` is stopping." >> "$GITHUB_STEP_SUMMARY"

      - name: Reboot
        if: inputs.action == 'reboot'
        run: |
          aws ec2 reboot-instances --instance-ids ${{ steps.instance.outputs.id }}
          echo "## Instance Rebooting" >> "$GITHUB_STEP_SUMMARY"
          echo "Instance \`${{ steps.instance.outputs.id }}\` is rebooting." >> "$GITHUB_STEP_SUMMARY"

      - name: Terminate
        if: inputs.action == 'terminate'
        run: |
          aws ec2 terminate-instances --instance-ids ${{ steps.instance.outputs.id }}
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Instance Terminated

          Run the **Deploy CDK** workflow to provision a new instance.
          EOF

      - name: Logs
        if: inputs.action == 'logs'
        run: |
          aws ec2 get-console-output \
            --instance-id ${{ steps.instance.outputs.id }} \
            --latest \
            --query 'Output' --output text > /tmp/console.log

          # Summary: last 80 lines
          echo "## Console Output (last 80 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 /tmp/console.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs artifact
        if: inputs.action == 'logs'
        uses: actions/upload-artifact@v4
        with:
          name: console-log
          path: /tmp/console.log
          retention-days: 7

      - name: Provision
        if: inputs.action == 'provision'
        run: |
          # Send user-data.sh to the running instance via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instance.outputs.id }} \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[$(jq -Rs '.' scripts/user-data.sh)]}" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for completion
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ steps.instance.outputs.id }} \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac
            sleep 5
          done

          # Capture output
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ steps.instance.outputs.id }} \
            --output json)

          STDOUT=$(echo "$RESULT" | jq -r '.StandardOutputContent')
          STDERR=$(echo "$RESULT" | jq -r '.StandardErrorContent')

          echo "$STDOUT" > /tmp/provision-stdout.log
          echo "$STDERR" > /tmp/provision-stderr.log

          # Write summary
          if [ "$STATUS" = "Success" ]; then
            echo "## Provision Succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Provision Failed (status: $STATUS)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '### stdout (last 60 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/provision-stdout.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/provision-stderr.log ]; then
            echo '### stderr (last 30 lines)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/provision-stderr.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail the job if provision failed
          [ "$STATUS" = "Success" ]

      - name: Upload provision logs
        if: inputs.action == 'provision' && always()
        uses: actions/upload-artifact@v4
        with:
          name: provision-logs
          path: /tmp/provision-*.log
          retention-days: 7
