name: Workspace Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - status
          - start
          - stop
          - reboot
          - terminate
          - logs

permissions:
  id-token: write
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018159942401:role/c15r-workspace-github
          aws-region: eu-west-2

      - name: Get Instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name WorkspaceEc2Stack \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Execute action
        run: |
          case "${{ inputs.action }}" in
            status)
              aws ec2 describe-instances \
                --instance-ids ${{ steps.instance.outputs.id }} \
                --query 'Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress,LaunchTime:LaunchTime,InstanceType:InstanceType}' \
                --output table
              ;;
            start)
              aws ec2 start-instances --instance-ids ${{ steps.instance.outputs.id }}
              echo "Starting instance. Tailscale hostname: claude-workspace"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids ${{ steps.instance.outputs.id }}
              echo "Stopping instance."
              ;;
            reboot)
              aws ec2 reboot-instances --instance-ids ${{ steps.instance.outputs.id }}
              echo "Rebooting instance."
              ;;
            terminate)
              aws ec2 terminate-instances --instance-ids ${{ steps.instance.outputs.id }}
              echo "Instance terminated. Run 'Deploy CDK' workflow to provision a new one."
              ;;
            logs)
              aws ec2 get-console-output \
                --instance-id ${{ steps.instance.outputs.id }} \
                --latest \
                --query 'Output' --output text
              ;;
          esac
