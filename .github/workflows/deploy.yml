name: Deploy CDK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'platform/**'
      - 'services/**'
      - 'scripts/**'
      - 'cdk.json'
      - 'package.json'
      - 'tsconfig.json'
  # ── THIS ALSO SHIPS A BRANCH HEAD TO PROD ──
  #
  # Dispatching this workflow against any ref deploys THAT REF'S HEAD, and runs
  # that ref's own copy of this file. `actions/checkout@v4` below takes no
  # explicit `ref`, so it checks out `github.ref` — the ref the dispatch named,
  # not main. Which is the route for tier-1 control-plane code: `services/`,
  # `platform/` and `lib/` do NOT ship through `cells.deploy`, so a fix to (say)
  # the cells service reaches prod only through main or through this.
  #
  #   run_workflow(deploy.yml, ref: <branch>)      # 204, runs that branch
  #
  # Measured, because the obvious assumption is wrong in both directions: the
  # REF is unrestricted (a dispatch against a feature branch returns 204 and
  # runs it), while the FILE must exist on the default branch to be addressable
  # at all — the workflow registry is built from main, and dispatching a
  # workflow that lived only on a branch returned 404.
  #
  # ── GUARDS THIS DOES NOT HAVE, if a branch deploy ever goes wrong ──
  #
  # Deploying an unmerged branch to production has sharp edges this workflow
  # does nothing about. Written down rather than built, deliberately — none of
  # it is wanted today:
  #
  #   * a typed confirmation, so a mis-click is not consent
  #   * `cdk diff --all` into the run summary before deploying, and a
  #     diff-only mode, so what is about to change is on screen
  #   * how far the ref is ahead of AND BEHIND main. Behind-ness is the trap:
  #     deploying a stale branch silently ROLLS BACK whatever main has that it
  #     does not, which is not what anyone expects from a deploy button
  #   * `if: github.event_name == 'push'` on the docs-sync step below. It
  #     publishes the repo's docs into the live substrate corpus (ADR-0045), so
  #     a branch dispatch republishes the corpus from UNMERGED docs. It is
  #     continue-on-error and gated on PARC_TOKEN, so the blast radius is small,
  #     but it is the one step here that does something a branch deploy should
  #     not. The EC2 retirement step is harmless by comparison — idempotent and
  #     already a no-op.
  workflow_dispatch:
    inputs:
      force_docs_sync:
        # docs-sync skips a doc whose sha is unchanged, so a decomposition that
        # died mid-chain never gets re-triggered — its source is identical, so
        # nothing re-writes the `markdown` fact the reaction watches. That is
        # normally the right default (re-ingesting ~60 unchanged docs per deploy
        # would bump 60 revisions and pollute the trajectory), but it leaves no
        # way to recover a stranded backlog. On 2026-07-29 a broken edge timeout
        # stalled every large doc at `done: 0`; fixing it unblocked the chain but
        # the already-stranded runs stayed stranded, because their bytes had not
        # changed. This is the lever for that: re-ingest everything, re-trigger
        # every decomposition. Use it after fixing an ingest-path defect.
        description: 'Re-ingest every doc regardless of sha (recovers decompositions stranded mid-chain)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018159942401:role/c15r-workspace-github
          aws-region: us-east-1

      - name: Bootstrap CDK (us-east-1)
        run: npm run cdk -- bootstrap --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess

      # One-time retirement (2026-08-01 cost review): the eu-west-2 Tailscale
      # dev box was unused and its idle EBS cost ~$13/mo. Snapshot the data
      # volume (cheap insurance — delete the snapshot when confident), delete
      # the stack (terminates the instance + its root volume), then delete the
      # RETAINed data volume. Idempotent: a no-op once the stack is gone.
      # Remove this step in a later cleanup pass.
      - name: Retire the workspace EC2 stack
        continue-on-error: true
        run: |
          REGION=eu-west-2
          if ! aws cloudformation describe-stacks --stack-name WorkspaceEc2Stack --region $REGION >/dev/null 2>&1; then
            echo "WorkspaceEc2Stack already gone - nothing to retire."
            exit 0
          fi
          VOLUME_ID=$(aws cloudformation describe-stacks --stack-name WorkspaceEc2Stack --region $REGION \
            --query "Stacks[0].Outputs[?OutputKey=='DataVolumeId'].OutputValue" --output text 2>/dev/null) || true
          if [ -n "$VOLUME_ID" ] && [ "$VOLUME_ID" != "None" ]; then
            echo "Final snapshot of $VOLUME_ID before retirement..."
            aws ec2 create-snapshot --volume-id "$VOLUME_ID" --region $REGION \
              --description "workspace-ec2 final snapshot before retirement (2026-08-01 cost review)" \
              --tag-specifications 'ResourceType=snapshot,Tags=[{Key=Name,Value=workspace-ec2-final}]' || true
          fi
          echo "Deleting WorkspaceEc2Stack..."
          aws cloudformation delete-stack --stack-name WorkspaceEc2Stack --region $REGION
          aws cloudformation wait stack-delete-complete --stack-name WorkspaceEc2Stack --region $REGION || true
          if [ -n "$VOLUME_ID" ] && [ "$VOLUME_ID" != "None" ]; then
            echo "Deleting retained data volume $VOLUME_ID..."
            for i in $(seq 1 36); do
              STATE=$(aws ec2 describe-volumes --volume-ids "$VOLUME_ID" --region $REGION --query 'Volumes[0].State' --output text 2>/dev/null) || break
              [ "$STATE" = "available" ] && break
              sleep 5
            done
            aws ec2 delete-volume --volume-id "$VOLUME_ID" --region $REGION || true
          fi
          echo "Retired."

      - name: Deploy CDK
        env:
          # Custom-domain config (set these as repo Variables to enable a custom
          # domain; empty/unset = CloudFront default domain). PLATFORM_DOMAINS is
          # comma-separated, e.g. "parc.land,www.parc.land".
          PLATFORM_DOMAINS: ${{ vars.PLATFORM_DOMAINS }}
          PLATFORM_PUBLIC_BASE_URL: ${{ vars.PLATFORM_PUBLIC_BASE_URL }}
          PLATFORM_CERT_ARN: ${{ vars.PLATFORM_CERT_ARN }}
          # Host-isolated cell namespace (docs/cell-origin-isolation.md). Set the
          # repo Variable to e.g. "on.parc.land" to provision the *.on.parc.land
          # cell distribution + DNS-validated wildcard cert. Empty = not created.
          # Optional: WEBAUTHN_EXPECTED_ORIGINS pins extra allowed ceremony origins.
          PLATFORM_CELL_DOMAIN: ${{ vars.PLATFORM_CELL_DOMAIN }}
        run: npm run deploy

      # ADR-0045: the repo's docs are a substrate corpus (file/docs/* facts,
      # ADR-0027) — keep it current automatically. sha change-detection in the
      # script means an unchanged corpus is a no-op (no revision churn). Gated
      # on the PARC_TOKEN secret (mint a narrow write:workspace token via
      # auth.mintToken and add it as a repo secret); never fails the deploy.
      - name: Sync docs corpus into the substrate
        continue-on-error: true
        env:
          PARC_TOKEN: ${{ secrets.PARC_TOKEN }}
        run: |
          if [ -z "$PARC_TOKEN" ]; then
            echo "PARC_TOKEN secret not set — skipping docs-sync (mint one: act auth.mintToken {scope:'read:workspace write:workspace', label:'docs-sync-ci'})"
            exit 0
          fi
          node scripts/docs-sync.mjs --commit --delay 3000 ${{ inputs.force_docs_sync && '--force' || '' }}
