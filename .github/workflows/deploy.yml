name: Deploy CDK

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'lambda/**'
      - 'scripts/**'
      - 'cdk.json'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018159942401:role/c15r-workspace-github
          aws-region: us-east-1

      - name: Bootstrap CDK (us-east-1)
        run: npm run cdk -- bootstrap --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess

      - name: Bootstrap CDK (eu-west-2)
        run: CDK_DEFAULT_REGION=eu-west-2 npm run cdk -- bootstrap aws://018159942401/eu-west-2 --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess

      - name: Stop workspace instance (graceful shutdown before deploy)
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name WorkspaceEc2Stack \
            --region eu-west-2 \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text 2>/dev/null) || true

          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --region eu-west-2 \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text 2>/dev/null) || true

            if [ "$STATE" = "running" ]; then
              echo "Stopping instance $INSTANCE_ID (state: $STATE)..."
              aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region eu-west-2
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region eu-west-2
              echo "Instance stopped."
            else
              echo "Instance $INSTANCE_ID is $STATE — no stop needed."
            fi
          else
            echo "No existing workspace instance found — first deploy."
          fi

      - name: Deploy CDK
        run: npm run deploy
