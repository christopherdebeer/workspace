<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=overlays-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="canvas">
  <title>🌲 canvas</title>
  <style>
    /* Critical input invariants at FIRST PAINT (the bundle re-asserts them
       later, but iOS latches gestures before late-injected styles apply):
       zoom/pan belong to the app, not the browser. */
    html, body { touch-action: none; -webkit-user-select: none; user-select: none; overflow: hidden; overscroll-behavior: none; }
    #canvas { touch-action: none; }
    #err-banner { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 99999; background: crimson; color: #fff; font: 12px monospace; max-height: 45vh; overflow: auto; }
    #err-banner-text { padding: 6px 10px; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
    #err-banner-bar { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 8px; background: rgba(0,0,0,0.25); position: sticky; top: 0; }
    #err-banner-bar button { font: 11px monospace; color: #fff; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  </style>
  <script>
    // iOS Safari: double-tap smart-zoom rides TOUCH events and survives
    // pointer-event preventDefault — a non-passive touchend guard is the
    // only reliable suppressor. Editable targets keep native behaviour.
    (function () {
      var last = 0;
      document.addEventListener('touchend', function (e) {
        var t = e.target;
        if (t && t.closest && t.closest('input, textarea, select, [contenteditable], .CodeMirror')) return;
        var now = Date.now();
        if (now - last < 350) e.preventDefault();
        last = now;
      }, { passive: false, capture: true });
      // Surface runtime errors on-device. The banner is now SELECTABLE + has
      // copy/dismiss controls (a tap no longer wipes the message before you can
      // read it), and every error is appended to a localStorage ring buffer so
      // a crash survives dismissal — retrieve with window.__canvasErrors().
      var ERRKEY = 'parc.canvas.errlog';
      function persist(msg) {
        try {
          var log = JSON.parse(localStorage.getItem(ERRKEY) || '[]');
          log.push({ t: new Date().toISOString(), url: location.href, msg: String(msg) });
          while (log.length > 50) log.shift();
          localStorage.setItem(ERRKEY, JSON.stringify(log));
        } catch (e) { /* storage blocked */ }
      }
      function show(msg) {
        persist(msg);
        var b = document.getElementById('err-banner');
        var t = document.getElementById('err-banner-text');
        if (!b || !t) return;
        // Stack newest-on-top; keep prior messages so a cascade is all readable.
        t.textContent = (new Date().toLocaleTimeString() + '  ' + String(msg) + '\n' + t.textContent).slice(0, 8000);
        b.style.display = 'block';
      }
      // Exposed so the app can surface *caught* failures too — a swallowed load
      // error (e.g. a blank board after the SSR paint) is otherwise invisible.
      window.__canvasReport = show;
      // Retrieve / clear the persisted crash log from the console.
      window.__canvasErrors = function () { try { return JSON.parse(localStorage.getItem(ERRKEY) || '[]'); } catch (e) { return []; } };
      window.__canvasErrorsClear = function () { try { localStorage.removeItem(ERRKEY); } catch (e) {} };
      // The red banner is for REAL app failures (app.js). Element content scripts
      // (board elements often carry legacy inline scripts referencing a global
      // `controller`, and renderer modules load from data-URIs) throw expected,
      // non-fatal errors — those are logged + persisted + attributed to their
      // element, but must NOT raise the jarring full-width banner.
      function isAppError(fn) { return (fn || '').indexOf('/app.js') >= 0; }
      window.addEventListener('error', function (e) {
        var where = (e.filename || '').split('/').pop() + ':' + e.lineno;
        if (isAppError(e.filename)) { show('⚠ ' + e.message + ' @ ' + where); return; }
        var el = window.__canvasScriptEl;
        var msg = 'element script: ' + e.message + (el ? '  [' + el + ']' : '') + ' @ ' + where;
        console.warn('[canvas] ' + msg);
        persist(msg); // retrievable via __canvasErrors(), no banner
      });
      window.addEventListener('unhandledrejection', function (e) { show('⚠ (async) ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      document.addEventListener('DOMContentLoaded', function () {
        var copy = document.getElementById('err-copy');
        var clear = document.getElementById('err-close');
        var b = document.getElementById('err-banner');
        var t = document.getElementById('err-banner-text');
        if (copy) copy.addEventListener('click', function () {
          var text = (t && t.textContent) || '';
          if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { copy.textContent = 'copied'; setTimeout(function () { copy.textContent = 'copy'; }, 1200); });
        });
        if (clear) clear.addEventListener('click', function () { if (t) t.textContent = ''; b.style.display = 'none'; });
      });
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.1/mode/htmlmixed/htmlmixed.min.js"></script>
</head>

<body>
  <script>
    // On-device console: ?debug=1 (sticky; ?debug=0 clears) — never in embeds.
    (function () {
      try {
        var qs = new URLSearchParams(location.search);
        if (qs.get('debug') === '1') localStorage.setItem('parc.canvas.debug', '1');
        if (qs.get('debug') === '0') localStorage.removeItem('parc.canvas.debug');
        if (qs.get('embed') === '1' || localStorage.getItem('parc.canvas.debug') !== '1') return;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/eruda';
        s.onload = function () { window.eruda && window.eruda.init(); };
        document.head.appendChild(s);
      } catch (e) { /* storage unavailable */ }
    })();
  </script>

  <div id="err-banner"><div id="err-banner-bar"><button id="err-copy">copy</button><button id="err-close">dismiss</button></div><div id="err-banner-text"></div></div>

  <button id="drillUp">↑ Drill Up</button>

  <div id="canvas" mode="navigate">
    <svg id="edges-layer"></svg>
    <div id="canvas-container"></div>
    <div id="context-menu"></div>
  </div>

  <div id="static-container"></div>

  <button id="mode">
    <i class="fa-solid fa-hand"></i> direct
  </button>

  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <div class="modal-versions">
        <div class="versions-nav">
          <button id="versions-prev"><i class="fa-solid fa-angle-left"></i></button>
          <span id="versions-info">Version X of Y</span>
          <button id="versions-next"><i class="fa-solid fa-angle-right"></i></button>
        </div>
        <div id="modal-error"></div>
      </div>
      <div class="modal-tabs">
        <button id="tab-content" class="active">Content</button>
        <button id="tab-src">Src</button>
      </div>
      <div class="modal-editor">
        <div id="editor-content"></div>
        <div id="editor-src"></div>
      </div>
      <div class="modal-buttons">
        <button id="modal-clear">Clear</button>
        <button id="modal-copy">Copy</button>
        <button id="modal-cancel">Close</button>
        <button id="modal-save">Save</button>
        <button id="modal-generate">Generate</button>
      </div>
    </div>
  </div>

  <script type="module" src="/@c15r/canvas/app.js"></script>
</body>

</html>
