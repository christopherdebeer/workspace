<!doctype html>
<html lang="en" data-exp="changes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Changes · I Ching</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#202124;background:#fff;--blue:#087cff;--muted:#686d75}
*{box-sizing:border-box}body{margin:0}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{font:inherit;border:0;background:none;color:var(--blue);cursor:pointer;min-height:44px;padding:10px 12px}button:disabled{cursor:default;color:#757b84}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button[hidden],[hidden]{display:none!important}
header{height:64px;padding: max(12px,env(safe-area-inset-top)) 20px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}header a{font-size:13px;text-decoration:none;color:var(--muted)}header span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}header button{font-size:13px;padding-right:0}
#cast{min-height:calc(100svh - 64px);display:flex;flex-direction:column;align-items:center;padding:0 24px max(26px,env(safe-area-inset-bottom))}.centre{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;padding:30px 0;min-height:360px}.figure{width:158px;display:flex;flex-direction:column-reverse;gap:10px}.line{height:18px;display:flex;gap:20px;position:relative;color:var(--blue);transition:opacity .5s,transform .5s}.line i{background:currentColor;flex:1;display:block}.line.empty{color:#f1f2f4}.line.changing:after{content:'○';position:absolute;right:-28px;top:-4px;font-size:20px;color:var(--blue)}.line.changing.yin:after{content:'×'}.line.fresh{animation:arrive .65s ease-out}.identity{text-align:center;margin-top:24px;min-height:140px}.identity h1{font-size:20px;font-weight:400;margin:0 0 12px}.han{font-size:44px;line-height:1.2}.pinyin{font-size:17px;margin:12px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}#progress{font-size:13px;color:var(--muted);min-height:20px;text-align:center}#roll{font-size:26px;min-width:140px;margin:12px 0 0}#read{font-size:17px}#question{border:0;border-bottom:1px solid #eceef1;border-radius:0;width:min(100%,360px);font:inherit;font-size:16px;text-align:center;padding:12px 4px;background:white;color:#333}#question::placeholder{color:#777}#question:focus{outline:0;border-color:var(--blue)}.under{min-height:40px}.under button{font-size:13px}
#reading,#journal,#browse{max-width:620px;margin:auto;padding:20px 26px 70px}h2{font-size:27px;font-weight:400;line-height:1.25;margin:24px 0 8px}.reading-top{display:flex;align-items:center;gap:35px;margin:34px 0}.reading-top .figure{width:110px;flex-shrink:0;gap:7px}.reading-top .line{height:12px;gap:14px}.reading-top .line:after{right:-22px;font-size:16px;top:-5px}.trigrams{font-size:15px;line-height:1.7}.trigrams small{display:block;font-size:11px;color:var(--muted);margin-top:6px}.reflection{font-family:'Iowan Old Style',Georgia,serif;font-size:25px;line-height:1.5;margin:32px 0}.caption{font-size:13px;line-height:1.7;color:var(--muted)}.section{border-top:1px solid #e8ebef;margin-top:30px;padding-top:20px}.section h3{font-weight:400;font-size:18px;margin:0 0 12px}.line-list{line-height:1.9;padding-left:20px;font-size:14px}#note{resize:vertical;width:100%;min-height:95px;padding:12px;border:1px solid #dce0e5;border-radius:0;font-family:inherit;font-size:16px;line-height:1.5}#save-status{font-size:13px;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions button{padding-left:0;padding-right:20px}.query{font-size:15px;line-height:1.5;white-space:pre-wrap}.entry{border-top:1px solid #e8ebef;padding:16px 0}.entry button{text-align:left;padding:0;display:block}.entry p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.entry small{color:var(--muted)}#browse-list{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}#browse-list button{text-align:left;border-bottom:1px solid #e8ebef;font-size:14px;padding:14px 0}.preview header,.preview .controls,.preview #question,.preview #progress{display:none}.preview #cast{min-height:100svh;padding:0}.preview .centre{min-height:0}.preview .identity{min-height:0}.preview .figure{width:140px}.preview .han{font-size:32px}.preview .identity h1{font-size:16px}.preview .pinyin{font-size:13px}@keyframes arrive{from{opacity:.1;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-height:600px){.centre{padding:15px 0;min-height:290px}.identity{min-height:100px;margin-top:15px}.identity .han{font-size:32px}.figure{gap:7px}.line{height:14px}}

.classical{margin:30px 0}.classical h3{font-size:15px;font-weight:500;margin:25px 0 10px}.classical blockquote,.line-passage blockquote{margin:0;font-family:'Iowan Old Style',Georgia,serif;font-size:21px;line-height:1.65;white-space:pre-line;overflow-wrap:break-word}.line-passage{margin:26px 0}.line-passage h4{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 12px}.all-lines summary{cursor:pointer;min-height:44px}.reflection.supplementary{font-size:22px;margin:18px 0}.query{overflow-wrap:anywhere}
.cadence{text-align:center;margin-top:12px;color:var(--muted);font-size:12px}.cadence select{font:inherit;font-size:16px;color:var(--blue);background:white;border:0;padding:8px;min-height:44px}.cadence p{font-size:11px;margin:0;max-width:310px;line-height:1.5}
</style>
</head>
<body>
<header><a href="/" id="back">← lab</a><span>Changes</span><button id="history">Journal</button></header>
<main>
<section id="cast"><div class="centre"><div id="figure" class="figure" role="img" aria-label="Six uncast lines"></div><div id="identity" class="identity"></div><p id="progress" role="status" aria-live="polite">A moment to consider.</p></div><input id="question" maxlength="400" placeholder="A question, if you have one" aria-label="Question (optional)"><div class="cadence controls"><label for="cadence">Renew cast</label><select id="cadence"><option value="hourly">Hourly</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select><p id="cadence-note">Same question, same cast within each local time window.</p></div><div class="controls"><button id="roll">Roll</button><button id="read" hidden>Read the hexagram →</button></div><div class="under controls"><button id="browse-button">The 64 hexagrams</button></div></section>
<section id="reading" hidden tabindex="-1"></section>
<section id="journal" hidden tabindex="-1"><h2>Journal</h2><p class="caption">Readings you choose to keep, stored only in this browser.</p><div id="journal-list"></div></section>
<section id="browse" hidden tabindex="-1"><h2>The 64 hexagrams</h2><p class="caption">In King Wen order. Explore without casting.</p><div id="browse-list"></div></section>
</main>
<script type="module" src="{{app}}"></script>
</body>
</html>
