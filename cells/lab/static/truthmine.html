<!doctype html>
<html lang="en" data-exp="truthmine">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truth Mine · an instrument for noticing</title>
<style>
:root{color-scheme:light;--paper:#f3f1e7;--ink:#262f2a;--soft:#627069;--line:#c4c9bb;--accent:#a34827;--green:#315f51}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:clamp(18px,5vw,56px);min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;gap:12px}header a,button.link{color:var(--soft);font:12px ui-monospace,monospace;text-decoration:none}h1{font:normal clamp(25px,5vw,42px)/1.1 Georgia,serif;margin:38px 0 8px}p{margin:8px 0 16px}.small,small{font:12px/1.5 ui-monospace,monospace;color:var(--soft)}.plot{position:relative;margin:25px 0 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}svg{display:block;width:100%;height:auto;touch-action:pan-y}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:transparent;padding:9px 13px;cursor:pointer;border-radius:3px;min-height:42px}button:hover,button:focus-visible{border-color:var(--green);outline:none}button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{opacity:.45;cursor:default}button.link{border:0;padding:5px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}section{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}h2{font:normal 24px Georgia,serif;margin:0 0 8px}article{border:1px solid var(--line);padding:13px;margin:9px 0;background:#ffffff40}article strong{font-weight:600}input[type=text]{width:100%;border:1px solid var(--line);background:transparent;padding:10px;border-radius:3px}details{margin:14px 0}summary{cursor:pointer;color:var(--soft)}.measure{font:32px Georgia,serif;color:var(--green)}.error{color:var(--accent)}.tag{color:var(--accent)}[hidden]{display:none!important}#status{min-height:20px}.mark{cursor:pointer}.mark:focus{outline:none;stroke:var(--accent);stroke-width:3}.preview header,.preview #actions,.preview #work,.preview #room,.preview #hint,.preview .small{display:none}.preview main{min-height:0;padding:15px}.preview h1{margin:5px 0 0;font-size:26px}.preview .plot{margin:12px 0}.preview #intro{font-size:12px;margin:3px 0}
.trace-list{max-height:160px;overflow:auto;padding:2px}.reading{align-items:flex-start;gap:32px}.instrument-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}.instrument-grid article{margin:0}.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.bench{border-color:var(--green);background:#e9eee4;margin-top:18px}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:6px;margin:12px 0}.slots button{text-align:left;display:flex;flex-direction:column}.slots button.primary small{color:#e9eee4}.branch{padding:8px 0 8px 12px;margin:5px 0 5px 4px;border-left:1px solid var(--green)}.branch .branch{margin-left:8px}.measure{overflow-wrap:anywhere}.reading .measure{font-size:26px}button[aria-pressed=true]{border-color:var(--accent)}
</style>
</head>
<body><main><header><a href="/">← lab</a><span class="small">TRUTH MINE / 002</span><a href="{{readme}}">notes ↗</a></header><h1>Something is changing.</h1><p id="intro">Watch for a little while.</p>
<div class="plot"><svg id="plot" viewBox="0 0 640 300" role="img" aria-label="A changing signal. Tap the trace to leave a mark."></svg></div>
<div class="row" id="actions"><button id="pause">Pause</button><button id="mark">Leave a mark</button><span class="spacer"></span><button id="back" hidden>← Earlier</button><button id="forward" hidden>Later →</button><button id="live" hidden>Now →</button></div>
<p id="hint" class="small" aria-live="polite"></p><div id="work"></div>
<section id="room"><details><summary>Other inhabitants / room</summary><p class="small" id="roomInfo"></p><div class="row"><button id="share">Open a shared room</button><button id="copy" hidden>Copy invitation</button><button id="newIdentity">Enter as another inhabitant</button></div><p class="small">Shared rooms are invitation-linked, not private accounts. Anyone with the invitation can read and contribute. Do not enter personal information.</p></details><div id="status" class="small" aria-live="polite"></div></section>
</main><script type="module" src="{{app}}"></script></body></html>
