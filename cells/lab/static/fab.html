<!doctype html>
<html lang="en" data-exp="fab">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ddd0bd">
  <title>Fab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ddd0bd; overflow: hidden; touch-action: none; }
    body { color: #4a3826; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; -webkit-user-select: none; user-select: none; display: flex; flex-direction: column; }
    #stage { position: relative; flex: 1; min-height: 0; }
    canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    canvas#card { position: absolute; right: 10px; bottom: 30px; width: 92px; height: 120px; border-radius: 6px; box-shadow: 0 3px 10px rgba(60,40,20,.28); transform: rotate(2.5deg); cursor: pointer; z-index: 2; }
    canvas#sheet { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); border-radius: 12px; box-shadow: 0 8px 30px rgba(60,40,20,.25); display: none; z-index: 3; }
    body.sheet canvas#sheet { display: block; }
    #notes { position: absolute; left: 12px; right: 112px; bottom: 8px; font-size: 12px; font-weight: 700; color: #5b4a36; text-shadow: 0 1px 0 rgba(255,250,240,.6); z-index: 2; }
    nav { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 6px; align-items: center; z-index: 4; flex-wrap: wrap; }
    nav a, nav button { all: unset; cursor: pointer; font-size: 13px; font-weight: 700; padding: 7px 11px; border-radius: 999px; background: rgba(255,250,240,.85); box-shadow: 0 1px 4px rgba(60,40,20,.15); }
    nav .title { font-size: 18px; font-weight: 800; margin-right: auto; padding: 4px 4px; background: none; box-shadow: none; }
    nav #twirl { background: #e0566e; color: #fff6ea; }
    body.sheet nav #pattern { background: #4a3826; color: #fff6e6; }
    #bench { flex: none; background: linear-gradient(#c79a6a, #b98a5a); padding: 8px 10px max(10px, env(safe-area-inset-bottom)); box-shadow: inset 0 3px 0 rgba(255,255,255,.18), 0 -6px 18px rgba(60,40,20,.18); }
    .row { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    #methods button { all: unset; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 4px; border-radius: 12px; background: rgba(255,248,236,.5); cursor: pointer; font-weight: 800; font-size: 13px; }
    #methods svg { width: 26px; height: 24px; fill: none; stroke: #4a3826; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #methods button.on { background: #fff8ec; box-shadow: 0 2px 8px rgba(60,40,20,.25); }
    #knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
    .knob { text-align: center; touch-action: none; cursor: grab; }
    .knob svg { width: 52px; height: 52px; display: block; margin: 0 auto; overflow: visible; }
    .knob .face { fill: #fff6e6; stroke: #8a6440; stroke-width: 2; }
    .knob .track { fill: none; stroke: rgba(90,60,30,.18); stroke-width: 5; stroke-linecap: round; }
    .knob .arc { fill: none; stroke: #e0566e; stroke-width: 5; stroke-linecap: round; }
    .knob .dot { fill: #4a3826; }
    .knob.turning svg { transform: scale(1.08); }
    .knob b { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-top: 1px; }
    .knob i { display: block; font-style: normal; font-size: 12px; font-weight: 800; color: #fff8ec; min-height: 15px; white-space: nowrap; }
    .swatch, .print { all: unset; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; padding: 4px 6px; border-radius: 10px; cursor: pointer; min-width: 44px; }
    .swatch span { width: 30px; height: 22px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(60,40,20,.25), 0 1px 2px rgba(60,40,20,.2); background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.04) 0 2px, transparent 2px 4px) !important; }
    .print canvas { border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(60,40,20,.25), 0 1px 2px rgba(60,40,20,.2); }
    .swatch.on, .print.on { background: #fff8ec; box-shadow: 0 2px 6px rgba(60,40,20,.25); }
    .preview nav, .preview #bench, .preview #card, .preview #notes { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="card" title="the pattern"></canvas>
    <canvas id="sheet"></canvas>
    <div id="notes"></div>
    <nav><a href="/">← lab</a><span class="title">Fab</span><button id="twirl">twirl</button><button id="sew">sew</button><button id="pattern">pattern</button><button id="surprise">surprise</button><a href="{{readme}}">notes</a></nav>
  </div>
  <div id="bench">
    <div class="row" id="methods"></div>
    <div id="knobs"></div>
    <div class="row" id="fabrics"></div>
    <div class="row" id="prints" style="margin-bottom:0"></div>
  </div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
