<!doctype html>
<html lang="en" data-exp="cloudfold"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#637f99"><title>Cloudfold</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#637f99;color:#fff8ed;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:max(24px,env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}h1{font-weight:normal;font-size:30px;letter-spacing:.02em;margin:0}small{display:block;margin-top:7px;opacity:.75;font:10px/1.6 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}a{color:inherit;pointer-events:auto}details{position:fixed;left:20px;bottom:max(22px,env(safe-area-inset-bottom));width:min(320px,calc(100% - 40px));background:#1f304357;backdrop-filter:blur(18px);border:1px solid #ffffff30;padding:14px 18px;border-radius:3px;font:12px/1.5 system-ui,sans-serif}summary{cursor:pointer;letter-spacing:.08em}label{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:14px}input{width:155px;accent-color:#f4dec1}button,select{font:inherit;background:#ffffff10;color:inherit;border:1px solid #ffffff60;border-radius:2px;padding:8px;min-height:36px}select option{color:#222}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:4px}.actions{display:flex;gap:8px;margin-top:16px}p{font-size:11px;opacity:.75;margin-bottom:0}#message{position:fixed;top:40%;left:10%;right:10%;text-align:center}.preview header,.preview details{display:none}
</style></head><body>
<canvas aria-label="An evolving volumetric cloud. Drag to orbit; pinch or scroll to zoom."></canvas>
<header><div><h1>Cloudfold</h1><small>Fold space. Lose the mirror.<br>Study <span id="seed">1947</span></small></div><a href="{{readme}}">Notes</a></header>
<details open><summary>Atmosphere</summary>
<label for="conceal">Hide symmetry<input id="conceal" type="range" min="0" max="1" step=".01"></label>
<label for="fullness">Gather<input id="fullness" type="range" min="0" max="1" step=".01"></label>
<label for="folds">Folds<input id="folds" type="range" min="2" max="8" step="1"></label>
<label for="light">Light<select id="light"><option value="0">Daylight</option><option value="1">Afterglow</option><option value="2">Storm</option></select></label>
<div class="actions"><button id="another">Another cloud</button><button id="pause">Hold time</button></div><p>Drag to orbit · pinch to approach.<br>Lower “Hide symmetry” to see the construction.</p>
</details><div id="message" role="status"></div><script type="module" src="{{app}}"></script></body></html>
