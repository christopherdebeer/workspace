<!doctype html>
<html lang="en" data-exp="volley"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3c9a4"><title>Volley</title>
<style>
:root{--ink:#1b2a78;--ring:#1b2a78;--paper:#fbf1e2}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#f0c3a0;color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pane,#flash{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#pane i,#mark{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
/* a hand: a ring, and round it an arc of dashes growing as the touch settles (empty: a catch; full: a bat) */
#pane i{border:2px solid var(--ring);background:radial-gradient(circle,#fff0 50%,#fff2 100%)}
#pane i svg{position:absolute;inset:-14%;width:128%;height:128%;overflow:visible;transform:rotate(-90deg)}
#pane i circle{fill:none;stroke:var(--ring);stroke-width:7}
#pane i.hit{border-style:dashed;opacity:.85}
#pane i.holding{border-width:3px;background:radial-gradient(circle,#fff0 40%,#fff4 100%)}
#mark{border:2px solid var(--ring);opacity:.9}
#edge{position:fixed;width:150px;height:150px;margin:-75px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff8eacc,#fff8ea00 65%)}
#edge.on{animation:edge .28s ease-out}
@keyframes edge{0%{opacity:var(--k,1);transform:scale(.4)}100%{opacity:0;transform:scale(1.2)}}
#top{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none}
#name{font-size:15px;letter-spacing:.42em;text-transform:uppercase}
#depth{font-size:26px;letter-spacing:.1em;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
#best{position:absolute;right:0;top:32px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.7;white-space:nowrap}
#left{display:flex;gap:7px;align-items:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
#left i{display:block;width:9px;height:19px;background:var(--ink);border-radius:100% 0;transform:rotate(18deg);transition:opacity .3s,transform .3s}
#left i.gone{opacity:.16;transform:rotate(18deg) scale(.7)}
#left b{display:block;width:13px;height:13px;border:1.5px solid var(--ink);border-radius:50%;transition:background .3s}
#left b.done{background:var(--ink)}
#mid{position:fixed;left:0;right:0;top:14%;text-align:center;pointer-events:none;padding:0 26px}
#say{font-size:clamp(46px,15vw,96px);letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;line-height:1;font-weight:400}
#sub{margin:16px auto 0;max-width:30em;font-size:11px;line-height:1.9;letter-spacing:.2em;text-transform:uppercase}
#say:empty,#sub:empty,#best:empty{display:none}
#modes{position:fixed;left:0;right:0;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
button{font:inherit;font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:#fbf1e2c8;border:1px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:999px;padding:0 15px;min-height:40px;display:inline-flex;align-items:center;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#bar{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;transition:opacity .4s}
#bar a{font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:#fbf1e2c8;border:1px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:999px;padding:0 15px;min-height:40px;display:inline-flex;align-items:center}
#toHand{background:var(--ink);color:var(--paper);border-color:var(--ink)}
[data-phase="play"] #bar,[data-phase="held"] #bar{opacity:0;pointer-events:none}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;text-shadow:0 1px 14px #fff8}
#banner b{display:block;font-weight:400;font-size:clamp(24px,7.5vw,44px);letter-spacing:.16em;text-transform:uppercase}
#banner span{display:block;margin-top:10px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#banner.on{animation:banner 2.4s ease-out}
@keyframes banner{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-55%);width:min(340px,calc(100% - 40px));padding:26px 22px 20px;text-align:center;background:#fbf1e2e6;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px #3a140a30}
#big{font-size:56px;letter-spacing:.06em;line-height:1;font-variant-numeric:tabular-nums}
#lines p{margin:10px 0 0;font-size:11px;line-height:1.8;letter-spacing:.16em;text-transform:uppercase}
#lines em{font-style:normal;opacity:.75}
#card .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
#again{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#flash{opacity:0}
#flash.miss{background:radial-gradient(ellipse at 50% 50%,#1b2a7800 25%,color-mix(in srgb,var(--ink) 70%,transparent) 100%);animation:fade .8s ease-out}
#flash.through{background:radial-gradient(ellipse at 50% 50%,#fff6e6b0 0%,#fff6e600 75%);animation:fade .5s ease-out}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
[hidden]{display:none!important}
.preview #top,.preview #mid,.preview #bar,.preview #pane,.preview #edge,.preview #modes,.preview #banner,.preview #card{display:none}
@media (prefers-reduced-motion:reduce){#flash.miss,#flash.through,#edge.on{animation-duration:.01s}#banner.on{animation-duration:3s}}
</style></head><body>
<canvas id="view" aria-label="Glazed and fired sheets hanging in haze, one behind another, seen from behind a pane; a ball going out into them and coming back. Touch the pane where the ball returns."></canvas>
<div id="pane"><div id="mark" hidden></div></div>
<div id="edge"></div>
<div id="flash"></div>
<div id="top"><div id="name">Volley</div><div id="left" role="img"></div><div style="position:relative"><div id="depth">0</div><div id="best"></div></div></div>
<div id="mid" role="status"><div id="say"></div><div id="sub"></div></div>
<div id="banner" role="status"></div>
<div id="card" hidden><div id="big"></div><div id="lines"></div><div class="acts"><button id="again">again</button><button id="fromCk" hidden>again from a firing</button></div></div>
<div id="modes" hidden><button data-rules="lives">five lives</button><button data-rules="run">firings · the clock</button><button data-rules="free">free</button></div>
<div id="bar"><button id="toHand">hand: all</button><button id="toMute" aria-pressed="true">sound</button><a href="{{readme}}">notes</a></div>
<script type="module" src="{{app}}"></script></body></html>
