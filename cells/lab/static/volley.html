<!doctype html>
<html lang="en" data-exp="volley"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Volley</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#080b12;color:#f2efe8;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#glass,#flash{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#glass i,#mark{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
#glass i{border:2px solid #ffffffcc;background:radial-gradient(circle,#ffffff00 55%,#ffffff2e 100%);box-shadow:0 0 24px #ffffff40}
#glass i.holding{border-color:#ff8a4c;box-shadow:0 0 30px #ff8a4c}
[data-hand="swipe"] #glass i{border-style:dashed;border-color:#ffffff90;background:none}
#mark{border:2px solid #ff8a4c;box-shadow:0 0 14px #ff8a4c80,inset 0 0 14px #ff8a4c50}
#top{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px #000a}
#depth{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
#depth::after{content:" m";font-size:13px;font-weight:400;opacity:.7;letter-spacing:.06em}
#top small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;text-align:right;line-height:1.7}
#bar0{position:fixed;top:0;left:0;right:0;height:4px;background:#ffffff18;pointer-events:none}
#whole{height:100%;background:#f2efe8;transition:width .25s}
#whole.low{background:#ff6a3c}
#mid{position:fixed;left:0;right:0;top:16%;text-align:center;pointer-events:none;padding:0 20px;text-shadow:0 2px 18px #000c}
#say{font-size:clamp(44px,14vw,92px);font-weight:700;letter-spacing:-.03em;line-height:1}
#sub{margin-top:14px;font-size:12px;line-height:1.7;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
#say:empty,#sub:empty,#best:empty{display:none}
#bar{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px}
#bar button,#bar a{font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#f2efe8;background:#ffffff1c;border:1px solid #ffffff30;border-radius:999px;padding:0 14px;min-height:40px;display:inline-flex;align-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar button[aria-pressed="true"],#toHand{background:#f2efe8;color:#10141c}
#bar button:focus-visible,#bar a:focus-visible{outline:2px solid #ff8a4c;outline-offset:2px}
[data-phase="play"] #bar,[data-phase="held"] #bar{opacity:.35}
#flash{opacity:0}
#flash.miss{background:radial-gradient(ellipse at 50% 50%,#ff4a2c00 30%,#ff4a2ccc 100%);animation:fade .7s ease-out}
#flash.crash{background:radial-gradient(ellipse at 50% 50%,#ffffff00 45%,#ffffff70 100%);animation:fade .35s ease-out}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
[hidden]{display:none!important}
.preview #top,.preview #mid,.preview #bar,.preview #bar0,.preview #glass{display:none}
@media (prefers-reduced-motion:reduce){#flash.miss,#flash.crash{animation-duration:.01s}}
</style></head><body>
<canvas id="view" aria-label="A tunnel seen from behind a pane of glass; slabs of bricks ahead, a ball going out and coming back. Touch the glass where the ball returns."></canvas>
<div id="glass"><div id="mark" hidden></div></div>
<div id="flash"></div>
<div id="bar0"><div id="whole"></div></div>
<div id="top"><div id="depth">0</div><div><small id="broken"></small><small id="best"></small></div></div>
<div id="mid" role="status"><div id="say"></div><div id="sub"></div></div>
<div id="bar"><button id="toHand">hand: pad</button><button id="toMute" aria-pressed="true">sound</button><a href="{{readme}}">notes</a></div>
<script type="module" src="{{app}}"></script></body></html>
