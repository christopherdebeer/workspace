<!doctype html>
<html lang="en" data-exp="penny"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e7df"><title>Penny Vision · Optical amusements</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#e9e7df;color:#222220;font-family:Arial,Helvetica,sans-serif}main{max-width:1200px;margin:auto;padding:clamp(12px,2vw,30px);min-height:100svh;display:flex;flex-direction:column;gap:12px}header,footer,.rail,.caption,.adjust,.mast{display:flex;align-items:center;justify-content:space-between;gap:14px}.mono,label,select,button,footer,.rail,.caption{font:600 11px/1.3 ui-monospace,'Courier New',monospace;letter-spacing:.06em}.rail{border-bottom:1px solid;padding-bottom:7px;text-transform:uppercase}.rail a,footer a{color:inherit}.mast{align-items:center}h1{font:900 clamp(46px,8vw,110px)/.89 Arial,Helvetica,sans-serif;letter-spacing:-.088em;margin:0}.coin{border:3px double;border-radius:50%;width:clamp(50px,7vw,82px);aspect-ratio:1;display:grid;place-items:center;font:italic bold clamp(26px,4vw,50px) Georgia;transform:rotate(-12deg)}.tag{font:italic clamp(14px,2.2vw,27px) Georgia;max-width:11em;margin:0 auto 0 10px}
figure{position:relative;margin:0;background:#242424;color:#dfdfda;flex:1;min-height:300px;overflow:hidden}canvas{position:absolute;width:100%;height:100%;inset:0;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.caption{position:absolute;pointer-events:none;left:16px;right:16px;top:12px;text-transform:uppercase}.caption:last-child{top:auto;bottom:12px}.plate{font:italic clamp(18px,2.5vw,32px) Georgia;text-transform:none}.cross{font:20px monospace}.strip{display:grid;grid-template-columns:1fr 1fr 1fr;border-block:1px solid}.strip button{display:flex;align-items:center;gap:10px;background:transparent;border:0;border-right:1px solid #aaa79e;color:inherit;text-align:left;padding:12px;cursor:pointer}.strip button:last-child{border:0}.strip button[aria-pressed=true]{background:#252523;color:#efede4}.strip b{font:italic 20px Georgia}.adjust{flex-wrap:wrap}.adjust label{display:flex;align-items:center;gap:8px}.adjust input{width:clamp(75px,11vw,160px);accent-color:#30302e}select{background:transparent;color:inherit;padding:5px;border:1px solid #aaa79e}footer{border-top:1px solid #aaa79e;padding-top:7px;font-size:10px}#error{position:absolute;inset:30%;text-align:center}#error:empty{display:none}body.preview main{padding:0;gap:0;height:100vh}body.preview main>:not(figure){display:none}body.preview figure{min-height:0}
@media(max-width:620px){main{gap:9px}.mast{flex-wrap:wrap;gap:8px}.tag{font-size:15px;max-width:8em;margin:0 auto}.coin{width:43px}.strip button{padding:9px 5px;gap:5px;letter-spacing:0}.strip b{font-size:16px}.adjust{justify-content:flex-start;gap:8px 14px}.adjust label{font-size:10px}.caption{font-size:9px}.rail{font-size:9px}figure{min-height:38svh}footer{font-size:9px}}
@media(max-width:390px){.tag{max-width:6em}.coin{width:36px}}
h1{display:grid;isolation:isolate}h1 span{grid-area:1/1;mix-blend-mode:multiply;pointer-events:none}h1 span:first-child{color:var(--left-ink,#df2626);transform:translateX(calc(-1 * var(--register,2px)))}h1 span:last-child{color:var(--right-ink,#20bbbb);transform:translateX(var(--register,2px))}.coin{background:transparent;color:inherit;cursor:pointer;padding:0}.coin:active{transform:rotate(-20deg)}.ruler{position:absolute;pointer-events:none;top:48px;bottom:56px;right:15px;width:8px;background:repeating-linear-gradient(to bottom,#888 0 1px,transparent 1px 8px)}.ruler i{position:absolute;right:0;top:var(--rack,50%);border-top:2px solid #ddd;width:16px}
</style></head><body><main>
<div class="rail"><span>Auxiliary Field &nbsp;/&nbsp; Optical amusements</span><a href="/">Lab ↗</a></div>
<header class="mast"><h1><span>Penny Vision</span><span aria-hidden="true">Penny Vision</span></h1><p class="tag">Virtual reality for small change.</p><button class="coin" aria-label="Insert a penny to advance the plate" title="Advance one plate">1p</button></header>
<figure><canvas id="glass" tabindex="0" aria-label="Optical specimen. Drag horizontally or use left and right arrows to turn. Drag vertically to pull focus."></canvas><div class="caption"><span id="number">PLATE I / III</span><span class="cross">⌖</span></div><div class="ruler" aria-hidden="true"><i></i></div><p role="status" id="error"></p><div class="caption"><span class="plate" id="title">The Trefoil</span><span>Drag to turn ↔</span></div></figure>
<nav class="strip" aria-label="Optical plates"><button aria-pressed="true"><b>I</b> Trefoil</button><button aria-pressed="false"><b>II</b> Armillary</button><button aria-pressed="false"><b>III</b> Volute</button></nav>
<div class="adjust"><label>Focus <input id="focus" type="range" min="-100" max="100" value="0"></label><label>Relief <input id="relief" type="range" min="0" max="100" value="55"></label><label>Lenses <select id="lens"><option>Red / cyan</option><option>Red / blue</option><option>Cyan / red</option><option>Blue / red</option><option>Monocular proof</option></select></label></div>
<footer><span>Lens order reads left eye / right eye.</span><a href="{{readme}}">Operator’s notes ↗</a></footer>
</main><script type="module" src="{{app}}"></script></body></html>
