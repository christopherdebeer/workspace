<!doctype html>
<html lang="en" data-exp="settle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ede6dc">
  <title>Settle</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ede6dc; overflow: hidden; touch-action: none; }
    body { color: #3b3631; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; display: flex; gap: 14px; }
    nav button, nav a { all: unset; cursor: pointer; font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .66; padding: 4px 2px; color: inherit; }
    nav button:hover, nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    /* the next piece is drawn in the canvas's corner, under this word */
    #next { position: fixed; top: max(122px, calc(env(safe-area-inset-top) + 110px)); right: 14px; width: 78px; text-align: center; font-size: 12px; letter-spacing: .14em; font-variant: small-caps; opacity: .5; pointer-events: none; }
    #count { position: fixed; left: 0; right: 0; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 76px); text-align: center; font-size: 13px; letter-spacing: .12em; font-variant: small-caps; opacity: .55; pointer-events: none; }
    #hands { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 14px; }
    #hands button { all: unset; cursor: pointer; min-width: 74px; height: 52px; border-radius: 26px; text-align: center; line-height: 52px; font-size: 15px; letter-spacing: .12em; font-variant: small-caps;
      background: rgba(255, 252, 247, .5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px rgba(60, 50, 40, .08); }
    #hands button:active { background: rgba(255, 252, 247, .8); }
    #hands #set { min-width: 96px; background: rgba(70, 64, 58, .78); color: #f6f1ea; }
    #hint { position: fixed; left: 0; right: 0; top: 24%; text-align: center; font-style: italic; font-size: 15px; opacity: 0; transition: opacity 2s; pointer-events: none; padding: 0 24px; }
    #hint.on { opacity: .6; }
    .preview nav, .preview #next, .preview #count, .preview #hands, .preview #hint { display: none; }
  </style>
</head>
<body>
  <canvas id="bed"></canvas>
  <nav><button id="again">begin again</button><button id="sound">sound · on</button><a href="{{readme}}">notes</a></nav>
  <div id="next">next</div>
  <div id="count"></div>
  <div id="hint">move the piece with a finger · tap it to set it down · two fingers to look around</div>
  <div id="hands"><button id="turn">turn</button><button id="tip">tip</button><button id="set">set</button></div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
