<!doctype html>
<html lang="en" data-exp="field">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#56695e" />
  <title>Field Journal</title>
  <style>
    /* everything over the wood is drawn as the seals in it are: in light — warm hairlines and
       their glow, nothing solid */
    :root {
      --lit: #fff4d6;
      --lit-dim: rgba(255, 244, 214, .62);
      --glow-text: 0 0 2px rgba(255, 244, 214, .85), 0 0 9px rgba(255, 210, 140, .5), 0 0 22px rgba(255, 190, 110, .28);
      --glow-line: drop-shadow(0 0 1.2px rgba(255, 244, 214, .95)) drop-shadow(0 0 6px rgba(255, 220, 150, .55)) drop-shadow(0 0 16px rgba(255, 196, 120, .3));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #56695e; color: var(--lit); font-family: Georgia, 'Iowan Old Style', serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
    /* the mist that comes in between one wood and the next */
    #veil { position: fixed; inset: 0; background: #7d9186; opacity: 1; pointer-events: none; transition: opacity 1.8s ease; }
    #veil.in { opacity: 1; transition-duration: 1.2s; }
    #veil.clear { opacity: 0; }
    #title { position: fixed; top: 38%; width: 100%; text-align: center; font-size: 13px; letter-spacing: 9px; opacity: .85; text-shadow: var(--glow-text); pointer-events: none; transition: opacity 3s; }
    #title.away { opacity: 0; }
    #hint { position: fixed; bottom: max(150px, calc(env(safe-area-inset-bottom) + 134px)); left: 16px; right: 16px; text-align: center; font-size: 14px; font-style: italic; opacity: 0; pointer-events: none; transition: opacity 2s; text-shadow: var(--glow-text); }
    #hint.show { opacity: .8; }

    /* a button drawn in light: a hairline lozenge, a small diamond at each end */
    .lit { position: relative; font: italic 14px Georgia, serif; letter-spacing: .4px; color: var(--lit); text-shadow: var(--glow-text); background: none; border: 1px solid rgba(255, 244, 214, .78); border-radius: 22px; min-height: 44px; padding: 10px 22px; cursor: pointer; box-shadow: 0 0 5px rgba(255, 220, 150, .5), 0 0 14px rgba(255, 196, 120, .22), inset 0 0 6px rgba(255, 214, 150, .28); }
    .lit::before, .lit::after { content: ''; position: absolute; top: 50%; width: 6px; height: 6px; border: 1px solid rgba(255, 244, 214, .85); transform: translateY(-50%) rotate(45deg); box-shadow: 0 0 5px rgba(255, 220, 150, .6); }
    .lit::before { left: -10px; }
    .lit::after { right: -10px; }
    .lit:focus-visible { outline: none; box-shadow: 0 0 8px rgba(255, 230, 170, .9), 0 0 22px rgba(255, 196, 120, .45), inset 0 0 8px rgba(255, 214, 150, .4); }
    .lit:active { box-shadow: 0 0 10px rgba(255, 230, 170, 1), 0 0 26px rgba(255, 196, 120, .55), inset 0 0 12px rgba(255, 214, 150, .5); }

    footer { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; }
    footer button, footer a { font: italic 12px Georgia, serif; letter-spacing: .5px; color: var(--lit-dim); background: none; border: 0; padding: 12px 4px; min-height: 44px; cursor: pointer; text-decoration: none; text-shadow: var(--glow-text); }
    footer button:focus-visible, footer a:focus-visible { outline: none; color: var(--lit); }

    #count { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 26px; }
    /* the compass: a seal in light that turns as you do; a mark on its rim toward each anomaly near */
    #compass { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 14px; width: 78px; height: 78px; pointer-events: none; }
    #compass .dial { position: relative; width: 100%; height: 100%; mix-blend-mode: screen; filter: var(--glow-line); }
    #compass svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
    #compass svg * { fill: none !important; stroke: var(--lit) !important; vector-effect: non-scaling-stroke; stroke-width: 1px; }
    #compass text { fill: var(--lit) !important; stroke: none !important; }
    #compass .needle { position: absolute; left: 50%; top: -3px; width: 1px; height: 12px; background: linear-gradient(var(--lit), rgba(255, 244, 214, 0)); box-shadow: 0 0 6px 1px rgba(255, 220, 150, .6); transform: translateX(-50%); }

    /* near one: its name, to record it */
    #prompt { position: fixed; left: 50%; bottom: max(70px, calc(env(safe-area-inset-bottom) + 56px)); transform: translateX(-50%) translateY(8px); max-width: calc(100% - 64px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; pointer-events: none; transition: opacity .8s, transform .8s; }
    #prompt.show { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
    #prompt .g { font-style: normal; margin-right: 4px; }
    #prompt .sub { opacity: .7; margin-left: 6px; font-size: 12px; }
    /* the seal by the path takes a touch where it stands (it is drawn in the wood; this is only its place) */
    #gate { position: fixed; transform: translate(-50%, -50%); background: none; border: 0; border-radius: 50%; padding: 0; cursor: pointer; }
    #gate:focus-visible { outline: 1px solid rgba(255, 244, 214, .6); }

    /* a find's card, and the journal: in light, over the wood darkened */
    #sheet { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(6, 10, 8, .55), rgba(4, 6, 5, .82)); backdrop-filter: blur(5px) saturate(.7); -webkit-backdrop-filter: blur(5px) saturate(.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); z-index: 5000; overflow: auto; }
    #sheet[hidden] { display: none; }
    #sheet .card { width: min(100%, 400px, calc((100svh - 230px) * 63 / 88)); aspect-ratio: 63 / 88; flex: none; }
    #sheet svg { width: 100%; height: 100%; display: block; overflow: visible; }
    #sheet .card, #sheet .entry svg { mix-blend-mode: screen; filter: var(--glow-line); }
    #sheet svg * { fill: none !important; stroke: var(--lit) !important; vector-effect: non-scaling-stroke; stroke-width: .9px; }
    #sheet svg text { fill: var(--lit) !important; stroke: none !important; }
    #sheet .notes { width: min(100%, 400px); margin: 0; font-style: italic; font-size: 14px; line-height: 1.55; text-align: center; text-shadow: var(--glow-text); opacity: .9; }
    #sheet .row { flex: none; }
    .journal { width: min(100%, 560px); padding: 8px 4px; }
    .journal h2 { font-weight: 400; font-size: 18px; margin: 4px 0 18px; letter-spacing: .3em; text-transform: uppercase; text-align: center; text-shadow: var(--glow-text); }
    .journal p { text-align: center; font-style: italic; text-shadow: var(--glow-text); }
    .journal .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
    .journal .entry { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: var(--lit); padding: 6px; font: italic 12px Georgia, serif; cursor: pointer; border-radius: 8px; text-shadow: var(--glow-text); }
    .journal .entry svg { width: 72px; height: 72px; }
    .journal .entry span { line-height: 1.3; text-align: center; }
    .journal .row { text-align: center; margin-top: 18px; }
    .preview #count, .preview #prompt, .preview #gate { display: none; }
    .preview #compass { width: 44px; height: 44px; }
  </style>
</head>
<body>
  <canvas id="wood" tabindex="0" aria-label="Field Journal: a walk through a wood in fog, where now and then something has broken through — a crystal grown out of the ground, fungi grown gigantic. Touch the ground to walk, the sky to look about; pinch to look closer. Arrow keys walk and look."></canvas>
  <div id="veil"></div>
  <div id="compass" aria-hidden="true"></div>
  <button id="count" class="lit" type="button"></button>
  <button id="gate" type="button" hidden></button>
  <button id="prompt" class="lit" type="button"></button>
  <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="A find"></div>
  <div id="title">FIELD JOURNAL</div>
  <div id="hint">touch the ground to walk · the sky to look · the compass marks what has broken through</div>
  <footer>
    <button id="seed" type="button" aria-label="This wood's name. Touch for another wood."></button>
    <a id="readme" href="{{readme}}">about</a>
    <button id="sound" type="button">sound off</button>
  </footer>
  <script type="module" src="{{app}}"></script>
</body>
</html>
