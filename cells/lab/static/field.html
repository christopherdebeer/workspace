<!doctype html>
<html lang="en" data-exp="field">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#56695e" />
  <title>Field Journal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #56695e; color: #eef0e4; font-family: Georgia, 'Iowan Old Style', serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
    /* the mist that comes in between one wood and the next */
    #veil { position: fixed; inset: 0; background: #7d9186; opacity: 1; pointer-events: none; transition: opacity 1.8s ease; }
    #veil.in { opacity: 1; transition-duration: 1.2s; }
    #veil.clear { opacity: 0; }
    #title { position: fixed; top: 38%; width: 100%; text-align: center; font-size: 13px; letter-spacing: 9px; opacity: .8; text-shadow: 0 2px 20px rgba(20, 36, 28, .6); pointer-events: none; transition: opacity 3s; }
    #title.away { opacity: 0; }
    #hint { position: fixed; bottom: max(64px, calc(env(safe-area-inset-bottom) + 48px)); width: 100%; text-align: center; font-size: 14px; font-style: italic; opacity: 0; pointer-events: none; transition: opacity 2s; text-shadow: 0 1px 14px rgba(20, 36, 28, .7); }
    #hint.show { opacity: .75; }
    footer { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 16px; }
    footer button { font: italic 12px Georgia, serif; letter-spacing: .5px; color: rgba(238, 240, 228, .55); background: none; border: 0; padding: 10px 4px; cursor: pointer; text-shadow: 0 1px 10px rgba(20, 36, 28, .7); }
    footer a { font: italic 12px Georgia, serif; letter-spacing: .5px; color: rgba(238, 240, 228, .45); text-decoration: none; padding: 10px 4px; text-shadow: 0 1px 10px rgba(20, 36, 28, .7); }
    footer button:focus-visible { outline: 1px solid rgba(238, 240, 228, .5); }
    /* the journal's layer over the wood */
    #marks { position: fixed; inset: 0; pointer-events: none; }
    .mark { position: fixed; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; pointer-events: none; transition: opacity .4s; }
    .mark .lod { position: absolute; inset: 0; }
    .mark .hit { position: absolute; left: 50%; top: 50%; width: min(100%, 88px); height: min(100%, 88px); min-width: 44px; min-height: 44px; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: auto; cursor: pointer; }
    /* the seals as light: hairlines that glow, nothing solid (every fill emptied, every line lit) */
    .mark svg, #compass svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .mark svg *, #compass svg * { fill: none !important; stroke: #fff4d6 !important; vector-effect: non-scaling-stroke; stroke-width: 1px; }
    .mark text, #compass text { stroke-width: 1px !important; }
    .mark { mix-blend-mode: screen; filter: drop-shadow(0 0 1.5px rgba(255, 244, 214, .95)) drop-shadow(0 0 6px rgba(255, 226, 160, .55)) drop-shadow(0 0 14px rgba(255, 214, 140, .3)); }
    #compass .dial { mix-blend-mode: screen; filter: drop-shadow(0 0 1.5px rgba(255, 244, 214, .95)) drop-shadow(0 0 7px rgba(255, 226, 160, .5)); }
    .mark.near { animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.08); } }
    #compass { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; width: 76px; height: 76px; pointer-events: none; opacity: .85; }
    #compass .dial { width: 100%; height: 100%; }
    #compass .dial svg { width: 100%; height: 100%; display: block; }
    #compass .needle { position: absolute; left: 50%; top: -2px; width: 1px; height: 12px; background: #fff4d6; box-shadow: 0 0 6px 1px rgba(255, 226, 160, .7); transform: translateX(-50%); }
    #count { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; min-height: 44px; font: italic 13px Georgia, serif; color: #eef0e4; background: rgba(31, 44, 108, .0); border: 1px solid rgba(238, 240, 228, .45); border-radius: 22px; padding: 10px 16px; cursor: pointer; text-shadow: 0 1px 10px rgba(20, 36, 28, .7); }
    #say { position: fixed; top: 22%; left: 16px; right: 16px; text-align: center; font: italic 15px Georgia, serif; opacity: 0; transition: opacity .6s; pointer-events: none; text-shadow: 0 1px 14px rgba(20, 36, 28, .8); }
    #say.show { opacity: .9; }
    #sheet { position: fixed; inset: 0; background: rgba(28, 38, 32, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); z-index: 5000; overflow: auto; }
    #sheet[hidden] { display: none; }
    #sheet .card { position: relative; width: min(100%, 420px, calc((100svh - 110px) * 63 / 88)); aspect-ratio: 63 / 88; }
    #sheet .card > svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 24px rgba(0, 0, 0, .35)); }
    #sheet iframe { position: absolute; border: 0; border-radius: 4px; background: #0f1311; }
    #sheet .row { margin-top: 12px; }
    #sheet button { font: 15px Georgia, serif; color: #2a2620; background: #f7f0e3; border: 0; border-radius: 22px; min-height: 44px; padding: 10px 22px; cursor: pointer; }
    .journal { width: min(100%, 560px); background: #f7f0e3; color: #2a2620; border-radius: 10px; padding: 16px; }
    .journal h2 { font-weight: 400; font-size: 20px; margin: 4px 0 12px; letter-spacing: .08em; }
    .journal .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .journal .entry { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none !important; padding: 4px !important; font-size: 12px !important; border-radius: 8px !important; }
    .journal .entry svg { width: 72px; height: 72px; }
    .journal .entry span { line-height: 1.3; text-align: center; font-style: italic; }
    .journal .row { text-align: center; }
    .preview #count, .preview #marks, .preview #say { display: none; }
    .preview #compass { width: 44px; height: 44px; }
  </style>
</head>
<body>
  <canvas id="wood" tabindex="0" aria-label="Field Journal: a walk through a wood in fog, finding crystals and fungi. Touch the ground to walk, the sky to look about; pinch to look closer. Arrow keys walk and look."></canvas>
  <div id="veil"></div>
  <div id="marks"></div>
  <div id="compass" aria-hidden="true"></div>
  <button id="count" type="button"></button>
  <div id="say" role="status" aria-live="polite"></div>
  <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="A find"></div>
  <div id="title">FIELD JOURNAL</div>
  <div id="hint">touch the ground to walk · the sky to look · look for the seals among the trees</div>
  <footer>
    <button id="seed" type="button" aria-label="This wood's name. Touch for another wood."></button>
    <a id="readme" href="{{readme}}">about</a>
    <button id="sound" type="button">sound off</button>
  </footer>
  <script type="module" src="{{app}}"></script>
</body>
</html>
