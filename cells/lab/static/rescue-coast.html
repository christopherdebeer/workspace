<!doctype html>
<html lang="en" data-exp="rescue-coast">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a64b8">
  <title>Lily’s Rescue Boats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #15306a; --ink2: #24477f; --paper: #fbf3df; --paper2: #f3e6c4; --edge: #dcc9a0; --gold: #f8c331; --gold2: #e9a514;
      --glass: rgba(14, 34, 78, .55); --glass2: rgba(14, 34, 78, .38); --orange: #f2621c;
      --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #6aa6e0; overflow: hidden; touch-action: none; }
    body { color: var(--ink); font-family: var(--font); font-weight: 500; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    .top { top: max(10px, env(safe-area-inset-top)); }
    svg { display: block; }

    /* ─── the title: the logo, the menu ─── */
    .title-only, .race-only, .podium-only { display: none !important; }
    body.title .title-only, body.racing .race-only, body.podium .podium-only { display: flex !important; }
    #labnav { position: fixed; left: 12px; top: max(8px, env(safe-area-inset-top)); z-index: 5; font-size: 12px; color: #fff; text-decoration: none; padding: 4px 10px; border-radius: 12px; background: var(--glass2); }
    #logo { position: fixed; left: 0; right: 0; top: calc(max(10px, env(safe-area-inset-top)) + 26px); flex-direction: column; align-items: center; pointer-events: none; }
    #logo .lily, #logo .rescue { font-weight: 700; color: var(--ink); line-height: .9; letter-spacing: .005em; paint-order: stroke fill; -webkit-text-stroke: 7px #fff; text-shadow: 0 5px 0 rgba(10, 30, 70, .25), 0 8px 18px rgba(10, 30, 70, .25); }
    #logo .lily { font-size: 50px; transform: rotate(-4deg) translateX(-30px); }
    #logo .rescue { font-size: 54px; transform: rotate(-4deg); }
    #logo svg { width: 190px; height: 22px; margin-top: 4px; transform: rotate(-4deg); filter: drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); }
    #logo .tagline { margin-top: 4px; font-size: 22px; font-weight: 700; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 5px var(--ink); transform: rotate(-4deg); }
    #logo .by { margin-top: 6px; font-size: 14px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(10, 30, 70, .8); }
    #menu { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 34px); flex-direction: column; gap: 9px; width: min(220px, 56vw); }
    .pill { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 -3px 0 var(--edge), 0 4px 10px rgba(10, 30, 70, .3); font-size: 20px; font-weight: 600; color: var(--ink); }
    .pill i { font-style: normal; width: 28px; text-align: center; font-size: 21px; }
    .pill .sub { margin-left: auto; font-size: 12px; font-weight: 600; opacity: .6; }
    .pill.play { background: linear-gradient(#ffd451, var(--gold)); box-shadow: inset 0 -4px 0 var(--gold2), 0 5px 12px rgba(10, 30, 70, .35); font-size: 27px; font-weight: 700; padding: 12px 18px 12px 14px; }
    .pill.play i svg { width: 26px; height: 26px; }
    .pill:active { transform: scale(.96); }
    #chosen { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 34px); flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; color: #fff; text-shadow: 0 1px 3px rgba(10, 30, 70, .9); font-size: 13px; }
    #chosen b { font-size: 18px; font-weight: 700; }
    #chosen .tag { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 12px; background: var(--glass); text-shadow: none; }
    #chosen .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
    @media (orientation: landscape) {
      #logo { left: auto; right: 4vw; top: calc(max(10px, env(safe-area-inset-top)) + 10px); width: 46vw; }
      #menu { left: auto; right: max(24px, env(safe-area-inset-right)); bottom: 70px; }
      #chosen { right: auto; left: max(16px, env(safe-area-inset-left)); align-items: flex-start; text-align: left; }
    }

    /* ─── panels: paper cards that slide up over the title ─── */
    .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; flex-direction: column; align-items: center; gap: 12px; padding: 18px 16px calc(max(16px, env(safe-area-inset-bottom)) + 12px); border-radius: 26px 26px 0 0; background: var(--paper); box-shadow: 0 -3px 0 var(--edge), 0 -10px 30px rgba(10, 30, 70, .3); animation: rise .35s ease-out; max-height: 78vh; overflow-y: auto; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px); } }
    body.panel-boats #boats-panel, body.panel-weather #weather-panel, body.panel-settings #settings-panel { display: flex; }
    body[class*="panel-"] #menu, body[class*="panel-"] #chosen { display: none !important; }
    .panel h2 { margin: 0; font-size: 26px; font-weight: 700; }
    .panel .done { padding: 10px 34px; border-radius: 22px; background: linear-gradient(#ffd451, var(--gold)); box-shadow: inset 0 -3px 0 var(--gold2), 0 3px 8px rgba(10, 30, 70, .25); font-size: 19px; font-weight: 700; }
    #boat-card { display: flex; align-items: center; gap: 6px; width: min(100%, 420px); }
    #boat-card .arrow { width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(10, 30, 70, .2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex: 0 0 auto; }
    #boat-card .show { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 18px; background: linear-gradient(#cfe6fb, #9cc8f0); box-shadow: inset 0 0 0 3px #fff; }
    #boat-card .show svg { width: 100%; max-width: 230px; height: auto; }
    #boat-card .show b { font-size: 24px; font-weight: 700; }
    #boat-card .show small { font-size: 13px; opacity: .75; }
    #boat-card .show .bars { display: flex; gap: 14px; margin-top: 6px; }
    .pips { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; }
    .pips i { font-style: normal; margin-right: 4px; opacity: .8; }
    .pips b { width: 13px; height: 9px; border-radius: 3px; background: rgba(13, 29, 76, .18); }
    .pips b.on { background: linear-gradient(#ffd451, var(--gold)); box-shadow: inset 0 -2px 0 var(--gold2); }
    #kinds-list { display: flex; gap: 8px; }
    #kinds-list button { width: 96px; padding: 5px 3px 4px; border-radius: 12px; background: #fff; box-shadow: 0 2px 5px rgba(10, 30, 70, .16); display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; }
    #kinds-list button svg { width: 76px; height: 44px; }
    #kinds-list button.on { box-shadow: 0 0 0 3px var(--ink), 0 3px 8px rgba(10, 30, 70, .25); }
    #boats-list { display: flex; gap: 7px; }
    #boats-list button { width: 58px; padding: 5px 2px 3px; border-radius: 12px; background: #fff; box-shadow: 0 2px 5px rgba(10, 30, 70, .16); display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; }
    #boats-list button svg { width: 50px; height: 29px; }
    #boats-list button.on { box-shadow: 0 0 0 3px var(--ink), 0 3px 8px rgba(10, 30, 70, .25); }
    #weather-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 420px); }
    #weather-list button { position: relative; height: 92px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); box-shadow: 0 2px 6px rgba(10, 30, 70, .2); }
    #weather-list button span { font-size: 28px; position: absolute; top: 12px; text-shadow: none; }
    #weather-list button.on { box-shadow: 0 0 0 3px var(--ink), 0 3px 8px rgba(10, 30, 70, .3); }
    .set { width: min(100%, 420px); display: flex; flex-direction: column; gap: 6px; }
    .set > span { font-size: 14px; font-weight: 600; opacity: .7; }
    .seg { display: flex; gap: 4px; padding: 4px; border-radius: 16px; background: rgba(21, 48, 106, .08); }
    .seg button { flex: 1; text-align: center; padding: 8px 4px; border-radius: 12px; font-size: 16px; font-weight: 600; }
    .seg button small { display: block; font-size: 11px; font-weight: 500; opacity: .7; }
    .seg button.on { background: #fff; box-shadow: 0 1px 4px rgba(10, 30, 70, .2); }
    .set .line { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .set .line button, .set .line a { padding: 7px 14px; border-radius: 14px; background: #fff; box-shadow: 0 1px 4px rgba(10, 30, 70, .2); font-weight: 600; color: var(--ink); text-decoration: none; font-size: 14px; }

    /* ─── the race: pills top-left, the map top-right, a word in a bubble, the stick in its corner ─── */
    .glass { background: var(--glass); color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, .55), 0 3px 10px rgba(5, 15, 40, .3); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #pills { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); flex-direction: column; gap: 7px; align-items: flex-start; z-index: 3; }
    #pause { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    #pause svg { width: 18px; height: 18px; }
    .stat { display: flex; align-items: center; gap: 7px; padding: 4px 13px 4px 5px; border-radius: 20px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; pointer-events: none; transition: transform .15s; }
    .stat .ic { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .16); font-size: 17px; }
    .stat small { font-size: 12px; font-weight: 600; opacity: .8; }
    .stat.bump { transform: scale(1.15); }
    .stat .ic .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
    .stat.hurry { background: rgba(200, 40, 20, .75); animation: throb .6s ease-in-out infinite alternate; }
    @keyframes throb { to { transform: scale(1.07); } }
    .lifebuoy { width: 22px; height: 22px; border-radius: 50%; background: repeating-conic-gradient(#f4561c 0 45deg, #fff 0 90deg); -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
    #mapbox { position: fixed; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); flex-direction: column; align-items: flex-end; gap: 6px; z-index: 3; pointer-events: none; }
    #map { width: 112px; height: 112px; border-radius: 50%; box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(14, 34, 78, .5), 0 4px 12px rgba(5, 15, 40, .35); }
    #ladder { flex-direction: column; gap: 3px; align-items: flex-end; }
    #ladder div { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 12px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #ladder div i { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
    #ladder div small { font-size: 10px; opacity: .8; width: 22px; }
    #ladder div.me { box-shadow: 0 0 0 2.5px var(--gold), 0 2px 6px rgba(5, 15, 40, .3); }
    #bubble { position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 128px); transform: translate(-50%, -6px) scale(.9); max-width: min(64vw, 360px); padding: 9px 16px; border-radius: 18px; background: #fff; color: var(--ink); font-size: 17px; font-weight: 600; text-align: center; line-height: 1.2; box-shadow: 0 4px 12px rgba(5, 15, 40, .3); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 3; }
    #bubble::after { content: ''; position: absolute; left: 30%; bottom: -9px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
    #bubble.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
    @media (orientation: landscape) { #bubble { top: calc(max(10px, env(safe-area-inset-top)) + 16px); } }
    #bar { position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 178px); transform: translate(-50%, 8px); align-items: center; gap: 8px; padding: 6px 12px 6px 7px; border-radius: 20px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 3; }
    #bar.on { opacity: 1; transform: translate(-50%, 0); }
    #bar .meter { width: 120px; height: 13px; border-radius: 7px; background: rgba(255, 255, 255, .25); overflow: hidden; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .6); }
    #bar .meter i { display: block; height: 100%; width: 0; background: linear-gradient(#ffa154, var(--orange)); transition: width .1s linear; }
    #bar span { font-size: 14px; font-weight: 700; }
    #bar.rough .meter i { background: linear-gradient(#ffd25a, #e9a514); }
    @media (orientation: landscape) { #bar { bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 64px); } }
    #arrows { position: fixed; inset: 0; pointer-events: none; }
    #skip { position: fixed; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 200px); transform: translateX(-50%); z-index: 3; display: none !important; font-size: 17px; }
    #skip.on { display: flex !important; }
    #arrows .arrow { position: absolute; left: 0; top: 0; }
    #arrows .arrow span { position: absolute; left: -11px; top: -11px; width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 18px solid #fff; transform-origin: 11px 11px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .4)); }
    #arrows .arrow b { position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 14px; line-height: 26px; text-align: center; font-weight: 700; box-shadow: 0 0 0 2.5px #fff, 0 1px 3px rgba(0, 0, 0, .35); text-shadow: 0 1px 1px rgba(0, 0, 0, .4); }
    #arrows .arrow.fin b { border-radius: 4px; width: 28px; height: 20px; top: -10px; left: -14px; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 10px 10px !important; }
    #big { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 84px; font-weight: 700; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 8px var(--ink); text-shadow: 0 6px 0 rgba(10, 30, 70, .3); opacity: 0; pointer-events: none; z-index: 4; }
    #big.on { animation: say 1.1s ease-out forwards; }
    #big.long { font-size: 48px; } #big.long.on { animation-duration: 2.2s; }
    @keyframes say { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; transform: scale(1.15); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

    /* ─── the stick, and the horn beside it ─── */
    #stick { position: fixed; right: max(12px, calc(env(safe-area-inset-right) + 8px)); bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px)); width: 156px; height: 156px; display: none; align-items: center; justify-content: center; z-index: 2; touch-action: none; }
    body.racing #stick { display: flex; }
    body:not(.hand-right) #stick { right: auto; left: max(12px, calc(env(safe-area-inset-left) + 8px)); }
    #stick .base { position: relative; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, rgba(30, 60, 120, .35), rgba(14, 34, 78, .6)); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .85), inset 0 0 0 10px rgba(255, 255, 255, .08), 0 4px 14px rgba(5, 15, 40, .35); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #stick .base i { position: absolute; width: 14px; height: 14px; border: solid #fff; border-width: 0 4px 4px 0; border-radius: 2px; opacity: .92; }
    #stick .l { left: 15px; top: 59px; transform: rotate(135deg); }
    #stick .r { right: 15px; top: 59px; transform: rotate(-45deg); }
    #stick .u { top: 15px; left: 59px; transform: rotate(-135deg); }
    #stick .d { bottom: 15px; left: 59px; transform: rotate(45deg); opacity: .55 !important; }
    #stick .knob { position: absolute; left: 36px; top: 36px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #d9e2ee); box-shadow: 0 4px 10px rgba(0, 0, 0, .35), inset 0 -3px 0 rgba(20, 40, 80, .12); transition: transform .12s ease-out; }
    #stick.held .knob { transition: none; }
    /* (steering from the boat: no stick in the corner; a faint ring where your finger took hold, and the horn in the corner) */
    body.steer-touch #stick { display: none !important; }
    #ghost { position: fixed; left: -48px; top: -48px; width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .5); box-shadow: 0 0 0 1px rgba(10, 30, 70, .25); pointer-events: none; display: none; z-index: 2; }
    #ghost.on { display: block; }
    #ghost.hint { animation: ghost-in 1.8s ease-out infinite; }
    #ghost.hint i { animation: ghost-up 1.8s ease-in-out infinite; }
    @keyframes ghost-in { 0% { opacity: 0; } 20%, 80% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ghost-up { 0%, 15% { translate: 0 0; } 70%, 100% { translate: 0 -46px; } }
    #ghost i { position: absolute; left: 31px; top: 31px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, .6); box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
    #horn { position: fixed; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); right: calc(max(12px, env(safe-area-inset-right)) + 172px); width: 56px; height: 56px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 2; }
    body:not(.hand-right) #horn { right: auto; left: calc(max(12px, env(safe-area-inset-left)) + 172px); }
    body.racing #horn { display: flex; }
    body.steer-touch #horn { right: max(16px, calc(env(safe-area-inset-right) + 12px)); left: auto; }
    #horn svg { width: 30px; height: 30px; }
    #horn:active { transform: scale(.92); }

    /* ─── pause ─── */
    #pausecard { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: rgba(10, 25, 60, .35); }
    body.paused #pausecard { display: flex; }
    #pausecard > div { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(78vw, 300px); padding: 20px; border-radius: 24px; background: var(--paper); box-shadow: 0 -3px 0 var(--edge) inset, 0 10px 30px rgba(5, 15, 40, .4); text-align: center; }
    #pausecard h2 { margin: 0 0 4px; font-size: 28px; font-weight: 700; }

    /* ─── the finish: the banner as you cross, then the reward ─── */
    #finishflag { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 4; pointer-events: none; display: none; align-items: center; gap: 8px; padding: 10px 26px; border-radius: 10px; background: #fff; color: #c3200f; font-size: 44px; font-weight: 700; letter-spacing: .04em; box-shadow: 0 0 0 5px #fff, 0 0 0 9px #111, 0 8px 20px rgba(5, 15, 40, .35); }
    #finishflag::before, #finishflag::after { content: ''; width: 34px; height: 34px; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 17px 17px; border-radius: 3px; }
    #finishflag.on { display: flex; animation: flag 2.6s ease-out forwards; }
    @keyframes flag { 0% { opacity: 0; transform: translateX(-50%) scale(.3) rotate(-8deg); } 15% { opacity: 1; transform: translateX(-50%) scale(1.1) rotate(2deg); } 25% { transform: translateX(-50%) scale(1) rotate(-2deg); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) scale(1) rotate(-2deg); } }
    #reward { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; flex-direction: column; align-items: center; gap: 10px; padding: 16px 16px calc(max(14px, env(safe-area-inset-bottom)) + 12px); border-radius: 26px 26px 0 0; background: var(--paper); box-shadow: 0 -3px 0 var(--edge), 0 -10px 30px rgba(10, 30, 70, .3); animation: rise .45s ease-out; max-height: 74vh; overflow-y: auto; }
    #reward h2 { margin: 0; font-size: 30px; font-weight: 700; }
    #stars { display: flex; gap: 6px; margin-top: -2px; }
    #stars svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 0 rgba(150, 90, 0, .35)); }
    #stars svg.off { opacity: .22; filter: grayscale(1); }
    #stars svg:nth-child(2) { transform: translateY(-8px) scale(1.15); }
    .pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
    @keyframes pop { from { transform: scale(0); } }
    .rewardrow { display: flex; gap: 14px; align-items: center; width: min(100%, 440px); }
    #polaroid { flex: 0 0 auto; width: 128px; padding: 7px 7px 26px; background: #fff; box-shadow: 0 4px 12px rgba(10, 30, 70, .3); transform: rotate(-4deg); position: relative; }
    #polaroid img { width: 114px; height: 114px; object-fit: cover; display: block; background: #8bbbe8; }
    #polaroid span { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 13px; font-weight: 600; }
    #ranks { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    #ranks li { display: grid; grid-template-columns: 36px 14px 1fr auto; column-gap: 6px; align-items: center; padding: 3px 9px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(10, 30, 70, .12); font-size: 14px; font-weight: 600; }
    #ranks li b { font-size: 12px; text-align: center; border-radius: 10px; padding: 2px 0; background: rgba(21, 48, 106, .08); }
    #ranks li.p1 b { background: var(--gold); } #ranks li.p2 b { background: #ccd4dc; } #ranks li.p3 b { background: #e3a06a; }
    #ranks li i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .25); }
    #ranks li strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    #ranks li small { display: block; font-size: 10px; font-weight: 500; opacity: .55; line-height: 1; }
    #ranks li.me { box-shadow: 0 0 0 2.5px var(--ink); }
    #reward .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #reward .row .pill { font-size: 17px; padding: 9px 16px; }
    #reward .row .pill.play { font-size: 20px; }
    #best { font-size: 13px; opacity: .7; }
    #fleet { font-size: 14px; font-weight: 600; opacity: .75; text-align: center; }
    #fleet:empty { display: none; }

    body.nogl::after { content: 'This needs WebGL2, which this browser doesn\2019 t have.'; position: fixed; inset: 40% 20px auto; text-align: center; }
    body.preview #labnav, body.preview #skip, body.preview .title-only, body.preview .race-only, body.preview .podium-only, body.preview #big, body.preview #bubble, body.preview #arrows, body.preview #bar, body.preview #stick, body.preview #ghost, body.preview #horn, body.preview .panel, body.preview #finishflag { display: none !important; }
  </style>
</head>
<body class="title">
  <canvas id="sea"></canvas>
  <a id="labnav" class="title-only" href="/">← lab</a>

  <!-- the title -->
  <div id="logo" class="title-only">
    <div class="lily">Lily’s</div>
    <div class="rescue">Rescue Boats</div>
    <svg viewBox="0 0 190 22" aria-hidden="true"><path d="M4 14 Q 24 2 44 12 T 84 12 T 124 12 T 164 12 T 186 8" fill="none" stroke="#2a7fd4" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="tagline">All boats home</div>
    <div class="by">a game by Lily</div>
  </div>
  <nav id="menu" class="title-only">
    <button id="play" class="pill play"><i><svg viewBox="0 0 24 24"><path d="M6 3 L21 12 L6 21 Z" fill="#15306a" stroke="#15306a" stroke-width="2" stroke-linejoin="round"/></svg></i>Play</button>
    <button id="rally" class="pill"><i>🏁</i>Rally<small class="sub">Lily’s race</small></button>
    <button id="open-boats" class="pill"><i>⛴️</i>Boats</button>
    <button id="open-weather" class="pill"><i id="weather-icon">☀️</i>Weather</button>
    <button id="open-settings" class="pill"><i>⚙️</i>Settings</button>
  </nav>
  <div id="chosen" class="title-only"></div>

  <section id="boats-panel" class="panel">
    <h2>Choose Your Boat</h2>
    <div id="boat-card"><button class="arrow" id="boat-prev">‹</button><div class="show" id="boat-show"></div><button class="arrow" id="boat-next">›</button></div>
    <div id="kinds-list"></div>
    <div id="boats-list"></div>
    <button class="done" data-close>Done</button>
  </section>
  <section id="weather-panel" class="panel">
    <h2>Weather</h2>
    <div id="weather-list"></div>
    <button class="done" data-close>Done</button>
  </section>
  <section id="settings-panel" class="panel">
    <h2>Settings</h2>
    <div class="set"><span>How good are the other crews?</span><div class="seg" id="levels"><button data-level="easy">easy<small>slower, kind</small></button><button data-level="medium">medium<small>a fair race</small></button><button data-level="hard">hard<small>fast, sharp</small></button></div></div>
    <div class="set"><span>Steering</span><div class="seg" id="hands"><button data-hand="touch">anywhere</button><button data-hand="left">stick, left</button><button data-hand="right">stick, right</button></div></div>
    <div class="set"><div class="line"><span>Sound</span><button id="sound">on</button></div></div>
    <div class="set"><div class="line"><span>The coast: <b id="seedname"></b></span><button id="newsea">a new coast</button></div></div>
    <div class="set"><div class="line"><span>How it’s made</span><a href="{{readme}}">notes</a></div></div>
    <button class="done" data-close>Done</button>
  </section>

  <!-- the race -->
  <div id="pills" class="race-only">
    <button id="pause" class="glass" aria-label="pause"><svg viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" rx="1.5" fill="#fff"/><rect x="11" y="2" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
    <div class="stat glass" id="stat-count"><span class="ic"><span class="lifebuoy"></span></span><b id="count">0</b><small>rescued</small></div>
    <div class="stat glass" id="stat-place"><span class="ic" id="place-ic">🏆</span><b id="place">1st</b><small id="place-sub"></small></div>
    <div class="stat glass" id="stat-time"><span class="ic" id="time-ic">⏱️</span><b id="clock">0:00</b></div>
  </div>
  <div id="mapbox" class="race-only"><canvas id="map" width="224" height="224"></canvas><div id="ladder"></div></div>
  <div id="bubble"></div>
  <div id="bar" class="glass"><span class="lifebuoy"></span><div class="meter"><i></i></div><span></span></div>
  <div id="arrows" class="race-only"></div>
  <button id="skip" class="pill">Wait in the harbour ⏩</button>
  <div id="big"></div>
  <div id="stick"></div>
  <div id="ghost"></div>
  <button id="horn" class="glass" aria-label="horn"><svg viewBox="0 0 32 32"><path d="M4 13 h6 l12 -7 v20 l-12 -7 h-6 z" fill="#fff"/><path d="M25 10 q4 6 0 12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></button>
  <div id="pausecard"><div>
    <h2>Paused</h2>
    <button id="resume" class="pill play" style="justify-content:center">Keep going</button>
    <button id="restart" class="pill" style="justify-content:center">Start again</button>
    <button id="quit" class="pill" style="justify-content:center">Menu</button>
  </div></div>
  <div id="finishflag">FINISH</div>

  <!-- the end -->
  <section id="reward" class="podium-only">
    <h2 id="result"></h2>
    <div id="fleet"></div>
    <div id="stars"></div>
    <div class="rewardrow"><div id="polaroid"><img id="snap" alt=""><span id="snapcap"></span></div><ol id="ranks"></ol></div>
    <div id="best"></div>
    <div class="row"><button id="again" class="pill play">Again</button><button id="next" class="pill">New coast</button><button id="tomenu" class="pill">Menu</button></div>
  </section>
  <script type="module" src="{{app}}"></script>
</body>
</html>
