<!doctype html>
<html lang="en" data-exp="rescue-coast">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ed1f7">
  <title>Lily’s Rescue · Rocky Coast</title>
  <style>
    :root { --ink: #183048; --paper: rgba(255,255,255,.88); --soft: rgba(255,255,255,.7); --gold: #f4c542; --silver: #c7d0d8; --bronze: #df9a5c; }
    html, body { margin: 0; height: 100%; background: #9ed1f7; overflow: hidden; touch-action: none; }
    body { color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    nav { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; z-index: 3; }
    nav a { font-size: 13px; letter-spacing: .04em; color: var(--ink); text-decoration: none; background: var(--soft); padding: 5px 10px; border-radius: 14px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

    /* ─── the race: the places along the top, your count, how far to go, arrows to who's waiting ─── */
    .hud { display: none; }
    body.racing .hud { display: flex; }
    #places { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 34px); left: 0; right: 0; justify-content: center; gap: 6px; pointer-events: none; }
    #places .chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 6px; border-radius: 16px; background: var(--paper); box-shadow: 0 2px 8px rgba(20,40,70,.18); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; transition: transform .25s; }
    #places .chip small { font-size: 10px; opacity: .65; }
    #places .chip i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    #places .chip b { font-size: 15px; min-width: 14px; text-align: center; }
    #places .chip.me { transform: scale(1.12); box-shadow: 0 0 0 2.5px var(--ink), 0 3px 10px rgba(20,40,70,.25); }
    #me { position: fixed; left: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 76px); align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 22px; background: var(--paper); box-shadow: 0 3px 12px rgba(20,40,70,.2); pointer-events: none; transition: transform .15s; }
    #me.bump { transform: scale(1.12); }
    #me b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
    #me span { font-size: 12px; opacity: .7; line-height: 1.1; }
    .person { position: relative; width: 16px; height: 26px; }
    .person::before { content: ''; position: absolute; left: 3px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #f2c9a5; box-shadow: inset 0 3px 0 #5a3a22; }
    .person::after { content: ''; position: absolute; left: 1px; top: 11px; width: 14px; height: 14px; border-radius: 7px 7px 3px 3px; background: #f25a3c; }
    #track { position: fixed; right: 12px; top: calc(max(10px, env(safe-area-inset-top)) + 130px); bottom: 150px; width: 8px; border-radius: 4px; background: rgba(255,255,255,.55); box-shadow: 0 2px 8px rgba(20,40,70,.15); pointer-events: none; }
    #track i { position: absolute; left: -3px; width: 14px; height: 14px; margin-bottom: -7px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.3); transition: bottom .2s linear; }
    #track i.me { left: -6px; width: 20px; height: 20px; margin-bottom: -10px; box-shadow: 0 0 0 2.5px var(--ink), 0 1px 4px rgba(0,0,0,.35); z-index: 1; }
    #track .flag { position: absolute; top: -22px; left: -6px; width: 20px; height: 14px; border-radius: 2px; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 10px 7px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    #arrows { position: fixed; inset: 0; pointer-events: none; }
    #arrows .arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; }
    #arrows .arrow span { position: absolute; left: -12px; top: -12px; width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 22px solid #fff; transform-origin: 12px 12px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
    #arrows .arrow b { position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 13px; line-height: 22px; text-align: center; box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.35); }
    #arrows .arrow.fin b { border-radius: 3px; width: 24px; height: 16px; top: -8px; left: -12px; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
    #arrows .arrow.fin span { border-left-width: 26px; }
    #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .pop { position: absolute; transform: translate(-50%, -50%); font-size: 26px; font-weight: 800; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; animation: pop 1s ease-out forwards; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -180%) scale(1); } }
    #call { position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 76px); right: 34px; left: auto; max-width: 52vw; padding: 7px 12px; border-radius: 16px; background: #fff3c4; box-shadow: 0 3px 12px rgba(20,40,70,.22); font-size: 13px; line-height: 1.25; text-align: center; opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; pointer-events: none; }
    #call.on { opacity: 1; transform: none; }
    #call.hurry { background: #ffd0c2; animation: throb .6s ease-in-out infinite alternate; }
    @keyframes throb { to { transform: scale(1.06); } }
    #big { position: fixed; left: 0; right: 0; top: 34%; text-align: center; font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(20,40,70,.5); opacity: 0; pointer-events: none; }
    #big.on { animation: say 1.1s ease-out forwards; }
    #big.long { font-size: 34px; padding: 0 24px; }
    #big.long.on { animation-duration: 2.4s; }
    @keyframes say { 0% { opacity: 0; transform: scale(.4); } 18% { opacity: 1; transform: scale(1.15); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
    #toasts { position: fixed; left: 0; right: 0; bottom: 112px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
    .toast { padding: 6px 14px; border-radius: 16px; background: var(--paper); box-shadow: 0 3px 10px rgba(20,40,70,.2); font-size: 14px; animation: toast 3.2s ease-out forwards; }
    @keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 44px); text-align: center; font-size: 16px; color: #fff; text-shadow: 0 1px 3px rgba(10,30,60,.7); opacity: 0; transition: opacity .6s; pointer-events: none; padding: 0 20px; }
    #hint.on { opacity: 1; }
    #corner { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; z-index: 3; }
    #corner button, #corner a { font-size: 12px; padding: 5px 10px; border-radius: 14px; background: var(--soft); color: var(--ink); text-decoration: none; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

    /* ─── the line-up: a sheet at the bottom, the boats waiting above it ─── */
    #lineup { position: fixed; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; gap: 10px; padding: 18px 16px calc(max(14px, env(safe-area-inset-bottom)) + 34px); border-radius: 24px 24px 0 0; background: var(--paper); box-shadow: 0 -6px 24px rgba(20,40,70,.18); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    body.lineup #lineup { display: flex; }
    #lineup h1 { margin: 0; font-size: 30px; letter-spacing: .01em; }
    #lineup .by { margin: -8px 0 0; font-size: 13px; opacity: .6; }
    #lineup .how { margin: 0; max-width: 420px; text-align: center; font-size: 15px; line-height: 1.35; }
    #boats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    #boats button { display: flex; align-items: center; gap: 6px; padding: 7px 11px 7px 8px; border-radius: 18px; background: #fff; box-shadow: 0 1px 4px rgba(20,40,70,.18); font-size: 14px; }
    #boats button i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    #boats button.on { box-shadow: 0 0 0 3px var(--ink); font-weight: 700; }
    #levels { display: flex; gap: 4px; padding: 3px; border-radius: 16px; background: rgba(24,48,72,.08); }
    #levels button { padding: 5px 12px; border-radius: 13px; font-size: 13px; }
    #levels button.on { background: #fff; box-shadow: 0 1px 4px rgba(20,40,70,.2); font-weight: 700; }
    #go { min-width: 180px; padding: 13px 26px; border-radius: 28px; background: var(--ink); color: #fff; font-size: 22px; font-weight: 800; text-align: center; box-shadow: 0 4px 14px rgba(20,40,70,.35); transition: transform .08s; }
    #go:active, #podium button:active { transform: scale(.96); }
    #lineup .sea { font-size: 12px; opacity: .65; display: flex; gap: 8px; align-items: center; }
    #lineup .sea button { text-decoration: underline; text-underline-offset: 2px; }

    /* ─── the end: the places, 1st to 5th ─── */
    #podium { position: fixed; left: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: stretch; gap: 8px; padding: 16px max(16px, calc(50vw - 200px)) calc(max(14px, env(safe-area-inset-bottom)) + 34px); border-radius: 24px 24px 0 0; background: var(--paper); box-shadow: 0 -6px 24px rgba(20,40,70,.2); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: rise .5s ease-out; }
    body.podium #podium { display: flex; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px); } }
    #podium h2 { margin: 0 0 4px; text-align: center; font-size: 26px; }
    #ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    #ranks li { display: grid; grid-template-columns: 40px 18px 1fr auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 5px 12px; border-radius: 14px; background: #fff; box-shadow: 0 1px 4px rgba(20,40,70,.12); }
    #ranks li b { grid-row: span 2; font-size: 16px; text-align: center; border-radius: 12px; padding: 4px 0; background: rgba(24,48,72,.08); }
    #ranks li.p1 b { background: var(--gold); } #ranks li.p2 b { background: var(--silver); } #ranks li.p3 b { background: var(--bronze); }
    #ranks li i { grid-row: span 2; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    #ranks li span { font-size: 16px; }
    #ranks li em { font-style: normal; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: var(--ink); color: #fff; vertical-align: 2px; }
    #ranks li strong { grid-row: span 2; font-size: 24px; font-variant-numeric: tabular-nums; }
    #ranks li small { font-size: 11px; opacity: .55; }
    #ranks li.me { box-shadow: 0 0 0 3px var(--ink); }
    #podium .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    #podium .row button { padding: 10px 18px; border-radius: 22px; background: #fff; box-shadow: 0 2px 8px rgba(20,40,70,.2); font-size: 16px; font-weight: 700; }
    #podium .row button#again { background: var(--ink); color: #fff; }

    body:not(.racing) #call, body:not(.racing) #arrows, body:not(.racing) #hint, body:not(.racing) #pops { display: none; }
    body.nogl::after { content: 'This needs WebGL2, which this browser doesn\2019 t have.'; position: fixed; inset: 40% 20px auto; text-align: center; }
    .preview nav, .preview .hud, .preview #lineup, .preview #podium, .preview #corner, .preview #big, .preview #toasts, .preview #hint, .preview #call, .preview #arrows, .preview #pops { display: none !important; }
  </style>
</head>
<body>
  <canvas id="sea"></canvas>
  <nav><a href="/">← lab</a> <a href="/rescue">original ↗</a></nav>
  <div id="places" class="hud"></div>
  <div id="me" class="hud"><div class="person"></div><b id="count">0</b><span>rescued</span></div>
  <div id="track" class="hud"></div>
  <div id="arrows"></div>
  <div id="pops"></div>
  <div id="call"></div>
  <div id="big"></div>
  <div id="toasts"></div>
  <div id="hint">hold your finger on the sea where you want to go</div>
  <section id="lineup">
    <h1>Rescue · Rocky Coast</h1>
    <p class="by">a game by Lily</p>
    <p class="how">Steer near the little boats and the people will come aboard. Rescue the most, then cross the finish line!</p>
    <div id="boats"></div>
    <div id="levels"><button data-level="easy">easy</button><button data-level="medium">medium</button><button data-level="hard">hard</button></div>
    <button id="go">Go!</button>
    <div class="sea">the sea: <span id="seedname"></span><button id="newsea">a new sea</button></div>
  </section>
  <section id="podium">
    <h2 id="result"></h2>
    <ol id="ranks"></ol>
    <div class="row"><button id="again">again</button><button id="next">a new sea</button><button id="choose">choose a boat</button></div>
  </section>
  <div id="corner"><button id="sound">sound on</button><a href="{{readme}}">notes</a></div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
