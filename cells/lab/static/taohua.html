  <style>
    html, body { margin: 0; height: 100%; background: #efe6d3; overflow: hidden; touch-action: none; }
    body { color: #2d2622; font-family: "Noto Serif SC", "Songti SC", "STSong", serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; z-index: 2; }
    nav a { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 13px; letter-spacing: .1em; font-variant: small-caps; color: #2d2622; text-decoration: none; opacity: .8; }
    /* the title, at the foot of the print where the journey starts: the first temple's name over 桃花, large, and the seal; it stays with the hill there, and is walked away from */
    #title { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); writing-mode: vertical-rl; display: flex; align-items: flex-end; gap: .2em; pointer-events: none; color: #f6efe2; text-shadow: 0 1px 14px rgba(150,40,30,.35); }
    #name { font-size: clamp(26px, 8vw, 46px); font-weight: 400; letter-spacing: .05em; }
    #big { font-size: clamp(58px, 17vw, 108px); font-weight: 900; line-height: 1; }
    #title .seal { writing-mode: horizontal-tb; align-self: flex-start; margin-top: .4em; width: 22px; height: 22px; border: 1.5px solid #f6efe2; font-size: 9px; line-height: 1.05; display: grid; place-items: center; text-align: center; font-family: "Ma Shan Zheng", serif; opacity: .9; }
    #climb { position: fixed; right: 16px; top: max(12px, env(safe-area-inset-top)); font-size: 13px; letter-spacing: .1em; opacity: .75; font-variant-numeric: tabular-nums; }
    #climb::after { content: " 步"; }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 8px); text-align: center; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-size: 15px; opacity: 0; transition: opacity .8s; pointer-events: none; text-shadow: 0 0 8px rgba(239,230,211,1); }
    #hint.on { opacity: .85; }
    .preview nav, .preview #hint, .preview #climb { display: none; }
    /* where a tap on the path sends the walker: a ring of vermilion ink, left open as a brush draws it, on its place in the scene, for a moment */
    #mark { position: fixed; left: 0; top: 0; width: 46px; height: 24px; margin: -12px 0 0 -23px; pointer-events: none; opacity: 0; }
    #mark svg { width: 100%; height: 100%; overflow: visible; }
    /* the composition view: the text's places shown as the spaces they take, so they can be judged with the masses */
    #brush { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    .ink #brush { display: block; }
    .ink #title { outline: 1.5px dashed rgba(176,52,40,.7); outline-offset: 6px; }
    .ink #title * { opacity: .35; }
    .preview #big { font-size: 56px; } .preview #name { font-size: 20px; }
    .nogl::after { content: "This needs WebGL2."; position: fixed; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <canvas id="print"></canvas>
  <canvas id="brush"></canvas>
  <nav><a href="/">&larr; lab</a></nav>
  <div id="title"><span id="name"></span><span id="big">桃花</span><span class="seal">桃源</span></div>
  <div id="climb">0</div>
  <div id="mark"><svg viewBox="-24 -12 48 24"><path d="M 19 -4 A 20 9.5 0 1 1 9 -8.4" fill="none" stroke="#b8382c" stroke-width="2.6" stroke-linecap="round"/><path d="M 10 -8 A 20 9.5 0 0 1 17 -5.6" fill="none" stroke="#b8382c" stroke-width="1.2" stroke-linecap="round" opacity=".6"/></svg></div>
  <div id="hint">tap a way to walk there &middot; drag to look about</div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
