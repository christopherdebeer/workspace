<!doctype html>
<html lang="zh" data-exp="taohua">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe6d3">
  <title>Taohua · 桃花</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;900&display=swap&text=%200123456789%C2%B7%E3%80%82%E4%B8%89%E4%B8%8D%E4%B8%A4%E4%B8%AD%E4%BA%91%E4%BA%BA%E4%BB%8A%E4%BC%A6%E4%BD%95%E4%BE%9D%E5%85%88%E5%85%A5%E5%85%B0%E5%87%89%E5%88%AB%E5%8D%83%E5%8E%BB%E5%8F%8A%E5%94%90%E5%9B%9B%E5%9C%B0%E5%A4%84%E5%A4%96%E5%A4%A7%E5%A4%A9%E5%A4%B9%E5%A7%8B%E5%AE%8B%E5%AF%BA%E5%B0%BA%E5%B0%BD%E5%B1%85%E5%B1%B1%E5%B2%A9%E5%B2%B8%E5%B4%94%E5%B9%B4%E5%BA%B5%E5%BC%80%E5%BD%92%E6%81%A8%E6%83%85%E6%88%91%E6%8A%A4%E6%95%B0%E6%97%A0%E6%97%A5%E6%97%A7%E6%98%8E%E6%98%93%E6%98%A0%E6%98%A5%E6%99%8B%E6%9A%96%E6%9C%88%E6%9C%89%E6%9D%82%E6%9D%8E%E6%9D%A5%E6%9E%97%E6%9E%9D%E6%A0%91%E6%A0%96%E6%A1%83%E6%AD%A4%E6%AD%A5%E6%B0%B4%E6%B1%9F%E6%B1%AA%E6%B5%81%E6%B7%B1%E6%B8%85%E6%B8%8A%E6%BA%90%E6%BD%AD%E7%81%B5%E7%84%B6%E7%99%BD%E7%99%BE%E7%9B%9B%E7%9B%B8%E7%9F%A5%E7%AA%85%E7%AB%B9%E7%AC%91%E7%BA%A2%E7%BA%B7%E7%BC%A4%E7%BE%8E%E8%8A%B1%E8%8A%B3%E8%8B%8F%E8%8B%A5%E8%8B%B1%E8%8D%89%E8%8F%B2%E8%90%BD%E8%A7%85%E8%BD%AC%E8%BD%BC%E9%80%81%E9%95%BF%E9%97%A8%E9%97%B4%E9%99%B6%E9%9C%9E%E9%9D%9E%E9%9D%A2%E9%A3%8E%E9%B2%9C%E9%B8%AD%EF%BC%8C">
  <style>
    html, body { margin: 0; height: 100%; background: #efe6d3; overflow: hidden; touch-action: none; }
    body { color: #2d2622; font-family: "Noto Serif SC", "Songti SC", "STSong", serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; z-index: 2; }
    nav a { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 13px; letter-spacing: .1em; font-variant: small-caps; color: #2d2622; text-decoration: none; opacity: .8; }
    /* the couplet down the side, as on the print: the first line on the right */
    #poem { position: fixed; left: max(22px, env(safe-area-inset-left)); top: calc(max(12px, env(safe-area-inset-top)) + 46px); writing-mode: vertical-rl; display: flex; gap: .55em; align-items: flex-start; pointer-events: none; opacity: 0; transition: opacity 1.4s; font-size: clamp(17px, 4.6vw, 26px); letter-spacing: .12em; line-height: 1.25; color: #2b2420; text-shadow: 0 0 6px rgba(239,230,211,.9), 0 0 2px rgba(239,230,211,1); }
    #poem.on { opacity: 1; }
    #poem .by { font-size: .58em; letter-spacing: .25em; margin-top: 2.2em; opacity: .85; }
    #poem .seal { writing-mode: horizontal-tb; width: 1.25em; height: 1.25em; margin-top: .6em; border: 2px solid #b8382c; color: #b8382c; font-size: .55em; line-height: 1.05; display: grid; place-items: center; text-align: center; letter-spacing: 0; font-family: "Ma Shan Zheng", serif; }
    /* the title, bottom right: the temple's name over 桃花, large */
    #title { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); writing-mode: vertical-rl; display: flex; align-items: flex-end; gap: .2em; pointer-events: none; color: #f6efe2; text-shadow: 0 1px 14px rgba(150,40,30,.35); }
    #name { font-size: clamp(26px, 8vw, 46px); font-weight: 400; letter-spacing: .05em; }
    #big { font-size: clamp(64px, 20vw, 120px); font-weight: 900; line-height: 1; }
    #title .seal { writing-mode: horizontal-tb; align-self: flex-start; margin-top: .4em; width: 22px; height: 22px; border: 1.5px solid #f6efe2; font-size: 9px; line-height: 1.05; display: grid; place-items: center; text-align: center; font-family: "Ma Shan Zheng", serif; opacity: .9; }
    #climb { position: fixed; right: 16px; top: max(12px, env(safe-area-inset-top)); font-size: 13px; letter-spacing: .1em; opacity: .75; font-variant-numeric: tabular-nums; }
    #climb::after { content: " 步"; }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 8px); text-align: center; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-size: 15px; opacity: 0; transition: opacity .8s; pointer-events: none; text-shadow: 0 0 8px rgba(239,230,211,1); }
    #hint.on { opacity: .85; }
    .preview nav, .preview #hint, .preview #climb { display: none; }
    .preview #poem { font-size: 14px; } .preview #big { font-size: 56px; } .preview #name { font-size: 20px; }
    .nogl::after { content: "This needs WebGL2."; position: fixed; inset: 0; display: grid; place-items: center; }
  </style>
</head>
<body>
  <canvas id="print"></canvas>
  <nav><a href="/">&larr; lab</a></nav>
  <div id="poem"><span class="l1"></span><span class="l2"></span><span class="by"></span><span class="seal">春山</span></div>
  <div id="title"><span id="name"></span><span id="big">桃花</span><span class="seal">桃源</span></div>
  <div id="climb">0</div>
  <div id="hint">hold anywhere to climb &middot; drag to look about</div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
