<!doctype html>
<html lang="en" data-exp="bamboo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe6d2">
  <title>Bamboo · 竹径</title>
  <style>
    html, body { margin: 0; height: 100%; background: #efe6d2; overflow: hidden; touch-action: none; }
    body { color: #23201b; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", Georgia, serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #labnav { position: fixed; left: 12px; top: max(8px, env(safe-area-inset-top)); z-index: 5; font-size: 13px; color: #23201b; text-decoration: none; opacity: .55; letter-spacing: .04em; }
    #title { position: fixed; right: 14px; top: max(10px, env(safe-area-inset-top)); font-size: 15px; letter-spacing: .08em; opacity: .7; writing-mode: vertical-rl; pointer-events: none; }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 10px); text-align: center; font-size: 15px; font-style: italic; opacity: .75; transition: opacity 1.6s; pointer-events: none; text-shadow: 0 0 6px #efe6d2, 0 0 2px #efe6d2; }
    #hint.gone { opacity: 0; }
    #caption { position: fixed; left: 0; right: 0; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 44px); text-align: center; font-size: 16px; font-style: italic; opacity: 0; transition: opacity .8s; pointer-events: none; text-shadow: 0 0 8px #efe6d2, 0 0 3px #efe6d2; }
    #caption.on { opacity: .85; }
    #inkbtn { position: fixed; right: 10px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 4px); width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(35,32,27,.35); background: rgba(239,230,210,.82); font: 19px/36px inherit; text-align: center; color: #23201b; z-index: 6; cursor: pointer; }
    #reach { position: fixed; right: 10px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 52px); width: min(270px, 78vw); padding: 12px 14px 10px; background: rgba(239,230,210,.94); border: 1px solid rgba(35,32,27,.25); border-radius: 6px; z-index: 6; display: none; font-size: 14px; }
    #reach.open { display: block; }
    #reach .presets { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    #reach .presets button { font: inherit; font-size: 13px; padding: 3px 9px; border: 1px solid rgba(35,32,27,.4); background: transparent; border-radius: 12px; color: #23201b; }
    #reach .presets button.on { background: #23201b; color: #efe6d2; }
    #reach label { display: grid; grid-template-columns: 52px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; font-style: italic; }
    #reach input { width: 100%; accent-color: #23201b; }
    #reach .v { text-align: right; font-variant-numeric: tabular-nums; font-style: normal; opacity: .7; }
    body.preview #labnav, body.preview #hint, body.preview #title, body.preview #caption, body.preview #inkbtn, body.preview #reach { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <a id="labnav" href="./">‹ lab</a>
  <div id="title">竹径 · bamboo</div>
  <div id="caption"></div>
  <div id="hint">hold to run · drag to turn</div>
  <button id="inkbtn" aria-label="how far it's drawn">墨</button>
  <div id="reach">
    <div class="presets"><button data-p="picture">picture</button><button data-p="board">board</button><button data-p="drawing">drawing</button><button data-p="marks">marks</button></div>
    <label>colour <input type="range" id="r-colour" min="0" max="120" step="1"><span class="v" id="v-colour"></span></label>
    <label>wash <input type="range" id="r-wash" min="0" max="140" step="1"><span class="v" id="v-wash"></span></label>
    <label>ink <input type="range" id="r-ink" min="10" max="240" step="1"><span class="v" id="v-ink"></span></label>
    <label>frame <input type="range" id="r-frame" min="0" max="1" step="0.01"><span class="v" id="v-frame"></span></label>
    <label>depth <input type="range" id="r-depth" min="0" max="1.5" step="0.01"><span class="v" id="v-depth"></span></label>
  </div>
  <script>if (/[?&](preview|ref)\b/.test(location.search)) document.body.classList.add('preview');</script>
  <script type="module" src="{{app}}"></script>
</body>
</html>
