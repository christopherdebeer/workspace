<!doctype html>
<html lang="en" data-exp="bricks">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e8e6">
  <title>Bricks</title>
  <style>
    html, body { margin: 0; height: 100%; background: #e8e8e6; overflow: hidden; touch-action: none; }
    body { color: #34383b; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex; gap: 14px; }
    nav button, nav a { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .66; padding: 4px 2px; color: inherit; text-decoration: none; }
    nav button:hover, nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    /* the next brick is drawn in the canvas, in this box, above its word */
    #next { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 12px; width: 86px; height: 104px; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; letter-spacing: .12em; font-variant: small-caps; opacity: .6; pointer-events: none; white-space: nowrap; }
    #tray { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 0 max(14px, env(safe-area-inset-bottom)); }
    #hands { display: flex; justify-content: center; gap: 12px; padding: 8px 14px 0; }
    #hands button { min-width: 76px; height: 52px; border-radius: 26px; text-align: center; line-height: 52px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 15px; letter-spacing: .1em; font-variant: small-caps; background: rgba(255,255,255,.7); box-shadow: 0 4px 14px rgba(40,40,40,.07); }
    #hands button:active { background: #fff; }
    #hands #set { min-width: 100px; background: rgba(52, 56, 59, .86); color: #f4f4f2; }
    #hint { position: fixed; left: 0; right: 0; top: calc(max(12px, env(safe-area-inset-top)) + 120px); text-align: center; font-style: italic; font-size: 15px; opacity: 0; transition: opacity 2s; pointer-events: none; padding: 0 24px; }
    #hint.on { opacity: .62; }
    .preview nav, .preview #tray, .preview #hint, .preview #next { display: none; }
  </style>
</head>
<body>
  <canvas id="build"></canvas>
  <nav><button id="again">begin again</button><button id="sound">sound · on</button><a href="{{readme}}">notes</a></nav>
  <div id="hint">place each brick as it comes · move it with a finger, tap it to press it on · two fingers to pinch, twist and slide</div>
  <div id="next">next</div>
  <div id="tray"><div id="hands"><button id="undo">undo</button><button id="turn">turn</button><button id="set">set</button></div></div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
