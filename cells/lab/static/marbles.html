<!doctype html>
<html lang="en" data-exp="marbles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a8fd0">
  <title>Marble Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #dde3ea; overflow: hidden; touch-action: none; }
    body { color: #26292d; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    /* the top is only the way back to the lab */
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; }
    nav a { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .8; padding: 4px 2px; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); text-decoration: none; white-space: nowrap; }
    nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    #board { position: fixed; right: 12px; top: calc(max(12px, env(safe-area-inset-top)) + 40px); background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 12px; padding: 5px 10px; font-size: 11px; min-width: 140px; line-height: 1.3; }
    #board .row { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; }
    #board .row i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
    #board .row b { width: 12px; opacity: .6; font-weight: normal; }
    #board .row span { flex: 1; }
    #board .row em { font-style: normal; opacity: .6; font-variant-numeric: tabular-nums; }
    #board .row.me span { font-weight: bold; }
    #clock { position: fixed; left: 14px; top: calc(max(12px, env(safe-area-inset-top)) + 40px); font-size: 13px; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
    /* the hands, all at the bottom: a row of pills, and a row of small words above it */
    #hands { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    #hands button, #hands a { pointer-events: auto; }
    #hands .pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    #hands .pills button { min-width: 72px; height: 48px; border-radius: 24px; text-align: center; line-height: 48px; padding: 0 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 15px; letter-spacing: .1em; font-variant: small-caps; background: rgba(255,255,255,.72); box-shadow: 0 4px 14px rgba(20,30,40,.12); }
    #hands .pills button:active { background: #fff; }
    #hands #go { background: #26292d; color: #f4f6f8; min-width: 120px; }
    #hands #go::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--mine, #fff); margin-right: 8px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
    #hands .words { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    #hands .words button, #hands .words a, #hands .words span { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .8; padding: 4px 2px; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); text-decoration: none; white-space: nowrap; }
    #hands .words button:hover, #hands .words a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    #hands .build-only, #hands .lineup-only, #hands .race-only, #hands .chase-only { display: none; }
    .building #hands .build-only { display: inline-block; }
    .lineup #hands .lineup-only { display: inline-block; }
    body:not(.lineup) #hands .race-only { display: inline-block; }
    body:not(.building):not(.lineup) #hands .chase-only { display: inline-block; }
    .building #hands #seed { display: none; }
    /* building: the three on offer */
    #offers { position: fixed; left: 0; right: 0; bottom: 124px; display: none; justify-content: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
    .building #offers { display: flex; }
    #offers .offer { width: 112px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 14px rgba(20,30,40,.12); }
    #offers .offer b { font-size: 14px; font-weight: normal; }
    #offers .offer span { font-size: 11px; opacity: .6; }
    #offers .offer.on { background: #26292d; color: #f4f6f8; }
    #offers .offer.on span { opacity: .75; }
    #offers #more { font-size: 12px; letter-spacing: .1em; font-variant: small-caps; padding: 8px 10px; opacity: .8; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    #hint { padding: 0 10px 4px; text-align: center; font-size: 14px; font-style: italic; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.4); pointer-events: none; }
    .building #hint { display: none; }
    #seed { font-size: 11px; letter-spacing: .1em; font-variant: small-caps; opacity: .6; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .preview nav, .preview #board, .preview #clock, .preview #hands, .preview #offers, .preview #hint { display: none; }
  </style>
</head>
<body>
  <canvas id="run"></canvas>
  <nav><a href="/">← lab</a></nav>
  <div id="clock"></div>
  <div id="board"></div>
  <div id="offers"></div>
  <div id="hands">
    <div id="hint"></div>
    <div class="words"><button id="race" class="race-only">from the top</button><button id="here" class="race-only">from the end</button><button id="build">build</button><button id="new">a new run</button><button id="sound">sound · on</button><a href="{{readme}}">notes</a></div>
    <div class="pills"><button id="go" class="lineup-only">go</button><button id="follow" class="chase-only">following</button><button id="add" class="build-only">add it</button><button id="undo" class="build-only">take the last off</button></div>
    <span id="seed"></span>
  </div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
