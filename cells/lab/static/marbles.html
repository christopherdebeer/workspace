<!doctype html>
<html lang="en" data-exp="marbles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a8fd0">
  <title>Marble Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #dde3ea; overflow: hidden; touch-action: none; }
    body { color: #26292d; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    /* the top is only the way back to the lab */
    /* a scrim at the top and the bottom, so what's written there can be read over pale cardboard or dark planks */
    #top { position: fixed; left: 0; right: 0; top: 0; height: calc(max(12px, env(safe-area-inset-top)) + 96px); background: linear-gradient(to bottom, rgba(24,18,12,.55), rgba(24,18,12,0)); pointer-events: none; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; }
    nav a { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .95; padding: 4px 2px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); text-decoration: none; white-space: nowrap; }
    nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    /* the order: a row of the marbles across the top, first on the left; yours bigger, with its name; tap one */
    #order { position: fixed; left: 10px; right: 10px; top: calc(max(12px, env(safe-area-inset-top)) + 34px); display: flex; justify-content: center; align-items: flex-start; gap: 5px; }
    #order .dot { width: 22px; height: 34px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    #order .dot i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.35); transition: width .2s, height .2s; margin-top: 3px; }
    #order .dot.me i { width: 20px; height: 20px; margin-top: 0; box-shadow: 0 0 0 2px var(--accent, #fff), 0 1px 4px rgba(0,0,0,.5); }
    #order .dot span { font-size: 10px; letter-spacing: .06em; font-variant: small-caps; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); white-space: nowrap; opacity: 0; }
    #order .dot.me span { opacity: 1; }
    #order .dot.in i { box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.35), 0 0 0 1px rgba(255,255,255,.6); }
    /* at the finish, each marble's name beside it, to the right of the channel */
    #names { position: fixed; inset: 0; pointer-events: none; }
    #names .name { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); opacity: 0; transition: opacity .6s; }
    #names.on .name { opacity: 1; }
    #names .name b { font-weight: normal; opacity: .7; margin-right: 4px; font-variant-numeric: tabular-nums; }
    #names .name em { font-style: normal; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
    #clock { position: fixed; right: 14px; top: max(12px, env(safe-area-inset-top)); font-size: 13px; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
    /* the hands, all at the bottom: a row of pills, and a row of small words above it */
    #hands { position: fixed; left: 0; right: 0; bottom: 0; padding: 28px 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; background: linear-gradient(to top, rgba(24,18,12,.6), rgba(24,18,12,.35) 60%, rgba(24,18,12,0)); }
    #hands button, #hands a { pointer-events: auto; }
    #hands .pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    #hands .pills button { min-width: 72px; height: 48px; border-radius: 24px; text-align: center; line-height: 48px; padding: 0 16px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 15px; letter-spacing: .1em; font-variant: small-caps; background: rgba(255,255,255,.72); box-shadow: 0 4px 14px rgba(20,30,40,.12); }
    #hands .pills button:active { background: #fff; }
    #hands #go { background: #26292d; color: #f4f6f8; min-width: 120px; }
    #hands #go::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--mine, #fff); margin-right: 8px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
    #hands .words { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    #hands .words button, #hands .words a, #hands .words span { font-size: 14px; letter-spacing: .1em; font-variant: small-caps; opacity: .95; padding: 4px 4px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); text-decoration: none; white-space: nowrap; }
    #hands .words button:hover, #hands .words a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    #hands .build-only, #hands .lineup-only, #hands .race-only, #hands .chase-only { display: none; }
    .building #hands .build-only { display: inline-block; }
    .lineup #hands .lineup-only { display: inline-block; }
    body:not(.lineup) #hands .race-only { display: inline-block; }
    body:not(.building):not(.lineup) #hands .chase-only { display: inline-block; }
    .building #hands #seed { display: none; }
    /* building: the three on offer */
    #offers { position: fixed; left: 0; right: 0; bottom: 124px; display: none; justify-content: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
    .building #offers { display: flex; }
    #offers .offer { width: 112px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 14px rgba(20,30,40,.12); }
    #offers .offer b { font-size: 14px; font-weight: normal; }
    #offers .offer span { font-size: 11px; opacity: .6; }
    #offers .offer.on { background: #26292d; color: #f4f6f8; }
    #offers .offer.on span { opacity: .75; }
    #offers #more { font-size: 12px; letter-spacing: .1em; font-variant: small-caps; padding: 8px 10px; opacity: .8; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    #hint { padding: 0 10px 4px; text-align: center; font-size: 14px; font-style: italic; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
    .building #hint { display: none; }
    #seed { font-size: 11px; letter-spacing: .1em; font-variant: small-caps; opacity: .75; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .preview #top, .preview nav, .preview #order, .preview #names, .preview #clock, .preview #hands, .preview #offers, .preview #hint { display: none; }
  </style>
</head>
<body>
  <canvas id="run"></canvas>
  <div id="top"></div>
  <nav><a href="/">← lab</a></nav>
  <div id="clock"></div>
  <div id="order"></div>
  <div id="names"></div>
  <div id="offers"></div>
  <div id="hands">
    <div id="hint"></div>
    <div class="words"><button id="race" class="race-only">from the top</button><button id="here" class="race-only">from the end</button><button id="build">build</button><button id="new">a new run</button><button id="sound">sound · on</button><button id="theme">atelier</button><a href="{{readme}}">notes</a></div>
    <div class="pills"><button id="go" class="lineup-only">go</button><button id="follow" class="chase-only">following</button><button id="add" class="build-only">add it</button><button id="undo" class="build-only">take the last off</button></div>
    <span id="seed"></span>
  </div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
