<!doctype html>
<html lang="en" data-exp="marbles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a8fd0">
  <title>Marble Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #dde3ea; overflow: hidden; touch-action: none; }
    body { color: #26292d; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; -webkit-user-select: none; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    button { all: unset; cursor: pointer; box-sizing: border-box; }
    /* the top is only the way back to the lab */
    /* a scrim at the top and the bottom, so what's written there can be read over pale cardboard or dark planks */
    #top { position: fixed; left: 0; right: 0; top: 0; height: calc(max(12px, env(safe-area-inset-top)) + 96px); background: linear-gradient(to bottom, rgba(24,18,12,.55), rgba(24,18,12,0)); pointer-events: none; }
    nav { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 14px; }
    nav a { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; opacity: .95; padding: 4px 2px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); text-decoration: none; white-space: nowrap; }
    nav a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
    /* the order: a row of the marbles across the top, first on the left; yours bigger, with its name; tap one */
    #order { position: fixed; left: 10px; right: 10px; top: calc(max(12px, env(safe-area-inset-top)) + 34px); display: flex; justify-content: center; align-items: flex-start; gap: 5px; }
    #order .dot { width: 22px; height: 34px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    #order .dot i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.35); transition: width .2s, height .2s; margin-top: 3px; }
    #order .dot.me i { width: 20px; height: 20px; margin-top: 0; box-shadow: 0 0 0 2px var(--accent, #fff), 0 1px 4px rgba(0,0,0,.5); }
    #order .dot span { font-size: 10px; letter-spacing: .06em; font-variant: small-caps; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); white-space: nowrap; opacity: 0; }
    #order .dot.me span { opacity: 1; }
    #order .dot.in i { box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.35), 0 0 0 1px rgba(255,255,255,.6); }
    /* at the finish, each marble's name beside it, to the right of the channel */
    #names { position: fixed; inset: 0; pointer-events: none; }
    #names .name { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); opacity: 0; transition: opacity .6s; }
    #names .name.in { opacity: 1; }
    #names:not(.on) .name { opacity: 0; }
    #names .name.me { font-weight: bold; }
    #names .name b { font-weight: normal; opacity: .7; margin-right: 4px; font-variant-numeric: tabular-nums; }
    #names .name em { font-style: normal; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
    #clock { position: fixed; right: 14px; top: max(12px, env(safe-area-inset-top)); font-size: 13px; letter-spacing: .06em; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-variant-numeric: tabular-nums; }
    /* the hands, all at the bottom: a line of help (for a moment), the two pills (the race's
       one main button and the camera; or building's three), and a row of small words */
    #hands { position: fixed; left: 0; right: 0; bottom: 0; padding: 28px 14px max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; background: linear-gradient(to top, rgba(18,14,10,.62), rgba(18,14,10,.3) 60%, rgba(18,14,10,0)); }
    #hands button, #hands a { pointer-events: auto; }
    #hands .pills { display: flex; justify-content: center; gap: 10px; }
    #hands .pills button { height: 50px; border-radius: 25px; text-align: center; line-height: 50px; padding: 0 20px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 16px; letter-spacing: .08em; font-variant: small-caps; background: rgba(255,255,255,.82); color: #26292d; box-shadow: 0 4px 16px rgba(0,0,0,.18); white-space: nowrap; transition: transform .08s; }
    #hands .pills button:active { transform: scale(.96); background: #fff; }
    #hands .pills button i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
    #hands .pills button i.lead { background: conic-gradient(#e33, #fb3, #3c6, #39f, #a4e, #e33); }
    #hands .pills button i.flag { border-radius: 2px; background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 7px 7px; }
    #hands #go { background: #26292d; color: #f6f4ef; min-width: 128px; }
    #hands #go::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--mine, #fff); margin-right: 9px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
    body:not(.lineup) #hands #go::before { display: none; }
    #hands #cam { min-width: 128px; }
    #hands .words { display: flex; justify-content: center; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
    #hands .words button, #hands .words a { font-size: 13px; letter-spacing: .1em; font-variant: small-caps; padding: 6px 2px; color: #fff; opacity: .9; text-shadow: 0 1px 3px rgba(0,0,0,.6); text-decoration: none; white-space: nowrap; }
    #hands .words button:active, #hands .words a:active { opacity: .6; }
    #hands .build-only, #hands .race-only { display: none; }
    .building #hands .build-only { display: inline-block; }
    body:not(.building) #hands .race-only { display: inline-block; }
    #hint { min-height: 20px; padding: 0 10px; text-align: center; font-size: 14px; font-style: italic; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .6s; }
    #hint.on { opacity: 1; }
    #seed { font-size: 11px; letter-spacing: .1em; font-variant: small-caps; opacity: .6; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    /* building: the three on offer */
    #offers { position: fixed; left: 0; right: 0; bottom: 150px; display: none; justify-content: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
    .building #offers { display: flex; }
    #offers .offer { width: 104px; padding: 8px 8px 9px; border-radius: 14px; background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; gap: 3px; box-shadow: 0 4px 16px rgba(0,0,0,.16); color: #26292d; transition: transform .12s; }
    #offers .offer svg { display: block; margin-bottom: 2px; }
    #offers .offer svg .bd { fill: rgba(150,115,70,.18); stroke: rgba(80,60,40,.55); stroke-width: .8; }
    #offers .offer svg line { stroke: #4a3b2a; stroke-width: 1.3; stroke-linecap: round; }
    #offers .offer svg circle { fill: #4a3b2a; }
    #offers .offer svg circle.sp { fill: none; stroke: #8a6a3a; stroke-width: .8; stroke-dasharray: 2 1.5; }
    #offers .offer svg .tn { fill: none; stroke: #b34; stroke-width: 1.4; stroke-linecap: round; }
    #offers .offer svg .dk { fill: rgba(150,110,60,.35); }
    #offers .offer svg .rf { fill: rgba(80,60,40,.35); stroke: none; }
    #offers .offer svg .rf.cl { fill: rgba(120,170,210,.35); }
    #offers .offer svg line.cl { stroke: #6aa6cf; }
    #offers .offer b { font-size: 13px; font-weight: normal; text-align: center; line-height: 1.15; }
    #offers .offer span { font-size: 10px; opacity: .6; font-variant-numeric: tabular-nums; }
    #offers .offer.on { background: #26292d; color: #f6f4ef; transform: translateY(-4px); }
    #offers .offer.on svg .bd { fill: rgba(255,240,210,.12); stroke: rgba(255,240,210,.5); }
    #offers .offer.on svg line, #offers .offer.on svg circle { stroke: #f2e6cf; }
    #offers .offer.on svg circle:not(.sp) { fill: #f2e6cf; }
    #offers .offer.on span { opacity: .75; }
    #offers #more { font-size: 12px; letter-spacing: .1em; font-variant: small-caps; padding: 8px 10px; opacity: .8; color: #f4f6f8; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .preview #top, .preview nav, .preview #order, .preview #names, .preview #clock, .preview #hands, .preview #offers, .preview #hint { display: none; }
  </style>
</head>
<body>
  <canvas id="run"></canvas>
  <div id="top"></div>
  <nav><a href="/">← lab</a></nav>
  <div id="clock"></div>
  <div id="order"></div>
  <div id="names"></div>
  <div id="offers"></div>
  <div id="hands">
    <div id="hint"></div>
    <div class="pills"><button id="go" class="race-only">go</button><button id="cam" class="race-only">camera</button><button id="add" class="build-only">add it</button><button id="undo" class="build-only">undo</button><button id="try" class="build-only">try it</button></div>
    <div class="words"><button id="build">build</button><button id="new">new run</button><button id="theme">atelier</button><button id="sound">sound on</button><a href="{{readme}}">notes</a><span id="seed"></span></div>
  </div>
  <script type="module" src="{{app}}"></script>
</body>
</html>
