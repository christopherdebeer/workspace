<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lit · parc.land</title>
</head>
<body>
  <div id="app"><p class="boot">loading…</p></div>
  <div id="err-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7a1f1f;color:#fff;font:12px/1.4 monospace;padding:6px 10px;z-index:9999;white-space:pre-wrap;"></div>
  <script>
    // On-device console: ?debug=1 (sticky via ?debug=0 to clear).
    (function () {
      try {
        var qs = new URLSearchParams(location.search);
        if (qs.get('debug') === '1') localStorage.setItem('parc.lit.debug', '1');
        if (qs.get('debug') === '0') localStorage.removeItem('parc.lit.debug');
        if (localStorage.getItem('parc.lit.debug') === '1') {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/eruda';
          s.onload = function () { window.eruda && window.eruda.init(); };
          document.head.appendChild(s);
        }
      } catch (e) { /* storage unavailable */ }
    })();
    // Boot watchdog: a silent hang names the step it stuck on.
    setTimeout(function () {
      var b = document.querySelector('#app .boot');
      if (!b) return;
      var eb = document.getElementById('err-banner');
      eb.style.display = 'block';
      eb.textContent = window.__lit_module
        ? 'still booting after 12s, stuck at: "' + b.textContent + '" — reload with ?debug=1 for a console'
        : 'app.js never executed — the module script failed to load (path/MIME/network); check the network tab for app.js';
    }, 12000);
    window.addEventListener('error', function (e) {
      var b = document.getElementById('err-banner');
      b.style.display = 'block';
      b.textContent = 'error: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var b = document.getElementById('err-banner');
      b.style.display = 'block';
      b.textContent = 'rejection: ' + (e.reason && (e.reason.message || String(e.reason)));
    });
  </script>
  <script type="module" src="/@c15r/lit/app.js"></script>
</body>
</html>
