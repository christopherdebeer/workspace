<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>parc.land</title>
  <style>
    html,body{margin:0;background:#f3edde}
    /* Rendered fact markdown (.fact-md) appears inside PANELS — sheet-scale
       headings, not document-scale (a peeked doc's H1 was 2em inside a 340px
       scroll box). Code blocks scroll instead of stretching the panel. */
    .fact-md h1{font-size:1.2em;margin:.5em 0 .3em}
    .fact-md h2{font-size:1.1em;margin:.5em 0 .25em}
    .fact-md h3,.fact-md h4{font-size:1em;margin:.4em 0 .2em}
    .fact-md h1,.fact-md h2{line-height:1.25}
    .fact-md p{margin:.35em 0}
    .fact-md ul,.fact-md ol{margin:.35em 0;padding-left:1.3em}
    .fact-md li{margin:.15em 0}
    .fact-md pre{overflow-x:auto;background:rgba(0,0,0,.28);padding:.5em .6em;border-radius:8px;font-size:.92em}
    .fact-md code{overflow-wrap:anywhere}
    .fact-md p code,.fact-md li code,.fact-md td code{background:rgba(0,0,0,.22);padding:.05em .3em;border-radius:4px;font-size:.92em}
    .fact-md a{color:#f5c453}
    .fact-md a:hover{text-decoration-style:solid}
    .fact-md blockquote{margin:.5em 0;padding:.1em .9em;border-left:3px solid rgba(245,196,83,.45);opacity:.9}
    .fact-md hr{border:none;border-top:1px solid rgba(245,196,83,.25);margin:1em 0}
    .fact-md table{border-collapse:collapse;font-size:.92em}
    .fact-md th,.fact-md td{border:1px solid rgba(255,255,255,.14);padding:.25em .55em;text-align:left}
    .fact-md th{background:rgba(0,0,0,.18)}
    .fact-md img{border-radius:8px}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="err-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7a1f1f;color:#fff;font:12px/1.4 monospace;padding:6px 10px;z-index:9999;white-space:pre-wrap;"></div>
  <script>
    // ?debug=1 injects the eruda mobile devtools BEFORE the app module loads
    // (module scripts are deferred, document.write here still beats them).
    // Sticky via localStorage so in-app navigations keep the console;
    // ?debug=0 turns it back off.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('debug');
        if (q === '0') localStorage.removeItem('parc.debug');
        else if (q === '1') localStorage.setItem('parc.debug', '1');
        var stickyDebug = localStorage.getItem('parc.debug') === '1';
        // Preserve the explicit opt-in across full reloads too: the server can
        // then return the debug-only CSP needed by Eruda's console evaluator.
        if (q === null && stickyDebug) {
          var debugUrl = new URL(location.href);
          debugUrl.searchParams.set('debug', '1');
          location.replace(debugUrl.href);
          return;
        }
        if (q === '1' || stickyDebug) {
          document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/eruda@3.4.3/eruda.min.js" integrity="sha384-F7xQBvh3l6dG/mMD6QPIeVmXtzWT4Ce3ZDu8ysPuzMWMx9bFOIMGnRPUhLuQipss" crossorigin="anonymous"><\/scr' + 'ipt>');
          document.write('<scr' + 'ipt>window.eruda && eruda.init();<\/scr' + 'ipt>');
        }
      } catch (e) { /* storage blocked — no debug console */ }
    })();
    window.addEventListener('error', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      var stack = e.error && e.error.stack ? '\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n') : '';
      var masked = e.message === 'Script error.' && !e.filename ? ' (cross-origin masked — reload with ?debug=1 for the full console)' : '';
      b.textContent = 'error: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '') + masked + stack;
    });
    window.addEventListener('unhandledrejection', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      var r = e.reason;
      b.textContent = 'rejection: ' + (r && (r.message || String(r))) + (r && r.stack ? '\n' + String(r.stack).split('\n').slice(0, 4).join('\n') : '');
    });
    document.getElementById('err-banner').addEventListener('click', function () { this.style.display = 'none'; });
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
