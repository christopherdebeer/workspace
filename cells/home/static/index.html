<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>parc.land</title>
  <style>html,body{margin:0;background:#f3edde}</style>
</head>
<body>
  <div id="root"></div>
  <div id="err-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7a1f1f;color:#fff;font:12px/1.4 monospace;padding:6px 10px;z-index:9999;white-space:pre-wrap;"></div>
  <script>
    window.addEventListener('error', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      b.textContent = 'error: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      b.textContent = 'rejection: ' + (e.reason && (e.reason.message || String(e.reason)));
    });
  </script>
  <script type="module" src="/@c15r/home/app.js"></script>
</body>
</html>
