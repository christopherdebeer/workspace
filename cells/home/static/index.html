<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>parc.land</title>
  <style>
    html,body{margin:0;background:#f3edde}
    /* Rendered fact markdown (.fact-md) appears inside PANELS — sheet-scale
       headings, not document-scale (a peeked doc's H1 was 2em inside a 340px
       scroll box). Code blocks scroll instead of stretching the panel.

       ONE ruleset, two palettes. Every colour is a custom property so the same
       rules serve both the DARK surfaces (graph palette, bottom-sheet peek —
       the default) and the LIGHT trailhead (`.fact-md.on-paper`, the selected
       fact + landing doc on cream). Before this the dark gold/black values bled
       onto the parchment: gold links at ~2:1 contrast, jet-black code plates,
       and white table hairlines that simply vanished. Headings speak the park's
       serif on both. */
    .fact-md{
      --md-link:#f5c453;              /* gold on ink */
      --md-code-bg:rgba(0,0,0,.28);
      --md-icode-bg:rgba(0,0,0,.22);
      --md-rule:rgba(245,196,83,.45); /* blockquote bar + hr */
      --md-hr:rgba(245,196,83,.25);
      --md-border:rgba(255,255,255,.14);
      --md-th-bg:rgba(0,0,0,.18);
      --md-serif:'Iowan Old Style',Palatino,Georgia,'Times New Roman',serif;
    }
    .fact-md.on-paper{
      --md-link:#2e5e43;              /* pine on paper */
      --md-code-bg:rgba(51,46,35,.06);
      --md-icode-bg:rgba(51,46,35,.08);
      --md-rule:rgba(46,94,67,.4);
      --md-hr:rgba(51,46,35,.16);
      --md-border:rgba(51,46,35,.18);
      --md-th-bg:rgba(51,46,35,.05);
    }
    .fact-md h1,.fact-md h2,.fact-md h3,.fact-md h4,.fact-md h5,.fact-md h6{font-family:var(--md-serif);font-weight:600}
    .fact-md h1{font-size:1.2em;margin:.5em 0 .3em}
    .fact-md h2{font-size:1.1em;margin:.5em 0 .25em}
    .fact-md h3,.fact-md h4{font-size:1em;margin:.4em 0 .2em}
    .fact-md h1,.fact-md h2{line-height:1.25}
    .fact-md p{margin:.35em 0}
    .fact-md ul,.fact-md ol{margin:.35em 0;padding-left:1.3em}
    .fact-md li{margin:.15em 0}
    .fact-md pre{overflow-x:auto;background:var(--md-code-bg);padding:.5em .6em;border-radius:8px;font-size:.92em}
    .fact-md code{overflow-wrap:anywhere}
    .fact-md p code,.fact-md li code,.fact-md td code{background:var(--md-icode-bg);padding:.05em .3em;border-radius:4px;font-size:.92em}
    .fact-md a{color:var(--md-link)}
    .fact-md a:hover{text-decoration-style:solid}
    .fact-md blockquote{margin:.5em 0;padding:.1em .9em;border-left:3px solid var(--md-rule);opacity:.9}
    .fact-md hr{border:none;border-top:1px solid var(--md-hr);margin:1em 0}
    .fact-md table{border-collapse:collapse;font-size:.92em}
    .fact-md th,.fact-md td{border:1px solid var(--md-border);padding:.25em .55em;text-align:left}
    .fact-md th{background:var(--md-th-bg)}
    .fact-md img{border-radius:8px}

    /* — fences as DECLARATIONS (ADR-0059/0063, docs/home-hosts-lit.md) —
       The fence line is the block's vocabulary (viewer=, repl=, !directive,
       #tag, < in, > out), so it is drawn, not dropped. Same class names and
       shapes lit emits, tone-aware here because home reads on ink AND paper:
       one stylesheet vocabulary, two grounds. */
    .fact-md .fence,.fact-md .md-fence{margin:.6em 0}
    .fact-md .fence-chips{display:flex;flex-wrap:wrap;gap:.3rem;margin:0 0 .3em;font:600 .68em ui-monospace,SFMono-Regular,Menlo,monospace}
    .fact-md .fchip{
      border-left:3px solid var(--md-rule);
      background:var(--md-icode-bg);
      color:inherit;opacity:.85;
      padding:.1em .45em;border-radius:0 4px 4px 0;white-space:nowrap;
    }
    .fact-md .fchip.fc-lang{opacity:1;font-weight:700}
    .fact-md .fchip.fc-out{border-left-color:var(--md-link);opacity:1}
    .fact-md .fchip.fc-error{border-left-color:#b5523c}
    .fact-md .fchip.fc-link a{text-decoration:none;color:var(--md-link)}
    /* The fence-grain edit affordance: quiet until reached for, and a real
       touch target (the chip row is the only chrome a fence gets). */
    .fact-md .fchip.fc-edit{border-left-color:transparent;background:none;opacity:.45}
    .fact-md .fchip.fc-edit:hover,.fact-md .fchip.fc-edit:focus-visible{opacity:1;color:var(--md-link)}
    .fact-md .fence:hover .fchip.fc-edit{opacity:.8}
    .fact-md .fence-chips+pre{margin-top:0}
    /* An output cell is something a run PRODUCED — dashed plate, so it reads
       as accreted rather than authored. */
    .fact-md .fence-output>pre{border:1px dashed var(--md-border)}
    /* ```md renders AS markdown; a directive makes it a callout (dotlit's
       admonitions, verified against lit's styling_and_themes). */
    .fact-md .md-fence{border-left:2px solid var(--md-border);padding-left:.9em}
    .fact-md .md-fence[class*=dir-]{border:1px solid var(--md-border);border-left-width:4px;border-radius:8px;padding:.55em .9em}
    .fact-md .md-fence.dir-warn{border-left-color:#c78a1d}
    .fact-md .md-fence.dir-error{border-left-color:#b5523c}
    .fact-md .md-fence.dir-info{border-left-color:#3b6ea5}
    .fact-md .md-fence.dir-success,.fact-md .md-fence.dir-note{border-left-color:var(--md-link)}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="err-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7a1f1f;color:#fff;font:12px/1.4 monospace;padding:6px 10px;z-index:9999;white-space:pre-wrap;"></div>
  <script>
    // ?debug=1 injects the eruda mobile devtools BEFORE the app module loads
    // (module scripts are deferred, document.write here still beats them).
    // Sticky via localStorage so in-app navigations keep the console;
    // ?debug=0 turns it back off.
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('debug');
        if (q === '0') localStorage.removeItem('parc.debug');
        else if (q === '1') localStorage.setItem('parc.debug', '1');
        var stickyDebug = localStorage.getItem('parc.debug') === '1';
        // Preserve the explicit opt-in across full reloads too: the server can
        // then return the debug-only CSP needed by Eruda's console evaluator.
        if (q === null && stickyDebug) {
          var debugUrl = new URL(location.href);
          debugUrl.searchParams.set('debug', '1');
          location.replace(debugUrl.href);
          return;
        }
        if (q === '1' || stickyDebug) {
          document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/eruda@3.4.3/eruda.min.js" integrity="sha384-F7xQBvh3l6dG/mMD6QPIeVmXtzWT4Ce3ZDu8ysPuzMWMx9bFOIMGnRPUhLuQipss" crossorigin="anonymous"><\/scr' + 'ipt>');
          document.write('<scr' + 'ipt>window.eruda && eruda.init();<\/scr' + 'ipt>');
        }
      } catch (e) { /* storage blocked — no debug console */ }
    })();
    window.addEventListener('error', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      var stack = e.error && e.error.stack ? '\n' + String(e.error.stack).split('\n').slice(0, 4).join('\n') : '';
      var masked = e.message === 'Script error.' && !e.filename ? ' (cross-origin masked — reload with ?debug=1 for the full console)' : '';
      b.textContent = 'error: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '') + masked + stack;
    });
    window.addEventListener('unhandledrejection', function (e) {
      var b = document.getElementById('err-banner'); b.style.display = 'block';
      var r = e.reason;
      b.textContent = 'rejection: ' + (r && (r.message || String(r))) + (r && r.stack ? '\n' + String(r.stack).split('\n').slice(0, 4).join('\n') : '');
    });
    document.getElementById('err-banner').addEventListener('click', function () { this.style.display = 'none'; });
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
