<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>jev · lab</title>
  <meta name="description" content="An open library of unusual experiments with Jev, a System One decision model." />
  <style>
    :root {
      --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d1b16; --muted: #6f6858; --line: #e2dccd;
      --accent: #2f5d50; --accent-ink: #fff; --fill: #2f5d50; --track: #e8e2d3; --err: #9b2c2c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14130f; --surface: #1d1c17; --ink: #ece7da; --muted: #a39b88; --line: #2f2d26;
        --accent: #8cc7b1; --accent-ink: #10201b; --fill: #8cc7b1; --track: #2c2a23; --err: #f29a9a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
    a { color: inherit; }
    .boot { max-width: 760px; margin: 0 auto; padding: 2rem 16px; color: var(--muted); }
    .shell { max-width: 820px; margin: 0 auto; padding: 0 16px 9rem; }
    .top { display: flex; gap: .75rem; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
    .top a { font-weight: 700; text-decoration: none; letter-spacing: .02em; }
    .crumb { color: var(--muted); font-size: .9rem; }
    .hero h1 { font-size: 2rem; margin: .5rem 0; letter-spacing: -.01em; }
    .hero p { color: var(--muted); margin: 0 0 1.25rem; }
    .lib { display: grid; gap: .75rem; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .lib { grid-template-columns: 1fr 1fr; } }
    .card { display: block; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-decoration: none; }
    .card.live:hover { border-color: var(--accent); }
    .card.idea { opacity: .72; border-style: dashed; }
    .card h3 { margin: .15rem 0 .35rem; font-size: 1.1rem; }
    .card p { margin: 0 0 .6rem; color: var(--muted); font-size: .92rem; }
    .card-n { font: 600 .75rem var(--mono); color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .tag { font: .72rem var(--mono); padding: .1rem .45rem; border-radius: 99px; background: var(--track); color: var(--muted); }
    .tag.live { background: var(--accent); color: var(--accent-ink); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: .9rem; }
    .panel-head { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
    .panel h2 { margin: 0; font-size: 1.15rem; }
    .sub { color: var(--muted); font-size: .88rem; margin: .25rem 0 .5rem; }
    .field { display: grid; gap: .3rem; margin: .5rem 0; }
    .field > span:first-child, .w-label { font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: .35rem; }
    input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .65rem; width: 100%; }
    input[type=range] { padding: 0; accent-color: var(--accent); }
    input[type=checkbox] { width: auto; accent-color: var(--accent); }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: .5rem .85rem; min-height: 40px; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    button.ghost { background: transparent; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    .chips { display: flex; gap: .35rem; flex-wrap: wrap; margin: .25rem 0 .6rem; }
    .chip { font-size: .8rem; min-height: 32px; padding: .25rem .6rem; border-radius: 99px; }
    .seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: .5rem 0 0; }
    .seg button { border: 0; border-radius: 0; flex: 1 1 auto; background: transparent; font-size: .88rem; }
    .seg button.on { background: var(--accent); color: var(--accent-ink); }
    .knobs { display: grid; gap: .5rem; grid-template-columns: 1fr; margin: .5rem 0; font-size: .85rem; color: var(--muted); }
    @media (min-width: 560px) { .knobs { grid-template-columns: 1fr 1fr; } }
    .knobs label { display: grid; gap: .2rem; }
    .error { color: var(--err); font-size: .9rem; }
    .decoded { font: 1.35rem/1.5 var(--mono); margin: .25rem 0 .75rem; word-break: break-word; min-height: 2rem; }
    .caret { animation: blink 1s steps(1) infinite; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
    .mono { font-family: var(--mono); }
    .small { font-size: .78rem; overflow-x: auto; }
    table.rounds { width: 100%; border-collapse: collapse; font-size: .82rem; margin-top: .4rem; }
    .rounds th, .rounds td { text-align: left; padding: .2rem .4rem; border-bottom: 1px solid var(--line); }
    .bar { display: grid; grid-template-columns: minmax(5.5rem, 30%) 1fr 3rem; gap: .5rem; align-items: center; font-size: .82rem; margin: .18rem 0; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-family: var(--mono); }
    .bar-track { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .bar-fill { display: block; height: 100%; background: var(--fill); border-radius: 99px; }
    .bar-val { text-align: right; font-family: var(--mono); color: var(--muted); }
    .probe-dist { display: grid; gap: .1rem; margin: .5rem 0; }
    .grid2 { display: grid; grid-template-columns: 1fr; gap: .25rem .75rem; }
    @media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .trace { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: .45rem 16px calc(.45rem + env(safe-area-inset-bottom)); }
    .trace-stats { max-width: 820px; margin: 0 auto; display: flex; gap: 1rem; align-items: center; overflow-x: auto; }
    .trace-stats .ghost { margin-left: auto; min-height: 30px; padding: .1rem .6rem; font-size: .8rem; }
    .stat { display: grid; line-height: 1.1; }
    .stat-v { font: 600 .92rem var(--mono); }
    .stat-l { font-size: .68rem; color: var(--muted); }
    .trace-spark { max-width: 820px; margin: .35rem auto 0; height: 28px; display: flex; align-items: flex-end; gap: 1px; }
    .spark { flex-basis: 0; background: var(--fill); min-width: 2px; border-radius: 1px; opacity: .8; }
    .spark.err { background: var(--err); }
    /* rendered interfaces */
    .rendered { border-width: 2px; }
    .mood-calm { --accent: #4d7c8a; }
    .mood-playful { --accent: #c2410c; }
    .mood-serious { --accent: #334155; }
    .mood-urgent { --accent: #b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .mood-calm { --accent: #8ec5d4; }
      :root:not([data-theme="light"]) .mood-playful { --accent: #fb923c; }
      :root:not([data-theme="light"]) .mood-serious { --accent: #cbd5e1; }
      :root:not([data-theme="light"]) .mood-urgent { --accent: #f87171; }
    }
    .rendered { border-color: var(--accent); }
    .ui-stack, .ui-card { display: grid; gap: .6rem; }
    .ui-card { max-width: 380px; }
    .ui-split { display: grid; gap: .6rem; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .ui-split { grid-template-columns: 1fr 1fr; } }
    .w-heading { margin: .4rem 0 0; font-size: 1.05rem; }
    .w-text { margin: 0; color: var(--muted); }
    .w-button { background: var(--accent); color: var(--accent-ink, #fff); border-color: var(--accent); font-weight: 600; display: inline-flex; gap: .4rem; align-items: center; justify-content: center; }
    .w-toggle { display: flex; gap: .5rem; align-items: center; }
    .w-check { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .75rem; display: grid; gap: .25rem; }
    .w-check label { display: flex; gap: .5rem; align-items: center; }
    .w-counter b, .w-timer b { font-size: 1.5rem; min-width: 3ch; text-align: center; }
    .w-timer { display: grid; gap: .25rem; }
    .w-list ul { margin: .25rem 0; padding-left: 1.2rem; }
    progress { width: 100%; height: 10px; accent-color: var(--accent); cursor: pointer; }
    .conf { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; }
    .summary { background: var(--bg); border-radius: 8px; padding: .6rem .75rem; font-size: .9rem; }
    .notebook ol { margin: .25rem 0 0; padding-left: 1.2rem; display: grid; gap: .4rem; font-size: .9rem; }
    details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <div id="app"><p class="boot">loading…</p></div>
  <script type="module" src="/@c15r/jev/app.js"></script>
</body>
</html>
