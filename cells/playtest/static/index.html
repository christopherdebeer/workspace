<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:," />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Playtest</title>
  <meta name="description" content="A workshop where board-game rules are played by a fast decision model, scored, and improved one change at a time." />
  <style>
    :root {
      --bg: #f6f4ee; --surface: #fffdf8; --surface-2: #f0ede4; --ink: #1c1b17; --muted: #625d50; --faint: #8b8575; --line: #e3ddcf;
      --accent: #2f5d50; --accent-ink: #fff; --track: #e7e1d3; --focus: #2a78d6;
      --series-1: #2a78d6; --series-2: #eb6834;
      --good: #1d7a3e; --warn: #9a6a00; --bad: #b3261e; --info: #4a5d7a;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #13120f; --surface: #1c1b17; --surface-2: #24221d; --ink: #ede8db; --muted: #aba38f; --faint: #837c6b; --line: #2f2c25;
        --accent: #8cc7b1; --accent-ink: #10201b; --track: #2c2a23; --focus: #3987e5;
        --series-1: #3987e5; --series-2: #d95926;
        --good: #5fbf7d; --warn: #e0a93a; --bad: #f08b84; --info: #9fb3d1;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #13120f; --surface: #1c1b17; --surface-2: #24221d; --ink: #ede8db; --muted: #aba38f; --faint: #837c6b; --line: #2f2c25;
      --accent: #8cc7b1; --accent-ink: #10201b; --track: #2c2a23; --focus: #3987e5;
      --series-1: #3987e5; --series-2: #d95926;
      --good: #5fbf7d; --warn: #e0a93a; --bad: #f08b84; --info: #9fb3d1;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
    a { color: inherit; text-underline-offset: 2px; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .boot { max-width: 760px; margin: 0 auto; padding: 2rem 16px; color: var(--muted); }
    .shell { max-width: 960px; margin: 0 auto; padding: 0 16px 5rem; }
    nav.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: .25rem .75rem; align-items: center; flex-wrap: wrap; padding: .7rem 0; border-bottom: 1px solid var(--line); margin-bottom: 1.1rem; }
    nav.top .brand { font-weight: 700; text-decoration: none; margin-right: auto; letter-spacing: .01em; }
    nav.top a.tab { text-decoration: none; color: var(--muted); font-size: .92rem; padding: .25rem 0; }
    @media (max-width: 420px) { nav.top { gap: .25rem .6rem; } nav.top a.tab { font-size: .85rem; } }
    nav.top a.tab.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
    h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.15; margin: .4rem 0 .6rem; letter-spacing: -.01em; }
    h2 { font-size: 1.2rem; margin: 0 0 .35rem; }
    h3 { font-size: 1rem; margin: 1rem 0 .35rem; }
    p { margin: .4rem 0 .7rem; }
    .lede { color: var(--muted); font-size: 1.05rem; max-width: 46rem; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .mono { font-family: var(--mono); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .panel-head { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; margin-bottom: .5rem; }
    .sub { color: var(--muted); font-size: .9rem; margin: .1rem 0 .4rem; }
    .grid { display: grid; gap: .8rem; grid-template-columns: 1fr; }
    @media (min-width: 720px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: 1fr 1fr 1fr; } }
    .stats { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; margin: .3rem 0 .6rem; }
    .stat { display: grid; line-height: 1.15; min-width: 4.5rem; }
    .stat-v { font: 600 1.35rem var(--mono); }
    .stat-l { font-size: .75rem; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .tag { display: inline-flex; align-items: center; gap: .25rem; font: .74rem var(--mono); padding: .1rem .5rem; border-radius: 99px; background: var(--track); color: var(--muted); white-space: nowrap; }
    .tag.good { color: var(--good); } .tag.warn { color: var(--warn); } .tag.bad { color: var(--bad); } .tag.info { color: var(--info); }
    .tag.solid { background: var(--accent); color: var(--accent-ink); }
    button, .btn { font: inherit; font-size: .92rem; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: .45rem .8rem; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; gap: .35rem; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
    button.ghost { background: transparent; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .5rem .6rem; width: 100%; }
    textarea { font: .85rem/1.45 var(--mono); min-height: 18rem; }
    label.field { display: grid; gap: .25rem; margin: .5rem 0; font-size: .85rem; color: var(--muted); }
    .error { color: var(--bad); font-size: .9rem; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .t th, .t td { text-align: left; padding: .35rem .45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .t th { color: var(--muted); font-weight: 600; font-size: .78rem; white-space: nowrap; }
    .t td.num, .t th.num { text-align: right; font-family: var(--mono); white-space: nowrap; }
    .t tr.link { cursor: pointer; } .t tr.link:hover td { background: var(--surface-2); }
    .bar { display: grid; grid-template-columns: minmax(6rem, 40%) 1fr auto; gap: .5rem; align-items: center; font-size: .82rem; margin: .15rem 0; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .bar-track { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; }
    .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    .bar-val { text-align: right; font-family: var(--mono); color: var(--muted); white-space: nowrap; min-width: 3rem; }
    .steps { counter-reset: s; list-style: none; padding: 0; margin: .5rem 0; display: grid; gap: .6rem; }
    .steps li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; }
    .steps li::before { content: counter(s); font: 600 .9rem var(--mono); width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--muted); }
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .8rem; font-size: .88rem; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; }
    details > summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    pre.code { font: .78rem/1.45 var(--mono); background: var(--surface-2); padding: .7rem; border-radius: 8px; overflow: auto; max-height: 32rem; white-space: pre; }
    .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: .1rem; }
    .timeline li { display: grid; grid-template-columns: 5.2rem 1fr; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--line); }
    .timeline li > div { min-width: 0; overflow-wrap: anywhere; }
    .timeline .tag, .t .tag { white-space: normal; }
    .timeline .when { font: .75rem var(--mono); color: var(--faint); padding-top: .15rem; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .35rem .5rem; font-size: .78rem; box-shadow: 0 2px 10px rgba(0,0,0,.12); white-space: nowrap; }
    .legend { display: flex; gap: 1rem; font-size: .8rem; color: var(--muted); margin: .2rem 0 .4rem; }
    .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .35rem; }
    .diagram svg { width: 100%; height: auto; display: block; }
    .diagram .narrow { display: none; max-width: 360px; margin: 0 auto; }
    @media (max-width: 560px) { .diagram .wide { display: none; } .diagram .narrow { display: block; } }
    .diagram text { font: 13px var(--sans); fill: var(--ink); }
    .diagram .muted-t { fill: var(--muted); font-size: 11.5px; }
    .diagram .box { fill: var(--surface-2); stroke: var(--line); }
    .diagram .box.hl { stroke: var(--accent); stroke-width: 1.5; }
    .diagram .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .job { font-size: .85rem; color: var(--muted); }
    .signin { font-size: .85rem; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <div id="app"><p class="boot">loading…</p></div>
  <script type="module" src="/@c15r/playtest/app.js"></script>
</body>
</html>
