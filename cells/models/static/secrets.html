<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>models · provider keys</title>
  <style>
    body { margin: 0; background: #fbfbf8; color: #1c1c1a; font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 1.2rem; }
    h1 { font-size: 1.25rem; }
    .sub { color: #8a8a82; font-size: 0.85rem; }
    .card { background: #fff; border: 1px solid #e4e4dc; border-radius: 12px; padding: 0.9rem 1rem; margin: 0.8rem 0; }
    .card h2 { margin: 0 0 0.2rem; font-size: 1rem; }
    .card .models { color: #8a8a82; font-size: 0.78rem; margin-bottom: 0.5rem; }
    .row { display: flex; gap: 0.5rem; }
    input { flex: 1; font: 0.85rem/1.4 ui-monospace, Menlo, monospace; border: 1px solid #e4e4dc; border-radius: 8px; padding: 0.5rem 0.6rem; }
    button { border: 1px solid #2f6f4f; background: #2f6f4f; color: #fff; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; }
    .status { font-size: 0.78rem; margin-top: 0.4rem; }
    .on { color: #2f6f4f; } .off { color: #8a8a82; } .err { color: #7a1f1f; }
  </style>
</head>
<body>
  <main>
    <h1>🔑 provider keys</h1>
    <p class="sub">Keys are stored in this cell's own table — collocated with the client code that spends them. Write-only: no readback path exists. Paste a key to enable a provider; paste again to rotate.</p>
    <div id="cards"><p class="sub">signing in…</p></div>
  </main>
  <script type="module">
    import { ensureAuth, authFetch } from 'https://parc.land/@c15r/kernel/app.js';

    const PROVIDERS = [
      { id: 'anthropic', label: 'Anthropic', models: 'text/vlm — claude-opus-4-8 (no image gen)' },
      { id: 'openai', label: 'OpenAI', models: 'text — gpt-5.1 · image — gpt-image-1' },
      { id: 'google', label: 'Google', models: 'text — gemini-2.5-flash · image — gemini-2.5-flash-image' },
    ];
    const base = '/@c15r/models';

    async function tool(name, args) {
      const res = await authFetch(`${base}/_tools/${name}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(args ?? {}),
      });
      const j = await res.json();
      if (!res.ok || j.error) throw new Error(j.error ?? `HTTP ${res.status}`);
      return j;
    }

    async function render() {
      const cards = document.getElementById('cards');
      let status = {};
      try {
        status = (await tool('listProviders', {})).providers ?? {};
      } catch (err) {
        cards.innerHTML = `<p class="status err">${err.message}</p>`;
        return;
      }
      cards.innerHTML = '';
      for (const p of PROVIDERS) {
        const st = status[p.id] ?? { enabled: false };
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h2>${p.label}</h2>
          <div class="models">${p.models}</div>
          <div class="row">
            <input type="password" placeholder="${st.enabled ? 'enabled — paste to rotate' : 'paste API key to enable'}" autocomplete="off" />
            <button>save</button>
          </div>
          <div class="status ${st.enabled ? 'on' : 'off'}">${st.enabled ? '● enabled' : '○ not enabled'}</div>`;
        const input = card.querySelector('input');
        const btn = card.querySelector('button');
        const statusEl = card.querySelector('.status');
        btn.onclick = async () => {
          if (!input.value.trim()) return;
          btn.textContent = '…';
          try {
            await tool('setProvider', { provider: p.id, apiKey: input.value.trim() });
            input.value = '';
            statusEl.textContent = '● enabled (key stored)';
            statusEl.className = 'status on';
          } catch (err) {
            statusEl.textContent = '✗ ' + err.message;
            statusEl.className = 'status err';
          }
          btn.textContent = 'save';
        };
        cards.appendChild(card);
      }
    }

    await ensureAuth();
    await render();
  </script>
</body>
</html>
