<title>Murmur Field</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060e;
    overflow: hidden;
  }
  #field {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
    background: #05060e;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
<canvas id="field" aria-label="Murmur Field — a touchable procedural artwork. Tap, drag, pinch, and hold to evolve it."></canvas>
<script>
'use strict';
/* ============================================================
   MURMUR FIELD
   A procedural flow-field organism. Its equations are a genome;
   every gesture mutates the genome, so interaction rewrites the
   procedure itself rather than merely disturbing the picture.

     tap        — pluck a bell, jitter one gene, burst of light
     drag       — carve an orbiting current; on release the stroke
                  vector transposes hue, pitch and field scale
     pinch/twist— reshape field scale and rotational symmetry
     long press — a new generation: form-weights crossfade to a
                  new regime under a bass swell
     stillness  — the field drifts and evolves slowly on its own
   ============================================================ */

const canvas = document.getElementById('field');
const g2 = canvas.getContext('2d', { alpha: false });

const BG = { r: 5, g: 6, b: 14 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

let W = 0, H = 0, DPR = 1, minDim = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  minDim = Math.min(W, H);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.fillStyle = `rgb(${BG.r},${BG.g},${BG.b})`;
  g2.fillRect(0, 0, W, H);
  seedParticles();
}

/* ---------------- genome ----------------
   The genome IS the artwork's procedure. Everything the eye and
   ear receive is derived from it. `cur` is what renders; `tgt`
   is where mutation writes; cur eases toward tgt continuously. */

const rand = (a, b) => a + Math.random() * (b - a);

function randomGenome() {
  const w = [Math.random(), Math.random(), Math.random()];
  const s = w[0] + w[1] + w[2];
  return {
    f1: rand(0.9, 2.6), f2: rand(0.9, 2.6), f3: rand(1.2, 3.2),
    w1: rand(0.10, 0.45), w2: rand(0.10, 0.45), w3: rand(0.08, 0.35),
    p1: rand(0, TAU), p2: rand(0, TAU), p3: rand(0, TAU),
    sym: Math.floor(rand(2, 7.99)),
    symAmp: rand(0.6, 1.8),
    curl: rand(-0.9, 0.9),
    swirl: rand(-0.35, 0.35),
    form0: w[0] / s, form1: w[1] / s, form2: w[2] / s,
    hue: rand(0, 360),
    hueSpread: rand(35, 110),
    scale: rand(0.6, 1.25),
    speed: rand(0.75, 1.3),
    root: Math.floor(rand(0, 12)),
  };
}

let cur = randomGenome();
let tgt = JSON.parse(JSON.stringify(cur));
let generation = 1;

const HUE_KEYS = new Set(['hue']);
function easeGenome(dt) {
  const k = 1 - Math.exp(-dt * 0.9);
  for (const key in cur) {
    if (HUE_KEYS.has(key)) {
      let d = ((tgt[key] - cur[key] + 540) % 360) - 180;
      cur[key] = (cur[key] + d * k + 360) % 360;
    } else {
      cur[key] += (tgt[key] - cur[key]) * k;
    }
  }
}

function jitterGene(strength) {
  const ops = [
    () => { tgt.f1 = clamp(tgt.f1 + rand(-0.5, 0.5) * strength, 0.6, 3.2); },
    () => { tgt.f2 = clamp(tgt.f2 + rand(-0.5, 0.5) * strength, 0.6, 3.2); },
    () => { tgt.f3 = clamp(tgt.f3 + rand(-0.6, 0.6) * strength, 0.8, 4.0); },
    () => { tgt.curl = clamp(tgt.curl + rand(-0.5, 0.5) * strength, -1.2, 1.2); },
    () => { tgt.swirl = clamp(tgt.swirl + rand(-0.2, 0.2) * strength, -0.5, 0.5); },
    () => { tgt.symAmp = clamp(tgt.symAmp + rand(-0.5, 0.5) * strength, 0.3, 2.2); },
    () => { tgt.p1 = tgt.p1 + rand(-1.2, 1.2) * strength; },
    () => { tgt.hueSpread = clamp(tgt.hueSpread + rand(-25, 25) * strength, 25, 140); },
  ];
  ops[Math.floor(Math.random() * ops.length)]();
}

function newGeneration() {
  generation++;
  const fresh = randomGenome();
  // Keep a thread of ancestry: hue walks rather than teleports.
  fresh.hue = (cur.hue + rand(40, 140) * (Math.random() < 0.5 ? -1 : 1) + 360) % 360;
  fresh.root = (cur.root + [3, 5, 7, -5][Math.floor(Math.random() * 4)] + 12) % 12;
  tgt = fresh;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- flow field ----------------
   Three basis forms blended by genome weights:
   F0 lattice of travelling sines, F1 radial/kaleidoscopic,
   F2 nested-sine pseudo-noise. The blend is what a long press
   re-rolls — the same particles under a different law. */

let fieldT = rand(0, 100);

function fieldAngle(x, y) {
  const s = (minDim * 0.5) * cur.scale;
  const cx = W * 0.5, cy = H * 0.5;
  const dx = (x - cx) / s, dy = (y - cy) / s;
  const r = Math.hypot(dx, dy);
  const th = Math.atan2(dy, dx);
  const t = fieldT;

  const F0 = Math.sin(dx * cur.f1 + t * cur.w1 + cur.p1)
           + Math.cos(dy * cur.f2 - t * cur.w2 + cur.p2);

  const F1 = Math.sin(r * cur.f3 * 2.0 - t * cur.w3 + Math.sin(th * cur.sym + cur.p3) * cur.symAmp)
           + th * cur.swirl * 2.0;

  const F2 = Math.sin(dx * cur.f2 + Math.sin(dy * cur.f1 + t * cur.w1))
           * Math.cos(dy * cur.f3 - Math.cos(dx * cur.f1 - t * cur.w2));

  const a = cur.form0 * F0 + cur.form1 * F1 + cur.form2 * F2;
  return a * Math.PI + cur.curl * Math.sin(th * cur.sym - t * 0.13);
}

/* ---------------- particles ---------------- */

let particles = [];

function particleCount() {
  const n = Math.round((W * H) / 900);
  return clamp(n, 500, 2400);
}

function respawn(p) {
  p.x = Math.random() * W;
  p.y = Math.random() * H;
  p.px = p.x;
  p.py = p.y;
  p.life = rand(60, 260);
  p.sp = rand(0.55, 1.5);
  p.hueOff = rand(-1, 1);
  p.lw = Math.random() < 0.08 ? rand(1.6, 2.4) : rand(0.7, 1.3);
}

function seedParticles() {
  const n = particleCount();
  particles = new Array(n);
  for (let i = 0; i < n; i++) {
    particles[i] = {};
    respawn(particles[i]);
    particles[i].life = rand(0, 260);
  }
}

/* touch-born currents: orbiting attractors that decay */
let currents = [];
/* expanding rings of light where the field was touched */
let rings = [];

function addRing(x, y, hueShift, big) {
  rings.push({ x, y, r: big ? 8 : 3, v: big ? 4.2 : 2.6, a: big ? 0.5 : 0.32, hueShift });
}

function burst(x, y) {
  const n = Math.min(70, particles.length >> 3);
  for (let i = 0; i < n; i++) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    const a = Math.random() * TAU;
    const d = rand(1, 26);
    p.x = x + Math.cos(a) * d;
    p.y = y + Math.sin(a) * d;
    p.px = x; p.py = y;
    p.life = rand(80, 220);
  }
}

/* ---------------- audio ----------------
   Built lazily on first gesture (autoplay policy). A genome-tuned
   drone breathes underneath; touches are FM bells on a minor
   pentatonic rooted by the genome; everything feeds a lowpassed
   feedback delay for space. */

const PENT = [0, 3, 5, 7, 10];
let ac = null, master = null, sendIn = null, drone = null, droneFilter = null;

function rootHz(root) { return 110 * Math.pow(2, (root === undefined ? cur.root : root) / 12); }

function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return; }
  if (ac.state === 'suspended') ac.resume();

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 18;
  comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.3;
  comp.connect(ac.destination);

  master = ac.createGain();
  master.gain.value = 0.55;
  master.connect(comp);

  // feedback-delay space
  sendIn = ac.createGain(); sendIn.gain.value = 1;
  const delay = ac.createDelay(2.0); delay.delayTime.value = 0.31;
  const fb = ac.createGain(); fb.gain.value = 0.42;
  const damp = ac.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1900;
  const wet = ac.createGain(); wet.gain.value = 0.35;
  sendIn.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(master);

  // drone
  droneFilter = ac.createBiquadFilter();
  droneFilter.type = 'lowpass'; droneFilter.frequency.value = 650; droneFilter.Q.value = 0.8;
  const droneGain = ac.createGain();
  droneGain.gain.setValueAtTime(0.0001, ac.currentTime);
  droneGain.gain.exponentialRampToValueAtTime(0.14, ac.currentTime + 5);
  droneFilter.connect(droneGain); droneGain.connect(master); droneGain.connect(sendIn);

  const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
  const lfoAmt = ac.createGain(); lfoAmt.gain.value = 240;
  lfo.connect(lfoAmt); lfoAmt.connect(droneFilter.frequency); lfo.start();

  drone = [
    { ratio: 1.0, gain: 0.5 },
    { ratio: 1.5, gain: 0.3 },
    { ratio: 2.003, gain: 0.2 },
  ].map(v => {
    const o = ac.createOscillator();
    o.type = 'triangle';
    o.frequency.value = rootHz() * v.ratio;
    const g = ac.createGain(); g.gain.value = v.gain;
    o.connect(g); g.connect(droneFilter);
    o.start();
    return { osc: o, ratio: v.ratio };
  });
}

function retuneDrone() {
  if (!drone) return;
  const t = ac.currentTime;
  const base = rootHz(tgt.root);
  for (const d of drone) d.osc.frequency.setTargetAtTime(base * d.ratio, t, 1.6);
}

function noteFreq(y) {
  const idx = clamp(Math.floor((1 - y / H) * 10), 0, 9);
  const semis = PENT[idx % 5] + 12 * Math.floor(idx / 5) + 12;
  return rootHz() * Math.pow(2, semis / 12);
}

function pluck(freq, brightness, vel, dur) {
  if (!ac) return;
  const t = ac.currentTime;
  dur = dur || 2.4;
  const car = ac.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
  const mod = ac.createOscillator();
  mod.frequency.value = freq * (Math.random() < 0.5 ? 2 : 3.501);
  const mg = ac.createGain();
  mg.gain.setValueAtTime(freq * (0.4 + 2.2 * brightness), t);
  mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + dur * 0.7);
  mod.connect(mg); mg.connect(car.frequency);
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(Math.max(0.001, vel), t + 0.012);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  car.connect(env); env.connect(master); env.connect(sendIn);
  car.start(t); mod.start(t);
  car.stop(t + dur + 0.1); mod.stop(t + dur + 0.1);
}

function bassSwell() {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(rootHz() * 0.5, t);
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.35, t + 0.6);
  env.gain.exponentialRampToValueAtTime(0.0001, t + 4.5);
  o.connect(env); env.connect(master); env.connect(sendIn);
  o.start(t); o.stop(t + 4.7);
  // a slow arpeggio announcing the new law
  [0, 7, 12, 15].forEach((s, i) => {
    setTimeout(() => pluck(rootHz() * Math.pow(2, (s + 12) / 12), 0.35, 0.16, 3.2), 200 + i * 260);
  });
}

/* ---------------- gestures ----------------
   Raw pointer events only; the surface itself is the instrument. */

const pointers = new Map();
let lastInteraction = performance.now();
let pinchStart = null;

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  lastInteraction = performance.now();
  const p = {
    id: e.pointerId,
    x: e.clientX, y: e.clientY,
    sx: e.clientX, sy: e.clientY,
    t0: performance.now(),
    path: 0,
    lastPluck: 0,
    longFired: false,
    isPinch: false,
    current: { x: e.clientX, y: e.clientY, str: 1, rad: minDim * 0.22 },
  };
  pointers.set(e.pointerId, p);
  currents.push(p.current);
  addRing(e.clientX, e.clientY, 0, false);

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    a.isPinch = b.isPinch = true;
    pinchStart = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      ang: Math.atan2(b.y - a.y, b.x - a.x),
      scale: tgt.scale,
      sym: tgt.sym,
      swirl: tgt.swirl,
    };
  }
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  lastInteraction = performance.now();
  p.path += Math.hypot(e.clientX - p.x, e.clientY - p.y);
  p.x = e.clientX; p.y = e.clientY;
  p.current.x = p.x; p.current.y = p.y;

  if (pinchStart && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    tgt.scale = clamp(pinchStart.scale * (dist / Math.max(1, pinchStart.dist)), 0.35, 2.2);
    let dAng = ang - pinchStart.ang;
    tgt.swirl = clamp(pinchStart.swirl + dAng * 0.35, -0.6, 0.6);
    tgt.sym = clamp(Math.round(pinchStart.sym + dAng * 2.5), 2, 8);
  } else if (!p.isPinch && p.path > 24) {
    // drag: sparse grains along the stroke
    const now = performance.now();
    if (ac && now - p.lastPluck > 110) {
      p.lastPluck = now;
      pluck(noteFreq(p.y), p.x / W, 0.05 + Math.random() * 0.04, 1.1);
    }
  }
}, { passive: false });

function releasePointer(e, cancelled) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  p.current.str = 0.999; // <1 starts the decay; pruned in step() once spent
  if (pointers.size < 2) pinchStart = null;
  if (cancelled || p.isPinch) return;

  const dt = performance.now() - p.t0;
  const dx = p.x - p.sx, dy = p.y - p.sy;

  if (p.longFired) return;

  if (dt < 260 && p.path < 12) {
    // tap — one gene jitters, one bell rings
    jitterGene(0.7);
    burst(p.x, p.y);
    addRing(p.x, p.y, 30, false);
    pluck(noteFreq(p.y), p.x / W, 0.22);
  } else if (p.path > 30) {
    // drag release — the stroke vector is the mutation
    const mag = clamp(p.path / minDim, 0, 1.6);
    tgt.hue = (tgt.hue + (dx / W) * 160 + 360) % 360;
    tgt.scale = clamp(tgt.scale * (1 - (dy / H) * 0.55), 0.35, 2.2);
    tgt.root = (tgt.root + (dx > 0 ? Math.round(mag * 3) : -Math.round(mag * 3)) + 24) % 12;
    tgt.curl = clamp(tgt.curl + (dy / H) * 0.8, -1.2, 1.2);
    jitterGene(0.4 + mag * 0.4);
    retuneDrone();
    addRing(p.x, p.y, 15, false);
  }
}

canvas.addEventListener('pointerup', (e) => { e.preventDefault(); releasePointer(e, false); }, { passive: false });
canvas.addEventListener('pointercancel', (e) => releasePointer(e, true));
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function checkLongPress(now) {
  for (const p of pointers.values()) {
    if (!p.longFired && !p.isPinch && p.path < 14 && now - p.t0 > 620) {
      p.longFired = true;
      newGeneration();
      retuneDrone();
      bassSwell();
      addRing(p.x, p.y, 60, true);
      addRing(p.x, p.y, -60, true);
      burst(p.x, p.y);
    }
  }
}

/* ---------------- simulation + render ---------------- */

let last = performance.now();
let raf = 0;

function step(now) {
  const dt = clamp((now - last) / 16.667, 0.2, 2.5);
  last = now;
  const motion = reduceMotion ? 0.35 : 1;
  fieldT += dt * 0.016 * motion;

  easeGenome(dt * 0.016);
  checkLongPress(now);

  // unattended, the field evolves by itself
  if (now - lastInteraction > 18000) {
    lastInteraction = now - 10000; // next auto-step in ~8s
    jitterGene(0.5);
    if (Math.random() < 0.12) { tgt.hue = (tgt.hue + rand(20, 70)) % 360; }
  }

  // decay released currents
  for (const c of currents) if (c.str < 1) c.str -= dt * 0.02;
  currents = currents.filter(c => c.str > 0 || pointers.size > 0 && [...pointers.values()].some(p => p.current === c));

  // fade pass (the trail)
  g2.globalCompositeOperation = 'source-over';
  g2.fillStyle = `rgba(${BG.r},${BG.g},${BG.b},0.065)`;
  g2.fillRect(0, 0, W, H);

  g2.globalCompositeOperation = 'lighter';
  g2.lineCap = 'round';

  const baseSp = cur.speed * 1.35 * dt * motion;
  const hue0 = cur.hue, spread = cur.hueSpread;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const a = fieldAngle(p.x, p.y);
    let vx = Math.cos(a), vy = Math.sin(a);

    // touch currents: orbit + gentle pull
    for (let j = 0; j < currents.length; j++) {
      const c = currents[j];
      const ddx = c.x - p.x, ddy = c.y - p.y;
      const d2 = ddx * ddx + ddy * ddy;
      const rr = c.rad * c.rad;
      if (d2 < rr * 4) {
        const d = Math.sqrt(d2) + 0.001;
        const w = Math.exp(-d2 / rr) * Math.min(1, c.str) * 2.2;
        vx += ((ddx * 0.35 - ddy) / d) * w;
        vy += ((ddy * 0.35 + ddx) / d) * w;
      }
    }

    const sp = baseSp * p.sp;
    p.px = p.x; p.py = p.y;
    p.x += vx * sp;
    p.y += vy * sp;
    p.life -= dt;

    if (p.x < -12 || p.x > W + 12 || p.y < -12 || p.y > H + 12 || p.life <= 0) {
      respawn(p);
      continue;
    }

    const hue = (hue0 + p.hueOff * spread + 360) % 360;
    g2.strokeStyle = `hsla(${hue},82%,62%,0.30)`;
    g2.lineWidth = p.lw;
    g2.beginPath();
    g2.moveTo(p.px, p.py);
    g2.lineTo(p.x, p.y);
    g2.stroke();
  }

  // rings of touch
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.v * dt;
    r.a *= Math.pow(0.94, dt);
    if (r.a < 0.01) { rings.splice(i, 1); continue; }
    const hue = (hue0 + r.hueShift + 360) % 360;
    g2.strokeStyle = `hsla(${hue},90%,70%,${r.a})`;
    g2.lineWidth = 1.5;
    g2.beginPath();
    g2.arc(r.x, r.y, r.r, 0, TAU);
    g2.stroke();
  }

  // live touch glow
  for (const p of pointers.values()) {
    const hue = (hue0 + 20) % 360;
    const grad = g2.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46);
    grad.addColorStop(0, `hsla(${hue},90%,70%,0.14)`);
    grad.addColorStop(1, 'hsla(0,0%,0%,0)');
    g2.fillStyle = grad;
    g2.beginPath();
    g2.arc(p.x, p.y, 46, 0, TAU);
    g2.fill();
  }

  raf = requestAnimationFrame(step);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    if (ac && ac.state === 'running') ac.suspend();
  } else {
    last = performance.now();
    raf = requestAnimationFrame(step);
    if (ac && ac.state === 'suspended') ac.resume();
  }
});

window.addEventListener('resize', resize);
resize();
raf = requestAnimationFrame(step);
</script>
