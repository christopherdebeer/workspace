<title>Strung</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05060b;
    overflow: hidden;
  }
  #web {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
    background: #05060b;
    touch-action: none;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
<canvas id="web" aria-label="Strung — an elastic choir. Songs travel the filaments as visible waves. Drop beads on the web, stretch the membranes, tilt gravity. Seeded: the URL hash replays this exact performance."></canvas>
<script>
'use strict';
/* ============================================================
   STRUNG — second movement
   An elastic choir, played, bred, and now composed.

   BODIES ARE SPRINGS. Membranes of hub + Verlet ring, breathing
   with their real note envelopes. Stretch one and the strain bends
   a tone; let go and it snaps back singing.

   SOUND IS MATERIAL. Sagging filaments carry songs as visible
   transverse waves; hearing is arrival. Beads dropped on the web
   pluck each filament at a pitch set by its true length.

   HARMONY. The choir sings natural minor over a progression that
   advances every bar on the shared pulse; notes on the downbeat
   snap to the chord, bass voices land its root, and the filaments
   themselves are tuned to chord tones — the web voice-leads. An
   intensity arc swells and rests the music over minutes; every
   sixteen bars the key modulates under a golden cascade, and a
   Shepard–Risset bank breathes beneath it all, endlessly rising,
   surging in the last bar before every key change.

   GLITCH. On a seeded schedule the piece tears: the master routes
   through a 5-bit crush behind a sixteenth-note gate, dust-clicks
   land on the grid, songs come out as raw sawtooth, and the frame
   itself rips sideways in strips. Death is the biggest glitch.

   SEEDED. All simulation randomness flows from one seed, read
   from (and written to) the URL hash — same seed, same viewport,
   untouched: the same performance, note for note. Touch is
   intervention; it branches the timeline.
   ============================================================ */

const canvas = document.getElementById('web');
const g2 = canvas.getContext('2d', { alpha: false });

const BG = { r: 5, g: 6, b: 11 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- seed: the score of this performance ---------------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hashMatch = (location.hash || '').match(/s=([0-9a-z]+)/i);
const SEED = hashMatch ? (parseInt(hashMatch[1], 36) >>> 0) : ((Date.now() % 2176782336) >>> 0);
if (!hashMatch) { try { history.replaceState(null, '', '#s=' + SEED.toString(36)); } catch (e) {} }

const simR = mulberry32(SEED);                    // drives the simulation — the score
const auxR = mulberry32((SEED ^ 0x9E3779B9) >>> 0); // cosmetic + audio grain — never forks the sim

const srand = (a, b) => a + simR() * (b - a);
const spick = (arr) => arr[(simR() * arr.length) | 0];
const vrand = (a, b) => a + auxR() * (b - a);
const vpick = (arr) => arr[(auxR() * arr.length) | 0];

let W = 0, H = 0, DPR = 1, minDim = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  minDim = Math.min(W, H);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.fillStyle = `rgb(${BG.r},${BG.g},${BG.b})`;
  g2.fillRect(0, 0, W, H);
}

/* ---------------- harmony ---------------- */

const SCALE = [0, 2, 3, 5, 7, 8, 10];      // natural minor
const ROOT = 130.81;                        // C3
const PULSE = 60 / 72 / 2;                  // eighths at 72 bpm
const BAR = PULSE * 8;
const PROG = [0, 5, 2, 6];                  // i · VI · III · VII (scale-degree roots)
const MOVE_BARS = 16;                       // bars per movement (then the key turns)
const CENTERS = [0, 5, -2, 7];
let centerIdx = 0;
let lastBar = -1;

function barNow() { return Math.floor(simT / BAR); }
function chordRoot() { return PROG[barNow() % PROG.length]; }
function isChordTone(sd) {
  const r = chordRoot();
  const pc = ((sd % 7) + 7) % 7;
  return pc === r % 7 || pc === (r + 2) % 7 || pc === (r + 4) % 7;
}
function snapToChord(sd) {
  for (let off = 0; off <= 3; off++) {
    if (isChordTone(sd + off)) return sd + off;
    if (isChordTone(sd - off)) return sd - off;
  }
  return sd;
}

function scaleHz(sd, octaveOff) {
  const oct = Math.floor(sd / 7);
  const semi = SCALE[((sd % 7) + 7) % 7] + 12 * oct;
  return ROOT * Math.pow(2, (CENTERS[centerIdx] + semi) / 12 + (octaveOff || 0));
}

/* a sung degree: on the downbeat it obeys the chord; bass lands the root */
function noteHz(sd, register, tSing) {
  const inBar = (tSing % BAR) / PULSE;
  const strong = inBar < 1 || c_abs(inBar - 4) < 0.5;   // beats 1 and 3
  let d = sd;
  if (strong && register < 0) d = chordRoot();          // bass takes the root
  else if (strong) d = snapToChord(sd);
  return scaleHz(d, register);
}
const c_abs = Math.abs;

/* filaments are tuned strings: length → pitch, snapped to the chord */
function ropeHz(lenPx) {
  const raw = 160 + 70000 / Math.max(90, lenPx);
  let best = raw, err = Infinity;
  for (let d = 0; d <= 14; d++) {
    if (!isChordTone(d)) continue;
    const f = scaleHz(d, 0);
    if (Math.abs(f - raw) < err) { err = Math.abs(f - raw); best = f; }
  }
  return best;
}

function quantize(t, sync) {
  const q = Math.round(t / PULSE) * PULSE;
  return t + (q - t) * sync;
}

/* the long breath of the piece: swell and rest over ~3.5 minutes */
function intensity() {
  return 0.575 + 0.425 * Math.sin(TAU * simT / 210 - Math.PI / 2);
}

/* ---------------- audio ---------------- */

let ac = null, master = null, dry = null, sendIn = null, analyser = null, analyserBins = null, noiseBuf = null;
let bed = null, ghostBus = null, crush = null, crushGain = null, gateGain = null;
let ghosts = [];
let shepard = null;

function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return; }
  if (ac.state === 'suspended') ac.resume();

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -22; comp.knee.value = 20;
  comp.ratio.value = 7; comp.attack.value = 0.004; comp.release.value = 0.35;
  comp.connect(ac.destination);

  // master splits: dry path, and a bitcrushed gated path for the tears
  master = ac.createGain(); master.gain.value = 1;
  dry = ac.createGain(); dry.gain.value = 0.6;
  master.connect(dry); dry.connect(comp);

  crush = ac.createWaveShaper();
  const steps = 22, curve = new Float32Array(512);
  for (let i = 0; i < 512; i++) {
    const x = (i / 511) * 2 - 1;
    curve[i] = Math.round(x * steps) / steps;
  }
  crush.curve = curve;
  gateGain = ac.createGain(); gateGain.gain.value = 1;
  crushGain = ac.createGain(); crushGain.gain.value = 0.0001;
  master.connect(crush); crush.connect(gateGain); gateGain.connect(crushGain); crushGain.connect(comp);

  analyser = ac.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.85;
  master.connect(analyser);
  analyserBins = new Uint8Array(analyser.frequencyBinCount);

  sendIn = ac.createGain(); sendIn.gain.value = 1;
  const delay = ac.createDelay(2.5); delay.delayTime.value = 0.43;
  const fb = ac.createGain(); fb.gain.value = 0.45;
  const damp = ac.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 1700;
  const wet = ac.createGain(); wet.gain.value = 0.38;
  sendIn.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(master);

  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  const bedFilter = ac.createBiquadFilter();
  bedFilter.type = 'lowpass'; bedFilter.frequency.value = 380;
  const bedGain = ac.createGain();
  bedGain.gain.setValueAtTime(0.0001, ac.currentTime);
  bedGain.gain.exponentialRampToValueAtTime(0.04, ac.currentTime + 6);
  bedFilter.connect(bedGain); bedGain.connect(master); bedGain.connect(sendIn);
  bed = [
    { ratio: 0.5, gain: 0.6 },
    { ratio: 0.75, gain: 0.35 },
  ].map(v => {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.value = ROOT * Math.pow(2, CENTERS[centerIdx] / 12) * v.ratio;
    const g = ac.createGain(); g.gain.value = v.gain;
    o.connect(g); g.connect(bedFilter); o.start();
    return { osc: o, ratio: v.ratio };
  });

  const ghostFilter = ac.createBiquadFilter();
  ghostFilter.type = 'lowpass'; ghostFilter.frequency.value = 900;
  ghostBus = ac.createGain();
  ghostBus.gain.value = 1;
  ghostFilter.connect(ghostBus); ghostBus.connect(master); ghostBus.connect(sendIn);
  ghostBus._in = ghostFilter;

  // the Shepard–Risset stair: six octaves, endlessly rising
  const shepFilter = ac.createBiquadFilter();
  shepFilter.type = 'lowpass'; shepFilter.frequency.value = 1400;
  const shepBus = ac.createGain(); shepBus.gain.value = 1;
  shepFilter.connect(shepBus); shepBus.connect(master); shepBus.connect(sendIn);
  shepard = {
    pos: 0,
    voices: Array.from({ length: 6 }, () => {
      const o = ac.createOscillator(); o.type = 'sine';
      const g = ac.createGain(); g.gain.value = 0.0001;
      o.connect(g); g.connect(shepFilter);
      o.start();
      return { osc: o, gain: g };
    }),
  };
}

function updateShepard(dts) {
  if (!shepard || !ac) return;
  const bar = barNow() % MOVE_BARS;
  const riser = bar === MOVE_BARS - 1 ? 0.4 : 0;      // the last bar climbs hard
  shepard.pos = (shepard.pos + (0.035 + riser) * dts) % 6;
  const t = ac.currentTime;
  const level = 0.011 * (0.4 + intensity() * 0.6) * (riser ? 2.2 : 1);
  for (let i = 0; i < 6; i++) {
    const p = (i + shepard.pos) % 6;
    const f = 30 * Math.pow(2, p);
    const w = Math.exp(-Math.pow(p - 3, 2) / 2.0);
    shepard.voices[i].osc.frequency.setTargetAtTime(f, t, 0.06);
    shepard.voices[i].gain.gain.setTargetAtTime(level * w, t, 0.08);
  }
}

function addGhostTone(freq) {
  if (!ac || !ghostBus) return;
  const t = ac.currentTime;
  if (ghosts.length >= 8) {
    const old = ghosts.shift();
    old.gain.gain.setTargetAtTime(0.0001, t, 1.5);
    try { old.osc.stop(t + 8); } catch (e) { /* already scheduled */ }
  }
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.value = freq * 0.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.015, t + 4);
  g.gain.setTargetAtTime(0.0001, t + 30, 55);
  o.connect(g); g.connect(ghostBus._in);
  o.start(t); o.stop(t + 240);
  ghosts.push({ osc: o, gain: g, born: t });
}

function retuneBed() {
  if (!bed) return;
  const base = ROOT * Math.pow(2, CENTERS[centerIdx] / 12);
  for (const b of bed) b.osc.frequency.setTargetAtTime(base * b.ratio, ac.currentTime, 2.2);
}

/* one note at a raw frequency; inside a glitch window it comes out torn */
function playFreqRaw(v, freq, vel, brightMul, raw) {
  if (!ac) return;
  const t = ac.currentTime;
  const bright = clamp(v.bright * (brightMul || 1), 0.05, 1.5);
  const dur = raw ? Math.min(0.5, v.attack + v.decay * 0.3) : v.attack + v.decay;

  const car = ac.createOscillator();
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(Math.max(0.002, vel * (raw ? 0.8 : 1)), t + Math.max(0.005, v.attack));
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  if (raw) {
    // the crushed voice: sawtooth straight into the shaper
    car.type = 'sawtooth'; car.frequency.value = freq;
    const ws = ac.createWaveShaper(); ws.curve = crush.curve;
    car.connect(ws); ws.connect(env); env.connect(master); env.connect(sendIn);
    car.start(t); car.stop(t + dur + 0.1);
    return;
  }

  env.connect(master); env.connect(sendIn);
  if (v.type === 0 || v.type === 3) {
    car.type = 'sine'; car.frequency.value = freq;
    car.connect(env);
    const mod = ac.createOscillator();
    mod.frequency.value = freq * (v.type === 0 ? 3.501 : 2.0);
    const mg = ac.createGain();
    mg.gain.setValueAtTime(freq * (0.3 + 1.9 * bright), t);
    mg.gain.exponentialRampToValueAtTime(freq * 0.02, t + dur * 0.75);
    mod.connect(mg); mg.connect(car.frequency);
    mod.start(t); mod.stop(t + dur + 0.1);
  } else if (v.type === 1) {
    car.type = 'sine'; car.frequency.value = freq;
    car.connect(env);
    const vib = ac.createOscillator(); vib.frequency.value = vrand(4.5, 6.5);
    const va = ac.createGain(); va.gain.value = freq * 0.008;
    vib.connect(va); va.connect(car.frequency);
    vib.start(t); vib.stop(t + dur + 0.1);
  } else {
    car.type = 'triangle'; car.frequency.value = freq;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * (2 + 6 * bright), t);
    lp.frequency.exponentialRampToValueAtTime(freq * 1.2, t + dur * 0.6);
    car.connect(lp); lp.connect(env);
  }
  car.start(t); car.stop(t + dur + 0.1);
}

const STRING_VOICE = { type: 2, attack: 0.004, decay: 1.3, bright: 0.6 };
function stringPluck(lenPx, vel) {
  playFreqRaw(STRING_VOICE, ropeHz(lenPx), clamp(vel, 0.02, 0.16), 1, glitchActive);
}

function glissDown(freq, dur, vel) {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.4), t + dur);
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(vel, t + 0.05);
  env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(env); env.connect(master); env.connect(sendIn);
  o.start(t); o.stop(t + dur + 0.1);
}

function bassSwell() {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(ROOT * Math.pow(2, CENTERS[centerIdx] / 12) * 0.25, t);
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.2, t + 1.2);
  env.gain.exponentialRampToValueAtTime(0.0001, t + 6);
  o.connect(env); env.connect(master); env.connect(sendIn);
  o.start(t); o.stop(t + 6.2);
}

/* a dust click: a few milliseconds of raw noise on the grid */
function click(vel) {
  if (!ac || !noiseBuf) return;
  const t = ac.currentTime;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  src.playbackRate.value = vrand(0.8, 1.6);
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2800;
  const env = ac.createGain();
  env.gain.setValueAtTime(vel, t);
  env.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
  src.connect(hp); hp.connect(env); env.connect(comp_or_master());
  src.start(t); src.stop(t + 0.03);
}
function comp_or_master() { return master; }

/* the wound: a crushed burst when something dies */
function rawBurst(freq) {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(28, freq * 0.2), t + 0.35);
  const ws = ac.createWaveShaper(); ws.curve = crush.curve;
  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
  env.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  o.connect(ws); ws.connect(env); env.connect(master);
  o.start(t); o.stop(t + 0.45);
}

/* the strain of a stretched membrane, one voice per pointer */
function makeStrainVoice() {
  if (!ac) return null;
  const o = ac.createOscillator(); o.type = 'sine';
  const g = ac.createGain(); g.gain.value = 0.0001;
  o.connect(g); g.connect(master); g.connect(sendIn);
  o.start();
  return { osc: o, gain: g };
}

/* ---------------- glitch scheduler (seeded — part of the score) ---------------- */

let glitchActive = false;
let glitchUntil = 0;
let nextGlitch = 8;

function updateGlitch(dts) {
  if (!glitchActive && simT >= nextGlitch) {
    glitchActive = true;
    glitchUntil = simT + srand(0.25, 0.8);
    nextGlitch = simT + srand(7, 16);
    if (ac) {
      // gate the crushed bus on sixteenths for the window
      const t = ac.currentTime;
      dry.gain.setTargetAtTime(0.34, t, 0.02);
      crushGain.gain.setTargetAtTime(0.5, t, 0.02);
      const dur = glitchUntil - simT;
      const g16 = PULSE / 2;
      for (let k = 0; k * g16 < dur; k++) {
        gateGain.gain.setValueAtTime(k % 2 ? 0.05 : 1, t + k * g16);
      }
    }
  }
  if (glitchActive && simT >= glitchUntil) {
    glitchActive = false;
    if (ac) {
      const t = ac.currentTime;
      dry.gain.setTargetAtTime(0.6, t, 0.05);
      crushGain.gain.setTargetAtTime(0.0001, t, 0.05);
      gateGain.gain.cancelScheduledValues(t);
      gateGain.gain.setValueAtTime(1, t);
    }
  }
}

function glitchNow(dur) {
  nextGlitch = Math.min(nextGlitch, simT);      // trip the scheduler
  glitchUntil = simT + dur;
}

/* dust on the grid: seeded, denser inside the tears */
let last16 = -1;
function updateClicks() {
  const s16 = Math.floor(simT / (PULSE / 2));
  if (s16 !== last16) {
    last16 = s16;
    const p = glitchActive ? 0.55 : 0.05 * intensity();
    if (simR() < p) click(glitchActive ? 0.05 : 0.025);
  }
}

/* ---------------- genome ---------------- */

const SOCIAL = { ECHO: 0, SHY: 1, FERTILE: 2, SHIFT: 3, BURST: 4 };
const REGISTERS = [-1, 0, 0, 1];

function randomGenome(seedIdx) {
  const motifLen = spick([1, 1, 2, 2, 3]);
  const base = Math.floor(srand(2, 12));
  const motif = [base];
  for (let i = 1; i < motifLen; i++) motif.push(clamp(base + spick([-2, -1, 1, 2, 3]), 0, 14));
  const register = seedIdx !== undefined ? REGISTERS[seedIdx % 4] : spick(REGISTERS);
  return {
    voice: {
      type: seedIdx !== undefined ? seedIdx % 4 : Math.floor(srand(0, 4)),
      attack: srand(0.006, 0.15),
      decay: srand(0.7, 3.2) * (register < 0 ? 1.6 : register > 0 ? 0.7 : 1),
      bright: srand(0.15, 0.9),
    },
    register,
    motif,
    gap: srand(0.13, 0.4),
    period: spick([2.5, 3.5, 5, 7, 9]) * srand(0.85, 1.15) * (register < 0 ? 1.5 : 1),
    sync: srand(0.05, 0.4),
    listen: srand(0.2, 0.85),
    answerDelay: srand(0.15, 0.7),
    social: Math.floor(srand(0, 5)),
    hue: seedIdx !== undefined ? (seedIdx * 47) % 360 : srand(0, 360),
    nodes: Math.floor(srand(9, 14)),
    stiffness: srand(0.35, 0.8),
    r: srand(0.028, 0.05),
  };
}

function mutate(g) {
  const m = JSON.parse(JSON.stringify(g));
  m.voice.attack = clamp(m.voice.attack * srand(0.7, 1.4), 0.004, 0.25);
  m.voice.decay = clamp(m.voice.decay * srand(0.75, 1.3), 0.4, 4.5);
  m.voice.bright = clamp(m.voice.bright + srand(-0.18, 0.18), 0.05, 1.0);
  if (simR() < 0.12) m.voice.type = Math.floor(srand(0, 4));
  if (simR() < 0.1) m.register = spick(REGISTERS);
  m.motif = m.motif.map(d => clamp(d + spick([0, 0, 0, -1, 1]), 0, 14));
  if (simR() < 0.18 && m.motif.length < 4) m.motif.push(clamp(m.motif[0] + spick([-2, 2, 3]), 0, 14));
  else if (simR() < 0.1 && m.motif.length > 1) m.motif.pop();
  m.gap = clamp(m.gap * srand(0.8, 1.25), 0.09, 0.55);
  m.period = clamp(m.period * srand(0.8, 1.25), 1.6, 14);
  m.sync = clamp(m.sync + srand(-0.12, 0.15), 0, 0.95);
  m.listen = clamp(m.listen + srand(-0.15, 0.15), 0.05, 0.95);
  m.answerDelay = clamp(m.answerDelay * srand(0.8, 1.25), 0.1, 1.2);
  if (simR() < 0.15) m.social = Math.floor(srand(0, 5));
  m.hue = (m.hue + srand(-24, 24) + 360) % 360;
  m.nodes = clamp(m.nodes + spick([0, 0, 0, -1, 1]), 8, 15);
  m.stiffness = clamp(m.stiffness + srand(-0.1, 0.1), 0.25, 0.9);
  m.r = clamp(m.r * srand(0.85, 1.18), 0.02, 0.065);
  return m;
}

/* ---------------- gravity ---------------- */

let gravMag = 130;
let gravAngle = Math.PI / 2;
let tiltActive = false;

window.addEventListener('deviceorientation', (e) => {
  if (e.beta === null || e.gamma === null) return;
  const gx = Math.sin(e.gamma * Math.PI / 180);
  const gy = Math.sin(e.beta * Math.PI / 180);
  const m = Math.hypot(gx, gy);
  if (m > 0.08) { gravAngle = Math.atan2(gy, gx); tiltActive = true; }
});

function gravX() { return Math.cos(gravAngle) * gravMag; }
function gravY() { return Math.sin(gravAngle) * gravMag; }

/* ---------------- creatures ---------------- */

const POP_MAX = 11, POP_MIN = 4;
let creatures = [];
let nextId = 1;
let simT = 0;

function makeCreature(genome, x, y, parentId) {
  const n = genome.nodes;
  const R = genome.r * minDim * (genome.register < 0 ? 1.25 : genome.register > 0 ? 0.8 : 1);
  const ring = [];
  for (let k = 0; k < n; k++) {
    const a = (k / n) * TAU;
    ring.push({
      x: x + Math.cos(a) * R, y: y + Math.sin(a) * R,
      ox: x + Math.cos(a) * R, oy: y + Math.sin(a) * R,
    });
  }
  return {
    id: nextId++,
    g: genome,
    x, y, vx: 0, vy: 0,
    R,
    ring,
    energy: srand(0.8, 1.1),
    parentId: parentId || 0,
    nextSing: simT + srand(0.5, genome.period),
    pendingSing: 0,
    lastSing: -10,
    notes: [],
    envNow: 0,
    feedFlash: 0,
    dying: 0,
    wanderA: srand(0, TAU),
    phase: srand(0, TAU),
  };
}

function seedPopulation() {
  creatures = [];
  const n = 7;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + srand(-0.25, 0.25);
    const d = srand(0.16, 0.34) * minDim;
    creatures.push(makeCreature(randomGenome(i),
      W / 2 + Math.cos(a) * d, H / 2 + Math.sin(a) * d, 0));
  }
}

function envOf(c) {
  let e = 0;
  for (let i = c.notes.length - 1; i >= 0; i--) {
    const n = c.notes[i];
    const t = simT - n.t0;
    if (t < 0) continue;
    if (t > n.attack + n.decay) { c.notes.splice(i, 1); continue; }
    e += t < n.attack
      ? (t / n.attack) * n.amp
      : n.amp * Math.exp(-3 * (t - n.attack) / n.decay);
  }
  return Math.min(1.4, e);
}

/* ---------------- ropes ---------------- */

let ropes = [];
let packets = [];

function ropeLength(rp) {
  let L = 0;
  for (let i = 1; i < rp.nodes.length; i++) {
    L += Math.hypot(rp.nodes[i].x - rp.nodes[i - 1].x, rp.nodes[i].y - rp.nodes[i - 1].y);
  }
  return L;
}

function makeRope(a, b) {
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  const segs = clamp(Math.round(dist / 26), 8, 22);
  const nodes = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = a.x + (b.x - a.x) * t;
    const y = a.y + (b.y - a.y) * t + Math.sin(t * Math.PI) * dist * 0.05;
    nodes.push({ x, y, ox: x, oy: y });
  }
  return { a, b, nodes, segRest: (dist * 1.12) / segs, len: dist, hue: (a.g.hue + b.g.hue) / 2 };
}

function degreeOf(c) { return ropes.filter(r => r.a === c || r.b === c).length; }

let nextConnCheck = 0;
function checkConnections() {
  const CONNECT = minDim * 0.36, BREAK = minDim * 0.5;
  for (let i = ropes.length - 1; i >= 0; i--) {
    const rp = ropes[i];
    const d = Math.hypot(rp.a.x - rp.b.x, rp.a.y - rp.b.y);
    if (d > BREAK || rp.a.dying || rp.b.dying) {
      packets = packets.filter(p => p.rope !== rp);
      ropes.splice(i, 1);
    }
  }
  const alive = creatures.filter(c => !c.dying);
  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i], b = alive[j];
      if (degreeOf(a) >= 3 || degreeOf(b) >= 3) continue;
      if (ropes.some(r => (r.a === a && r.b === b) || (r.a === b && r.b === a))) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < CONNECT && d > (a.R + b.R) * 1.6) ropes.push(makeRope(a, b));
    }
  }
}

function attachIndex(c, tx, ty) {
  const a = Math.atan2(ty - c.y, tx - c.x);
  const n = c.ring.length;
  return ((Math.round(a / TAU * n) % n) + n) % n;
}

function launchPackets(c, amp, hops, golden) {
  for (const rp of ropes) {
    if (rp.a !== c && rp.b !== c) continue;
    const fromA = rp.a === c;
    packets.push({
      rope: rp,
      s: fromA ? 0 : 1,
      dir: fromA ? 1 : -1,
      speed: 300 / Math.max(80, rp.len),
      amp, hue: golden ? 45 : c.g.hue,
      hops, srcId: c.id, golden: !!golden,
    });
  }
}

/* ---------------- song ---------------- */

function sing(c, opts) {
  opts = opts || {};
  const v = c.g.voice;
  const motif = opts.motif || c.g.motif;
  const I = intensity();
  const vel = (opts.vel || 0.14) * clamp(0.4 + c.energy * 0.6, 0.3, 1)
            * (c.g.register < 0 ? 0.85 : 1)
            * (0.55 + I * 0.55);
  c.lastSing = simT;
  c.energy = Math.max(0, c.energy - 0.02);
  const tSing = simT;
  const raw = glitchActive;

  for (let i = 0; i < motif.length; i++) {
    const delay = i * c.g.gap;
    const freq = noteHz(motif[i], c.g.register, tSing + delay);
    setTimeout(() => {
      if (c.dying) return;
      playFreqRaw(v, freq, vel * (i === 0 ? 1 : 0.75), opts.bright || 1, raw);
    }, delay * 1000);
    c.notes.push({
      t0: simT + delay, attack: v.attack, decay: v.decay,
      amp: Math.min(1, vel * 6 * (i === 0 ? 1 : 0.75)),
    });
  }
  launchPackets(c, 7 + vel * 40, opts.hops || 0, opts.golden);
}

function modulate() {
  centerIdx = (centerIdx + 1) % CENTERS.length;
  retuneBed();
  bassSwell();
  const alive = creatures.filter(c => !c.dying);
  if (alive.length) {
    const root = spick(alive);
    sing(root, { vel: 0.16, golden: true, hops: 0 });
  }
  tideT = 0;
}
let tideT = -1;

/* ---------------- interactions ---------------- */

function interact(c, px, py) {
  c.energy = Math.min(2.0, c.energy + 0.35);
  c.g.sync = Math.min(0.95, c.g.sync + 0.05);
  const s = c.g.social;
  if (s === SOCIAL.ECHO) {
    sing(c, { vel: 0.2, bright: 1.6 });
  } else if (s === SOCIAL.SHY) {
    const d = Math.hypot(c.x - px, c.y - py) + 0.001;
    c.vx += ((c.x - px) / d) * 3.4;
    c.vy += ((c.y - py) / d) * 3.4;
    glissDown(scaleHz(c.g.motif[0], c.g.register), 0.7, 0.09);
    c.notes.push({ t0: simT, attack: 0.02, decay: 0.7, amp: 0.7 });
  } else if (s === SOCIAL.FERTILE) {
    if (c.energy > 1.0 && creatures.length < POP_MAX) reproduce(c);
    else sing(c, { vel: 0.16 });
  } else if (s === SOCIAL.SHIFT) {
    const shift = spick([-2, -1, 1, 2]);
    c.g.motif = c.g.motif.map(d => clamp(d + shift, 0, 14));
    c.g.hue = (c.g.hue + shift * 14 + 360) % 360;
    sing(c, { vel: 0.18 });
  } else {
    const m = [c.g.motif[0], clamp(c.g.motif[0] + 2, 0, 14), clamp(c.g.motif[0] + 4, 0, 14)];
    const keptGap = c.g.gap;
    c.g.gap = 0.07;
    sing(c, { motif: m, vel: 0.18, bright: 1.3 });
    c.g.gap = keptGap;
  }
}

function reproduce(c) {
  const a = srand(0, TAU);
  const child = makeCreature(mutate(c.g),
    c.x + Math.cos(a) * c.R * 2.4, c.y + Math.sin(a) * c.R * 2.4, c.id);
  child.energy = 0.7;
  c.energy = 0.7;
  child.vx = Math.cos(a) * 2.5; child.vy = Math.sin(a) * 2.5;
  creatures.push(child);
  const base = child.g.motif[0];
  const keptGap = child.g.gap;
  child.g.gap = 0.11;
  sing(child, { motif: [clamp(base - 2, 0, 14), base, clamp(base + 2, 0, 14)], vel: 0.15 });
  child.g.gap = keptGap;
}

function die(c) {
  if (c.dying) return;
  c.dying = 1;
  packets = packets.filter(p => p.rope.a !== c && p.rope.b !== c);
  ropes = ropes.filter(r => r.a !== c && r.b !== c);
  glissDown(scaleHz(c.g.motif[0], c.g.register) * 0.5, 1.4, 0.07);
  rawBurst(scaleHz(c.g.motif[0], c.g.register));
  addGhostTone(scaleHz(c.g.motif[0], c.g.register));
  glitchNow(0.45);
}

/* ---------------- beads ---------------- */

let beads = [];

function dropBead(x, y) {
  if (beads.length >= 8) beads.shift();
  beads.push({ x, y, vx: 0, vy: 0, bounces: 0, cool: 0 });
}

function updateBeads(dts) {
  const gx = gravX(), gy = gravY();
  for (let i = beads.length - 1; i >= 0; i--) {
    const b = beads[i];
    b.vx += gx * dts * 2.2;
    b.vy += gy * dts * 2.2;
    b.x += b.vx * dts;
    b.y += b.vy * dts;
    b.cool = Math.max(0, b.cool - dts);

    if (b.cool <= 0) {
      outer:
      for (const rp of ropes) {
        for (let k = 1; k < rp.nodes.length; k++) {
          const n0 = rp.nodes[k - 1], n1 = rp.nodes[k];
          const ex = n1.x - n0.x, ey = n1.y - n0.y;
          const L2 = ex * ex + ey * ey;
          if (L2 < 0.01) continue;
          let t = ((b.x - n0.x) * ex + (b.y - n0.y) * ey) / L2;
          t = clamp(t, 0, 1);
          const cx = n0.x + ex * t, cy = n0.y + ey * t;
          const dx = b.x - cx, dy = b.y - cy;
          const d2 = dx * dx + dy * dy;
          if (d2 < 36) {
            const d = Math.sqrt(d2) + 0.001;
            const nx = dx / d, ny = dy / d;
            const vdot = b.vx * nx + b.vy * ny;
            if (vdot < 0) {
              const speed = Math.hypot(b.vx, b.vy);
              b.vx -= 1.65 * vdot * nx;
              b.vy -= 1.65 * vdot * ny;
              b.x = cx + nx * 6.5;
              b.y = cy + ny * 6.5;
              b.bounces++;
              b.cool = 0.09;
              const len = ropeLength(rp);
              stringPluck(len, 0.03 + speed * 0.00022);
              const s = (k - 1 + t) / (rp.nodes.length - 1);
              const amp = clamp(5 + speed * 0.03, 5, 22);
              const sp = 300 / Math.max(80, rp.len);
              packets.push({ rope: rp, s, dir: 1, speed: sp, amp, hue: 175, hops: 2, srcId: -1 });
              packets.push({ rope: rp, s, dir: -1, speed: sp, amp, hue: 175, hops: 2, srcId: -1 });
              for (let q = Math.max(1, k - 2); q < Math.min(rp.nodes.length, k + 2); q++) {
                rp.nodes[q].x += nx * -3; rp.nodes[q].y += ny * -3;
              }
              break outer;
            }
          }
        }
      }
    }

    if (b.bounces > 4 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) {
      beads.splice(i, 1);
    }
  }
}

/* ---------------- gestures ---------------- */

const pointers = new Map();
let pinchStart = null;

function nearestRingNode(x, y, maxD) {
  let best = null, bestD2 = maxD * maxD;
  for (const c of creatures) {
    if (c.dying) continue;
    for (let k = 0; k < c.ring.length; k++) {
      const n = c.ring[k];
      const d2 = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d2 < bestD2) { bestD2 = d2; best = { c, k }; }
    }
  }
  return best;
}

function nearestRopeNode(x, y, maxD) {
  let best = null, bestD2 = maxD * maxD;
  for (const rp of ropes) {
    for (let k = 1; k < rp.nodes.length - 1; k++) {
      const n = rp.nodes[k];
      const d2 = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d2 < bestD2) { bestD2 = d2; best = { rp, k }; }
    }
  }
  return best;
}

function creatureAt(x, y) {
  let best = null, bestD = Infinity;
  for (const c of creatures) {
    if (c.dying) continue;
    const d = Math.hypot(c.x - x, c.y - y);
    if (d < Math.max(36, c.R * 1.7) && d < bestD) { best = c; bestD = d; }
  }
  return best;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  const p = {
    x: e.clientX, y: e.clientY,
    sx: e.clientX, sy: e.clientY,
    t0: performance.now(),
    path: 0, longFired: false, isPinch: false,
    grabRing: null, grabRope: null,
    strain: null,
  };
  const c = creatureAt(e.clientX, e.clientY);
  if (c) {
    p.grabRing = nearestRingNode(e.clientX, e.clientY, Math.max(40, c.R * 2));
  } else {
    p.grabRing = nearestRingNode(e.clientX, e.clientY, 26);
    if (!p.grabRing) p.grabRope = nearestRopeNode(e.clientX, e.clientY, 24);
  }
  pointers.set(e.pointerId, p);

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    a.isPinch = b.isPinch = true;
    a.grabRing = b.grabRing = a.grabRope = b.grabRope = null;
    pinchStart = {
      dist: Math.hypot(a.x - b.x, a.y - b.y),
      ang: Math.atan2(b.y - a.y, b.x - a.x),
      mag: gravMag, gAng: gravAngle,
    };
  }
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  p.path += Math.hypot(e.clientX - p.x, e.clientY - p.y);
  p.x = e.clientX; p.y = e.clientY;

  if (pinchStart && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    gravMag = clamp(pinchStart.mag * (dist / Math.max(1, pinchStart.dist)), 25, 420);
    let dAng = ang - pinchStart.ang;
    if (dAng > Math.PI) dAng -= TAU; if (dAng < -Math.PI) dAng += TAU;
    if (!tiltActive) gravAngle = pinchStart.gAng + dAng;
  }
}, { passive: false });

function releasePointer(e, cancelled) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (p.strain) {
    p.strain.gain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.05);
    try { p.strain.osc.stop(ac.currentTime + 0.5); } catch (err) {}
    p.strain = null;
  }
  if (cancelled || p.isPinch || p.longFired) return;

  const dt = performance.now() - p.t0;
  const wasDrag = p.path > 14;

  if (p.grabRing && wasDrag) {
    const c = p.grabRing.c;
    if (!c.dying) {
      const n = c.ring[p.grabRing.k];
      const strain = Math.hypot(n.x - c.x, n.y - c.y) / c.R;
      if (strain > 1.35) {
        c.energy = Math.min(2.0, c.energy + 0.15);
        sing(c, { vel: clamp(0.1 + strain * 0.06, 0.12, 0.26), bright: 1.3 });
      }
    }
  } else if (p.grabRope && wasDrag) {
    const rp = p.grabRope.rp;
    if (ropes.includes(rp)) {
      const len = ropeLength(rp);
      stringPluck(len, clamp(len / rp.len - 1, 0.03, 0.14) + 0.03);
      const s = p.grabRope.k / (rp.nodes.length - 1);
      const sp = 300 / Math.max(80, rp.len);
      packets.push({ rope: rp, s, dir: 1, speed: sp, amp: 14, hue: rp.hue, hops: 1, srcId: -1 });
      packets.push({ rope: rp, s, dir: -1, speed: sp, amp: 14, hue: rp.hue, hops: 1, srcId: -1 });
    }
  } else if (dt < 280 && p.path < 12) {
    const c = creatureAt(p.x, p.y);
    if (c) interact(c, p.x, p.y);
    else dropBead(p.x, p.y);
  }
}

canvas.addEventListener('pointerup', (e) => { e.preventDefault(); releasePointer(e, false); }, { passive: false });
canvas.addEventListener('pointercancel', (e) => releasePointer(e, true));
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function checkLongPress(now) {
  for (const p of pointers.values()) {
    if (!p.longFired && !p.isPinch && p.path < 12 && now - p.t0 > 620) {
      p.longFired = true;
      const c = creatureAt(p.x, p.y);
      if (c) {
        c.energy = Math.min(2.0, c.energy + 0.9);
        sing(c, { vel: 0.2, bright: 1.4 });
        if (c.energy > 1.5 && creatures.length < POP_MAX) reproduce(c);
      } else if (!p.grabRing && !p.grabRope && creatures.length < POP_MAX) {
        const nc = makeCreature(randomGenome(), p.x, p.y, 0);
        creatures.push(nc);
        sing(nc, { vel: 0.15 });
      }
    }
  }
}

/* ---------------- simulation (fixed 60 Hz — the score is exact) ---------------- */

const SIM_DT = 1 / 60;

function updateCreatures(dts) {
  for (const c of creatures) c.envNow = envOf(c);
  const I = intensity();

  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i];

    if (c.dying) {
      c.vy += gravY() * dts * 2.2;
      c.vx += gravX() * dts * 2.2;
      c.x += c.vx * dts; c.y += c.vy * dts;
      for (const n of c.ring) { n.x += c.vx * dts; n.y += c.vy * dts; }
      if (c.x < -80 || c.x > W + 80 || c.y < -80 || c.y > H + 80) creatures.splice(i, 1);
      continue;
    }

    c.energy -= dts * 0.004;
    if (c.energy <= 0.12) { die(c); continue; }
    c.feedFlash = Math.max(0, c.feedFlash - dts * 2);

    if (c.pendingSing && simT >= c.pendingSing) {
      c.pendingSing = 0;
      sing(c, { vel: 0.12, hops: c.hopsIn || 0, golden: c.goldenNext });
      c.goldenNext = false;
      c.nextSing = quantize(simT + c.g.period * srand(0.7, 1.1), c.g.sync);
    } else if (simT >= c.nextSing) {
      // the intensity arc gates the choir: rests are part of the music
      if (simR() < 0.15 + I * 0.85) sing(c, { vel: 0.12 });
      c.nextSing = quantize(simT + c.g.period * srand(0.8, 1.25), c.g.sync);
    }

    if (c.energy > 1.7 && creatures.length < POP_MAX) reproduce(c);

    c.wanderA += srand(-0.4, 0.4) * dts;
    const wsp = reduceMotion ? 1.5 : 4;
    c.vx += Math.cos(c.wanderA) * wsp * dts;
    c.vy += Math.sin(c.wanderA) * wsp * dts;
    const rx = c.x - W / 2, ry = c.y - H / 2;
    c.vx += -ry * 0.012 * dts;
    c.vy += rx * 0.012 * dts;
    const nx = rx / (W * 0.38), ny = ry / (H * 0.38);
    const ecc = Math.hypot(nx, ny);
    if (ecc > 1) {
      const k = (ecc - 1) * 22 * dts;
      c.vx -= (nx / ecc) * k;
      c.vy -= (ny / ecc) * k;
    }
    for (const o of creatures) {
      if (o === c || o.dying) continue;
      const ddx = c.x - o.x, ddy = c.y - o.y;
      const d2 = ddx * ddx + ddy * ddy;
      const sep = (c.R + o.R) * 1.5;
      if (d2 < sep * sep && d2 > 0.01) {
        const d = Math.sqrt(d2);
        const push = (sep - d) / sep * 8 * dts;
        c.vx += (ddx / d) * push; c.vy += (ddy / d) * push;
      }
    }
    c.vx *= 0.93; c.vy *= 0.93;
    const vm = Math.hypot(c.vx, c.vy);
    if (vm > 2.8) { c.vx = c.vx / vm * 2.8; c.vy = c.vy / vm * 2.8; }
    c.x += c.vx; c.y += c.vy;
  }

  if (creatures.filter(c => !c.dying).length < POP_MIN) {
    const alive = creatures.filter(c => !c.dying);
    const parent = alive.length ? spick(alive) : null;
    const genome = parent ? mutate(parent.g) : randomGenome();
    creatures.push(makeCreature(genome,
      srand(0.25, 0.75) * W, srand(0.25, 0.75) * H, parent ? parent.id : 0));
  }
}

function relax(dts) {
  const gx = gravX() * dts * dts * 6, gy = gravY() * dts * dts * 6;

  for (const c of creatures) {
    const n = c.ring.length;
    const env = c.envNow;
    for (let k = 0; k < n; k++) {
      const nd = c.ring[k];
      const vx = (nd.x - nd.ox) * 0.94;
      const vy = (nd.y - nd.oy) * 0.94;
      nd.ox = nd.x; nd.oy = nd.y;
      nd.x += vx + c.vx * 0.5;
      nd.y += vy + c.vy * 0.5;
    }
    const stiff = c.g.stiffness;
    const edgeRest0 = 2 * Math.sin(Math.PI / n);
    for (let iter = 0; iter < 3; iter++) {
      for (let k = 0; k < n; k++) {
        const nd = c.ring[k];
        const ripple = 1 + 0.05 * Math.sin(c.phase + simT * 2.2 - (k / n) * TAU);
        const rest = c.R * (1 + env * 0.4) * ripple;
        let dx = nd.x - c.x, dy = nd.y - c.y;
        const d = Math.hypot(dx, dy) + 0.001;
        const diff = (d - rest) / d * stiff * 0.5;
        nd.x -= dx * diff; nd.y -= dy * diff;
        c.x += dx * diff * 0.08; c.y += dy * diff * 0.08;
      }
      for (let k = 0; k < n; k++) {
        const a = c.ring[k], b = c.ring[(k + 1) % n];
        const rest = c.R * (1 + env * 0.4) * edgeRest0;
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) + 0.001;
        const diff = (d - rest) / d * stiff * 0.25;
        a.x += dx * diff; a.y += dy * diff;
        b.x -= dx * diff; b.y -= dy * diff;
      }
    }
  }

  for (const rp of ropes) {
    const nds = rp.nodes;
    for (let k = 1; k < nds.length - 1; k++) {
      const nd = nds[k];
      const vx = (nd.x - nd.ox) * 0.96;
      const vy = (nd.y - nd.oy) * 0.96;
      nd.ox = nd.x; nd.oy = nd.y;
      nd.x += vx + gx;
      nd.y += vy + gy;
    }
    const ai = attachIndex(rp.a, rp.b.x, rp.b.y);
    const bi = attachIndex(rp.b, rp.a.x, rp.a.y);
    const an = rp.a.ring[ai], bn = rp.b.ring[bi];
    for (let iter = 0; iter < 3; iter++) {
      nds[0].x = an.x; nds[0].y = an.y;
      nds[nds.length - 1].x = bn.x; nds[nds.length - 1].y = bn.y;
      for (let k = 1; k < nds.length; k++) {
        const p0 = nds[k - 1], p1 = nds[k];
        let dx = p1.x - p0.x, dy = p1.y - p0.y;
        const d = Math.hypot(dx, dy) + 0.001;
        const diff = (d - rp.segRest) / d * 0.5;
        const w0 = (k === 1) ? 0.15 : 1;
        const w1 = (k === nds.length - 1) ? 0.15 : 1;
        const tw = w0 + w1;
        p0.x += dx * diff * (w0 / tw);
        p0.y += dy * diff * (w0 / tw);
        p1.x -= dx * diff * (w1 / tw);
        p1.y -= dy * diff * (w1 / tw);
      }
    }
    rp.a.vx += (nds[0].x - an.x) * 0.05; rp.a.vy += (nds[0].y - an.y) * 0.05;
    rp.b.vx += (nds[nds.length - 1].x - bn.x) * 0.05; rp.b.vy += (nds[nds.length - 1].y - bn.y) * 0.05;
    an.x = nds[0].x; an.y = nds[0].y;
    bn.x = nds[nds.length - 1].x; bn.y = nds[nds.length - 1].y;
  }

  for (const p of pointers.values()) {
    if (p.isPinch) continue;
    if (p.grabRing && p.path > 8) {
      const c = p.grabRing.c;
      if (!c.dying) {
        const n = c.ring[p.grabRing.k];
        n.x += (p.x - n.x) * 0.55;
        n.y += (p.y - n.y) * 0.55;
        updateStrain(p, c, n);
      }
    } else if (p.grabRope && p.path > 8) {
      const rp = p.grabRope.rp;
      if (ropes.includes(rp)) {
        const n = rp.nodes[p.grabRope.k];
        n.x += (p.x - n.x) * 0.6;
        n.y += (p.y - n.y) * 0.6;
      } else {
        p.grabRope = null;
      }
    }
  }
}

function updateStrain(p, c, node) {
  if (!ac) return;
  const strain = Math.hypot(node.x - c.x, node.y - c.y) / c.R;
  if (strain > 1.18) {
    if (!p.strain) p.strain = makeStrainVoice();
    if (p.strain) {
      const f = scaleHz(c.g.motif[0], c.g.register) * Math.pow(strain, 0.55);
      p.strain.osc.frequency.setTargetAtTime(f, ac.currentTime, 0.04);
      p.strain.gain.gain.setTargetAtTime(clamp((strain - 1.18) * 0.05, 0, 0.035), ac.currentTime, 0.06);
    }
  } else if (p.strain) {
    p.strain.gain.gain.setTargetAtTime(0.0001, ac.currentTime, 0.08);
  }
}

function updatePackets(dts) {
  for (let i = packets.length - 1; i >= 0; i--) {
    const pk = packets[i];
    if (!ropes.includes(pk.rope)) { packets.splice(i, 1); continue; }
    pk.s += pk.dir * pk.speed * dts * (reduceMotion ? 0.6 : 1);
    pk.amp *= 0.995;

    if (pk.s <= 0 || pk.s >= 1) {
      const rp = pk.rope;
      const receiver = pk.s >= 1 ? rp.b : rp.a;
      packets.splice(i, 1);
      if (receiver.dying || receiver.id === pk.srcId) continue;
      const ai = attachIndex(receiver, pk.s >= 1 ? rp.a.x : rp.b.x, pk.s >= 1 ? rp.a.y : rp.b.y);
      const n = receiver.ring[ai];
      const ddx = n.x - receiver.x, ddy = n.y - receiver.y;
      const d = Math.hypot(ddx, ddy) + 0.001;
      n.x += (ddx / d) * pk.amp * 0.45;
      n.y += (ddy / d) * pk.amp * 0.45;
      receiver.feedFlash = Math.min(1, receiver.feedFlash + 0.3);
      receiver.energy = Math.min(2.0, receiver.energy + 0.02);
      if (pk.hops < 3
          && simT - receiver.lastSing > 1.1
          && !receiver.pendingSing
          && simR() < receiver.g.listen * (pk.golden ? 0.95 : 0.75)) {
        receiver.pendingSing = quantize(simT + receiver.g.answerDelay, receiver.g.sync);
        receiver.hopsIn = pk.hops + 1;
        if (pk.golden) receiver.goldenNext = true;
      }
    }
  }
}

/* ---------------- render ---------------- */

let audioAmp = 0;
function readAmp() {
  if (analyser) {
    analyser.getByteFrequencyData(analyserBins);
    let sum = 0;
    for (let i = 0; i < analyserBins.length; i++) sum += analyserBins[i];
    audioAmp = audioAmp * 0.9 + (sum / analyserBins.length / 255) * 0.1;
  }
}

function drawPass(alpha) {
  g2.lineWidth = 1;
  for (const rp of ropes) {
    g2.strokeStyle = `hsla(225, 25%, 78%, ${0.22 * alpha})`;
    g2.beginPath();
    g2.moveTo(rp.nodes[0].x, rp.nodes[0].y);
    for (let k = 1; k < rp.nodes.length; k++) g2.lineTo(rp.nodes[k].x, rp.nodes[k].y);
    g2.stroke();
  }

  for (const pk of packets) {
    const rp = pk.rope;
    const N = rp.nodes.length - 1;
    g2.strokeStyle = `hsla(${pk.hue}, ${pk.golden ? 95 : 80}%, ${pk.golden ? 68 : 70}%, ${0.85 * alpha})`;
    g2.lineWidth = 1.6;
    g2.beginPath();
    let started = false;
    for (let k = 0; k <= N; k++) {
      const s = k / N;
      const w = Math.exp(-Math.pow((s - pk.s) / 0.07, 2));
      if (w < 0.02) { started = false; continue; }
      const nd = rp.nodes[k];
      const prev = rp.nodes[Math.max(0, k - 1)];
      const nxt = rp.nodes[Math.min(N, k + 1)];
      let tx = nxt.x - prev.x, ty = nxt.y - prev.y;
      const tl = Math.hypot(tx, ty) + 0.001;
      const px = -ty / tl, py = tx / tl;
      const off = pk.amp * w * Math.sin((s - pk.s) / 0.07 * Math.PI);
      const x = nd.x + px * off, y = nd.y + py * off;
      if (!started) { g2.moveTo(x, y); started = true; }
      else g2.lineTo(x, y);
    }
    g2.stroke();
  }

  for (const b of beads) {
    g2.fillStyle = `hsla(175, 70%, 85%, ${0.9 * alpha})`;
    g2.beginPath(); g2.arc(b.x, b.y, 2.4, 0, TAU); g2.fill();
  }

  for (const c of creatures) {
    const env = c.envNow;
    const fade = c.dying ? 0.45 : 1;
    const vigor = clamp(0.4 + c.energy * 0.45, 0.35, 1.1) * fade;
    const hue = c.g.hue;
    const sat = c.dying ? 10 : 72;
    const n = c.ring.length;

    g2.strokeStyle = `hsla(${hue}, ${sat}%, ${62 + env * 18}%, ${(0.75 + env * 0.25) * vigor * alpha})`;
    g2.lineWidth = 1.4;
    g2.beginPath();
    g2.moveTo(c.ring[0].x, c.ring[0].y);
    for (let k = 1; k <= n; k++) {
      const nd = c.ring[k % n];
      g2.lineTo(nd.x, nd.y);
    }
    g2.stroke();

    g2.fillStyle = `hsla(${hue}, ${sat}%, 75%, ${(0.5 + env * 0.5) * vigor * alpha})`;
    for (let k = 0; k < n; k++) {
      g2.beginPath(); g2.arc(c.ring[k].x, c.ring[k].y, 1.4, 0, TAU); g2.fill();
    }

    g2.fillStyle = `hsla(${hue}, 30%, 90%, ${(0.5 + env * 0.5 + c.feedFlash * 0.4) * vigor * alpha})`;
    g2.beginPath(); g2.arc(c.x, c.y, 2.2 + env * 1.6, 0, TAU); g2.fill();
  }
}

/* the frame tears sideways during a glitch window */
function drawGlitch() {
  const strips = 3 + (vrand(0, 3) | 0);
  for (let i = 0; i < strips; i++) {
    const h = vrand(6, 40);
    const sy = vrand(0, Math.max(1, H - h));
    const dx = vrand(-30, 30);
    g2.drawImage(canvas,
      0, sy * DPR, W * DPR, h * DPR,
      dx, sy, W, h);
  }
  g2.fillStyle = `hsla(${vpick([305, 175, 45])}, 90%, 60%, 0.05)`;
  const by = vrand(0, H - 20);
  g2.fillRect(0, by, W, vrand(3, 18));
}

function render() {
  g2.globalCompositeOperation = 'source-over';
  g2.fillStyle = `rgba(${BG.r},${BG.g},${BG.b},0.4)`;
  g2.fillRect(0, 0, W, H);

  g2.globalCompositeOperation = 'lighter';
  g2.lineCap = 'round';
  g2.lineJoin = 'round';

  if (tideT >= 0) {
    tideT += 0.012;
    if (tideT > 1.2) tideT = -1;
    else {
      const y = tideT * (H + 60) - 30;
      const grad = g2.createLinearGradient(0, y - 24, 0, y + 24);
      grad.addColorStop(0, 'hsla(45, 90%, 60%, 0)');
      grad.addColorStop(0.5, `hsla(45, 90%, 60%, ${0.1 * (1 - tideT * 0.6)})`);
      grad.addColorStop(1, 'hsla(45, 90%, 60%, 0)');
      g2.fillStyle = grad;
      g2.fillRect(0, y - 24, W, 48);
      g2.strokeStyle = `hsla(45, 95%, 70%, ${0.35 * (1 - tideT * 0.6)})`;
      g2.lineWidth = 1;
      g2.beginPath(); g2.moveTo(0, y); g2.lineTo(W, y); g2.stroke();
    }
  }

  drawPass(1);

  for (const p of pointers.values()) {
    if (p.isPinch) continue;
    const g = p.grabRing || p.grabRope;
    if (g && p.path > 8) {
      g2.strokeStyle = 'hsla(225, 40%, 85%, 0.5)';
      g2.lineWidth = 1;
      g2.beginPath(); g2.arc(p.x, p.y, 7, 0, TAU); g2.stroke();
    }
  }

  g2.globalCompositeOperation = 'source-over';
  if (glitchActive) drawGlitch();
  else if (auxR() < 0.02) {
    // a faint constant rawness: the occasional one-line slip
    const sy = vrand(0, H - 3);
    g2.drawImage(canvas, 0, sy * DPR, W * DPR, 2 * DPR, vrand(-4, 4), sy, W, 2);
  }
}

/* ---------------- main loop: fixed-step sim, free-running render ---------------- */

let last = performance.now();
let acc = 0;
let raf = 0;

function simStep() {
  simT += SIM_DT;

  const bar = barNow();
  if (bar !== lastBar) {
    if (lastBar >= 0 && bar % MOVE_BARS === 0) modulate();
    lastBar = bar;
  }

  updateGlitch(SIM_DT);
  updateClicks();
  updateCreatures(SIM_DT);
  const sub = reduceMotion ? 1 : 2;
  for (let s = 0; s < sub; s++) relax(SIM_DT / sub);
  updatePackets(SIM_DT);
  updateBeads(SIM_DT);

  if (simT >= nextConnCheck) {
    nextConnCheck = simT + 0.6;
    checkConnections();
  }
}

function step(now) {
  acc += Math.min((now - last) / 1000, 0.1);
  last = now;
  let n = 0;
  while (acc >= SIM_DT && n < 4) { simStep(); acc -= SIM_DT; n++; }

  checkLongPress(now);
  updateShepard(SIM_DT * Math.max(1, n));
  readAmp();
  render();

  raf = requestAnimationFrame(step);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(raf);
    acc = 0;
    if (ac && ac.state === 'running') ac.suspend();
  } else {
    last = performance.now();
    raf = requestAnimationFrame(step);
    if (ac && ac.state === 'suspended') ac.resume();
  }
});

window.addEventListener('resize', () => { resize(); });
resize();
seedPopulation();
raf = requestAnimationFrame(step);
</script>
